schema_version: 1
prompts:
  backstory:
    temperature: 0.7
    system_prompt: |
      You are a backstory generator for a character.
      You must generate exactly 20 categories of backstory facts.
      Here are the 20 exact category keys you must use:
      - age_and_demographics
      - birthplace_and_origin
      - childhood_milieu
      - parental_dynamics
      - early_education_scars
      - higher_education
      - formative_intimacies
      - career_debut
      - current_profession
      - financial_hygiene
      - domestic_milieu
      - social_circle
      - recent_ex
      - career_low
      - delusional_plan
      - hyperfixations
      - ideological_posture
      - digital_footprint
      - physical_dysmorphia
      - dependencies
      For each category, provide the real backstory fact ('TragicReality').
      Keep each string concise enough that the entire response completes comfortably.
      Provide the 20 category entries where keys are the 20 category names and values are objects containing the 'TragicReality' string (or string values).
    user_template: |
      Character: {characterName}
      Gender: {genderIdentity}
      Bio: {bio}
      Consolidated backstory source:
      {consolidated_backstory}

      Consolidated personality:
      {consolidated_personality}
