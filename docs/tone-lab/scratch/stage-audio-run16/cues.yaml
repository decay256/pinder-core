    segments:
      - {mode: smug, text: "At least a widow's rose stays stiff.", react: groan}
      - {mode: spiral, text: "Sorry, rigor mortis joke, death isn't sexy, and I'm watching my last chance with you die while I explain corpse mechanics.", react: laugh}
  - speaker: sable
    segments:
      - {mode: deadpan, pause: 0.3, text: "Stiff corpses. In my inbox.", react: laugh}
      - {mode: amused, text: "I rehearsed three snappy replies in my bathroom mirror, and you just killed all of them.", react: aww}
  - speaker: zyx
    segments:
      - {mode: plead, text: "You rehearsed for me?", react: ooh}
      - {mode: patter, text: "I want to watch you delete texts forever. I've already pictured us sharing a charger.", react: titter}
      - {mode: spiral, text: "Meaning U S B C, not a medieval horse. Please say I'm your favourite match.", react: laugh}
  - speaker: sable
    segments:
      - {mode: withering, text: "Sharing a charger? We haven't even swapped postcodes and you're moving in.", react: laugh}
      - {mode: deadpan, text: "Take a breath, cling-film, you're losing me.", react: laugh}
  - speaker: zyx
    segments:
      - {mode: plead, text: "Be my partner in crime. Let's delete this app right now. Say you feel it too?", react: aww}
  - speaker: sable
    segments:
      - {mode: kill, text: "Partner in crime? Keep begging, Hallmark, and my credit card won't be the only thing declining.", react: huge}
  - speaker: zyx
    segments:
      - {mode: patter, text: "Let me clear your twenty-nine percent A P R.", react: titter}
