  - speaker: sable
    segments:
      - {mode: amused, text: "A nest of dead vouchers and a prosthetic hooter?", react: laugh}
      - {mode: deadpan, text: "I'm a personal brand strategist. My finger is on the block button.", react: titter}
  - speaker: zyx
    segments:
      - {mode: plead, text: "Gag me so I finally shut up, photograph me in bad lighting, and please note: the squirrel in my wall knows how I die.", react: laugh}
  - speaker: sable
    segments:
      - {mode: deadpan, text: "Bad lighting? Count to five, wizard boy.", react: titter}
      - {mode: withering, text: "The typing dots are stopping forever, so assume I've died.", react: laugh}
      - {mode: kill, pause: 0.5, text: "And tattoo my funeral wreath on your bellend.", react: huge}
