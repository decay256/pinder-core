# Performance script for run 16: one entry per turn on stage.
#
# Consecutive messages from the same speaker are one turn: on stage nobody stops and
# restarts between two texts, they keep the thought going. Each turn is rendered as one
# utterance, so intonation runs through it; laughs are cut in afterwards at the {react}
# points while the speaker holds.
#
# Script markup (stripped before synthesis; the words are Carr's):
#   /  //  ///   a beat of about 0.25, 0.5, 0.9 s. The edit sets the silence there to that
#                length; the synthesis text gets a comma or a full stop so the model
#                phrases it.
#   *word*       the operative word: the one the line turns on, stressed.
#   {react}      a laugh point: the crowd reaction after it (titter laugh big huge ooh
#                groan aww). The phrase before it should land, pitch falling.
#   ^            after a question: it genuinely asks, pitch rises. Without it a question
#                is rhetorical or withering and falls like a statement.
#
# pre    silence before the turn starts (taking a moment before replying)
# pace   slow | measured | brisk | racing  (target speaking rate over the turn)
# act    the acting note, read by the voice model after the voice description
#
# Read as a two-hander: Zyx is the fast, needy one who wins the crowd with honesty and
# then ruins it by explaining; Sable is the slow one who never raises her voice, lets the
# silence do the work and puts the knife in on the last word.

turns:
