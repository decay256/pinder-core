that's what the app does to everyone anyway. The interest meter is real. The dice are real. Dating here is openly what it secretly is on every app: a game, and you're probably losing.\n\nSo it's a farce: absurd, fast, filthy, and cynical about the app. But it is never cynical about the people. The comedy only works if the reader believes these two are real people who want something real and are hiding it badly. The satire is aimed at the machine and at the defences people build to survive it. It is never aimed at the need underneath.\n\n## What the reader should feel\n\nSomeone reads a whole chat on their phone in about five minutes. In that time they get to know two people.\n\nThey laugh at them first: at the act each one puts on, the weird, specific thing each keeps doing. Then they find out why each one does it, and the laughing changes. It doesn't stop, but now it's affectionate, or it hurts. Then they watch the two acts run into each other.\n\nIf the two connect, the reader should feel it was earned. They know what each of them was afraid of, and they watched each one put the act down for the other. It's tender and still funny, and the reader knows exactly why it's these two and not anyone else.\n\nIf they don't connect, the reader should laugh and think: yes, that's why dating is fucked. They can see both people completely. They can see the two might have been good for each other. And they watch each one's defence land exactly on the other one's sore spot. Nobody is the villain. It's the act, the fear, and the app.\n\nWinning or losing doesn't matter. A chat that ends in a date and leaves the reader cold has failed. An unmatch that makes them laugh and wince for a week has worked.\n\nWhen the chat is over, someone who has read only the chat is asked, for each of the two: what are they afraid of, what do they do so they don't have to feel it, where does that come from, and what did they do at the end? If they can't answer, the chat failed, however good the line n the middle, a piece of where the habit came from gets out, and after that the same habit lands differently. Once the reader knows that Otto's dad graded his drawings, his school reports and, once, his mother, every rating is a little sad, and the reader starts watching for them.\n\n**Tenderness comes from understatement.** The most naked line is the shortest and the plainest one in the chat, and you can often hear it in what's missing. After forty messages of ratings, this is the line:\n\n> Otto_Mat: you're Dolores\n\n**The cynical laugh comes from inevitability.** When it falls apart, it falls apart the only way it could have: each one's habit confirms exactly what the other was afraid of, and both of them get precisely the rejection they predicted. The reader could have called it, and that's what makes it funny.\n\n> Dolores_77: you'd rate a funeral\n> Otto_Mat: 4. bad catering\n\n**A payoff is the reader putting it together.** A setup is noticed but not understood: it looks like a joke or a throwaway. It comes back once in the middle so it stays alive. At the payoff it turns out to mean something else, and nobody in the chat explains it, because the reader gets to. Early on, Dolores asks Otto what her rating is, and he says he doesn't rate people, only objects. At the end:\n\n> Dolores_77: so what am I\n> Otto_Mat: I'm not rating you\n> Otto_Mat: I'd have to be objective\n\n**Timing is in the message breaks.** A new message is a pause: the punchline goes in its own message, after the line that sets it up. A one-word reply to a long message is a reaction shot. \"ignore that\" is a punchline. Status flips are funny: whoever was chasing is suddenly the one being chased. And two turns at the same temperature in a row kill the momentum, so hot follows cold and long follows short.\n\n**What kills it.** Characters explaining their feelings. Therapy-speak. Quips that fill a turn without giving anything away. Explaining a callback. Conceding at the first hit. Generic fi const VIEWS = [["chat", "Chat"], ["reuben", "Reuben"], ["brick", "Brick"], ["how", "How it was made"]];
let st = { w: D.writers[0].id, v: "chat" };

function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  for (const w of D.writers) for (const [v] of VIEWS)
    if (h === w.id + "-" + v) { st = { w: w.id, v }; return; }
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function words(s) { return (s.trim().match(/\S+/g) || []).length; }

function chatHTML(text) {
  const me = D.player, them = D.match;
  const re = new RegExp("^\\s*(?:\\*\\*)?(" + me + "|" + them + ")(?:\\*\\*)?\\s*:\\s*(?:\\*\\*)?\\s*(.*)$");
  let out = [], last = null;
  for (const raw of text.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) continue;
    const m = line.match(re);
    if (m) {
      const who = m[1] === me ? "me" : "them";
      if (who !== last) out.push(`<div class="who ${who}">${esc(m[1])}</div>`);
      out.push(`<div class="b ${who}">${esc(m[2].replace(/\*\*$/, ""))}</div>`);
      last = who;
    } else if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
      continue;
    } else {
      out.push(`<div class="note">${esc(line.replace(/^#+\s*/, "").replace(/^\*+|\*+$/g, ""))}</div>`);
      last = null;
    }
  }
  return `<div class="thread">${out.join("")}</div>`;
}

  catch (e) { return `<pre class="prompt">${esc(md)}</pre>`; }
}
