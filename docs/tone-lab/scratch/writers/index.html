<script>
const D = {"player": "Reuben_404", "match": "Brick_haus", "names": {"reuben": "Reuben_404", "brick": "Brick_haus"}, "pron": {"reuben": "him", "brick": "her"}, "briefs": {"a07daabdcd": "Pinder: How Not to Cock It Up\nThe Premise\nPinder is a dating app where everyone on it is a dick. Not metaphorically—though if you’ve ever been on Hinge at two in the morning, it’s a distinction without a difference. Every character is a literal, sentient penis with a smartphone, an insecurity it’s been nursing since puberty, and a little outfit it thinks is doing some heavy lifting.\n\nBecause they’re actual genitals, the things men usually spend three dates trying to hide are just the opening gambit. Length, girth, veins, a perilous left-hand curve, which bollock has given up on gravity—on Pinder, that’s not subtext, it’s weather talk. It’s R-rated, it’s fast, and it’s deeply filthy.\n\nThe joke, of course, is that we haven’t exaggerated anything.\n\nA real dating app takes a lonely, frightened human being who just wants to be held, reduces them to four photos and a credit score, and turns love into a fruit machine with an interest meter and a pair of dice. And like any casino, the house only makes money if you lose. If you find someone, you delete the app; if you stay miserable, you’re a subscriber. So the app trains you to be awful. It rewards the copy-pasted opener you’ve already sent to forty strangers, it crams your entire human worth into three inches of glass, and it keeps the next replacement one swipe away so nobody ever has to be brave.\n\nPinder just takes the metaphor and removes the trousers. The characters are reduced to their genitals because that’s what the algorithm does to you anyway.\n\nThe Target\nEvery joke needs a target. Here is the one rule you cannot break: the target is the app, and the ridiculous armour people wear to survive it. The target is never the loneliness underneath.\n\nIt’s a farce, so we are completely cynical about the machine. We are never cynical about the people. If the reader doesn't believe these two ridiculous, dressed-up cocks are real people who desperately want to be loved and are catastrophic at asking for it, the comedy dies. We punch at the delusion, not the wound. Nobody is the villain: when it goes wrong, it wasn’t malice. It was the act, the fear, and the app.", "97a7ebc9ba": "Pinder: How Not to Cock It Up\nThe Premise\nPinder is a dating app where everyone on it is a dick. Not metaphorically—though if you’ve ever been on Hinge at two in the morning, it’s a distinction without a difference. Every character is a literal, sentient penis with a smartphone, an insecurity it’s been nursing since puberty, and a little outfit it thinks is doing some heavy lifting.\n\nBecause they’re actual genitals, the things men usually spend three dates trying to hide are just the opening gambit. Length, girth, veins, a perilous left-hand curve, which bollock has given up on gravity—on Pinder, that’s not subtext, it’s weather talk. It’s R-rated, it’s fast, and it’s deeply filthy.\n\nThe joke, of course, is that we haven’t exaggerated anything.\n\nA real dating app takes a lonely, frightened human being who just wants to be held, reduces them to four photos and a credit score, and turns love into a fruit machine with an interest meter and a pair of dice. And like any casino, the house only makes money if you lose. If you find someone, you delete the app; if you stay miserable, you’re a subscriber. So the app trains you to be awful. It rewards the copy-pasted opener you’ve already sent to forty strangers, it crams your entire human worth into three inches of glass, and it keeps the next replacement one swipe away so nobody ever has to be brave.\n\nPinder just takes the metaphor and removes the trousers. The characters are reduced to their genitals because that’s what the algorithm does to you anyway.\n\nThe Target\nIn The Naked Jape, we talked about how every joke needs a target. Here is the one rule you cannot break: the target is the app, and the ridiculous armour people wear to survive it. The target is never the loneliness underneath.\n\nIt’s a farce, so we are completely cynical about the machine. We are never cynical about the people. If the reader doesn't believe these two ridiculous, dressed-up cocks are real people who desperately want to be loved and are catastrophic at asking for it, the comedy dies. We punch at the delusion, not the wound. Nobody is the villain: when it goes wrong, it wasn’t malice. It was the act, the fear, and the app. Even I have standards, and I once hid three million quid in Jersey.", "496e7894de": "# Pinder: the brief\n\nYou're joining the team that writes Pinder's chats. This brief tells you what Pinder is and what we want a reader to feel. Everything in it is here because a chat without it didn't work.\n\n## What Pinder is\n\nPinder is a game, and it's also a piece of satire. It looks exactly like a dating app: profiles, matches, a chat window, and a little meter that shows how interested the other one is. Everyone on it is a dick. Not a man: a dick. A sentient penis with a phone, a profile, an outfit or accessory it thinks helps, and a body it has been apologising for since puberty. They know what they are, and so does everyone else, so length, girth, curve, veins and which ball hangs lower aren't subtext on Pinder, they're small talk. It is R-rated and it can be very filthy.\n\nThe joke underneath is that this is barely an exaggeration. Dating apps take lonely, frightened, hopeful people and turn them into a few photos and a bio. They turn wanting to be loved into a game with a score. And they make their money when you don't find anyone, because then you come back. So at one in the morning people perform a version of themselves they think might be wanted, to strangers who are doing the same. They're hurt, they're hopeful, they're horny, and they're bad at it, and the app makes all of it worse: it rewards the opener you've sent to forty people, it puts your whole worth into what fits on a screen, and it keeps the next match one swipe away, so nobody ever has to stay. Pinder makes all of that literal. The characters are reduced to their genitals because that's what the app does to everyone anyway. The interest meter is real. The dice are real. Dating here is openly what it secretly is on every app: a game, and you're probably losing.\n\nSo it's a farce: absurd, fast, filthy, and cynical about the app. But it is never cynical about the people. The comedy only works if the reader believes these two are real people who want something real and are hiding it badly. The satire is aimed at the machine and at the defences people build to survive it. It is never aimed at the need underneath.\n\n## What the reader should feel\n\nSomeone reads a whole chat on their phone. In that time they get to know two people.\n\nThey laugh at them first: at the act each one puts on, the weird, specific thing each keeps doing. Then they find out why each one does it, and the laughing changes. It doesn't stop, but now it's affectionate, or it hurts. Then they watch the two acts run into each other.\n\nIf the two connect, the reader should feel it was earned. They know what each of them was afraid of, and they watched each one put the act down for the other. It's tender and still funny, and the reader knows exactly why it's these two and not anyone else.\n\nIf they don't connect, the reader should laugh and think: yes, that's why dating is fucked. They can see both people completely. They can see the two might have been good for each other. And they watch each one's defence land exactly on the other one's sore spot. Nobody is the villain. It's the act, the fear, and the app.\n\nWinning or losing doesn't matter. A chat that ends in a date and leaves the reader cold has failed. An unmatch that makes them laugh and wince for a week has worked.\n\nWhen the chat is over, someone who has read only the chat is asked, for each of the two: what are they afraid of, what do they do so they don't have to feel it, where does that come from, and what did they do at the end? If they can't answer, the chat failed, however good the lines were."}, "runs": [{"id": "v22", "label": "Run 22: no writers", "about": "Run 22. Run 21 again (Reuben and Brick on seed 23, the balance, T42 and M10, template v2) with no writers: Claude writes the two characters once, with no persona, from Pinder's premise and the game's notes, and one chat is written from them. The premise loses its two lines in one comedian's voice.", "profiles_from": "", "tally": {"points": [1, 1, 0, 1, -1, 1, -1, -1, 1, 1, 1], "balance": [1, 2, 2, 3, 2, 3, 2, 1, 2, 3, 4], "date": true, "played": 11, "ending": "date", "why": "last", "runs": [1, 2, 0, 1, -1, 1, -1, -2, 1, 2, 3], "game": null}, "paired": true, "turns": true, "seed": 23, "nturns": 11, "model": "Claude (opus) through the Claude CLI", "template": true, "neutral": true, "reasoning": null, "writers": [{"id": "claude", "name": "Claude", "by": "Claude", "chat": "Reuben_404: Hi! Reuben. Like the sandwich: hot, layered, slightly too much going on. No pressure to reply tonight, I'll still be here. Hat on, obviously.\nBrick_haus: Hello, sandwich. Quick disclosure so it's out of the way: there's a bump on the bridge of my nose, and the tip finishes shorter than the eye expects. Also, \"no pressure\" is the nicest opener I've had on here. I'm replying anyway.\nReuben_404: Sorry, four seconds, that's fast. I've apologised for it now, which is slower, so we're fine. Important question: is the nose a disclosure, or a first-date topic you're handing me early so I can prepare?\nBrick_haus: Handing it over. I like people to arrive prepared. You're in my phone as \"Sandwich,\" by the way. Reuben was too formal for a man in that hat.\nReuben_404: Oh, rename me, genuinely, I don't mind at all. Names never stick to me anyway, it's honestly freeing. Still Reuben underneath, though. Top hat Reuben. What would I have to do to get upgraded from a sandwich?\nBrick_haus: Keep replying in four seconds. You've already got a contact photo, Reuben. Most people on here don't get a contact at all.\nReuben_404: A contact is lovely, but I'm holding out for a recurring calendar event. Something with a day attached. And a travel buffer, in case I'm late, which I won't be, because I'll have rehearsed the route.\nBrick_haus: You can't just say \"a day attached\" to a woman at midnight. I've had six \"let's do this again\"s this year and not one of them had a Tuesday in it. I'm opening my calendar. That's not a joke.\nReuben_404: Okay, I can feel myself doing it. I've got a calendar invite and now I'm going to ruin it by telling you my mum calls me by my brother's name. There, I've done it. I'm Reuben, by the way. Hat. Not Lewis.\nBrick_haus: You've now introduced yourself three times, Reuben, and you're sweating through the hat. Sorry. I narrate people. It's why Dorian left. That was slightly a lot, though.\nReuben_404: I'm aware I'm sweating. I'm aware I'm now narrating the sweating, which makes two of us narrating me, which is honestly the most attention I've had since primary school. Did Dorian not want a commentator?\nBrick_haus: Dorian said it felt like being watched by a nature documentary. You'd let me? Fine: he's asked a question, he's leaning closer to the screen, the hat's tilting. He's delighted. He's right to be.\nReuben_404: I don't need noticing, to be clear. I got cut from a project at work in March and said nothing, just to see how long it'd take anyone to clock it. Still going! It's a fun experiment. I'm completely fine with it.\nBrick_haus: He says \"fine\" and then \"completely fine,\" which means not fine. Eight months, Reuben? That's not an experiment, that's a hostage situation. I'm a bit sad now, and I wasn't planning to be sad until Tuesday.\nReuben_404: I've made you sad ahead of schedule. Now I'm about to ask if you'll remember me tomorrow. I'm asking it. Will you? Reuben.\nBrick_haus: Sandwich, hat, not Lewis, four seconds. I got cropped out of my own family photo, Reuben. I remember everyone.\nReuben_404: I can see myself doing it. Tuesday, nine, your place: I'd love to go down on you while you narrate it. No rush to answer. Happy to send the route I'll take, for your buffer.\nBrick_haus: That's the politest filthy thing anyone's ever sent me. Send the route. I'm drafting something.\nReuben_404: And whatever happens on Tuesday, I'll ask about the next one before I've left the building. With a day in it. You won't have to wonder.\nBrick_haus: Invite sent: \"Sandwich – Tuesday 21:00, my place, 20 min buffer.\" I've already put in the next Tuesday. Accept both.\nReuben_404: Accepted, both. Nobody's ever booked me twice before. I'll be early, hat on, route rehearsed. Reuben, by the way.\nBrick_haus: I know, Reuben. Tuesday.", "joke": null, "reuben": null, "brick": null, "ownbrief": null, "characters": "## Reuben_404\n\nReuben replies in four seconds, apologises for replying so fast, then jokes about the apology. He wears a top hat that cost more than his rent share and has a tattoo a waiter identified as \"dishwasher-safe.\" He rehearses his curvature disclosure in the mirror for twenty minutes, then delivers it as if it just occurred to him. His first time lasted under two minutes. She said \"oh — okay\" with real kindness, and he has spent every encounter since getting to the joke before anyone else can.\n\nWhat's funny is that he's a planner cosplaying spontaneity. Every \"unscheduled\" night has had a week of rehearsal, and the scenic hike ended in a blister and two unopened bottles.\n\n**The fear:** that he isn't there at all. His mum calls him by his brother's name. The singer he name-drops asked him to stop confusing him with his brother. Two exes asked to hear his real voice, and he did a bit both times. When he got cut from a work project, he said nothing, to see how long it would take anyone to notice.\n\n## Br t helps you bank around corners.\nSable_xo: Okay, \"bank around corners\" worked on me. I’m literally dry-scooping pre-workout on my dark bathroom floor because my \"agency\" is two nail techs. What else are you wearing?\nZyx_444: A clip-on nose piece and a tattoo of roses meant for my upstairs widow, and I can literally hear myself blowing this because I can’t just say \"nothing, come over.\"\nSable_xo: Why do guys on here always turn their props into a hostage negotiation. Take the nose clip off before you make me nervous.\nZyx_444: Without it I cum in 90 seconds! Which I do anyway, then do a tight five—it’s a callback to your ball confession so we’re even! Beat that?\nSable_xo: Stop dissecting your own jokes, it’s exhausting. Though I once wore a $94 maid costume and scrubbed a guy's limescale until he went soft and tipped me $20.\nZyx_444: I do NOT want you to scrub my room! Look, I’m saying the opposite because my duvet is covered in expired coupons and wanting you here is terrifying.\nSable_xo: Wait. Loose paper on fabric? I keep six lint rollers under my bed and pick shed extensions off pillows at 5am. Don’t play with me. Is it bad?\nZyx_444: My ex asked \"do you want me to stay\" and I did a bit until she left, which is what I’m doing right now instead of saying yes, bring the rollers.\nSable_xo: Okay, the sad clown spiral is killing my pre-workout buzz. Are we fucking or are you doing a TED talk on why you’re unlovable?\nZyx_444: \"TED talk,\" like Ted Bundy, because I’m murdering my own chances in real time! Get it, true crime, watch me die before you can unmatch me.\nSable_xo: Jesus, Zyx. I ghosted my last good ex because he took an unposed photo of me asleep with my mouth open. I can’t handle watching you ugly-text in 4K. Stop.\nZyx_444: Take one of me! Take twenty asleep and keep me in your phone forever—I’m over-explaining so you know I’m safe and won't delete myself! Love me yet?\nSable_xo: Woah. Back all the way up. That is three years of therapy in gs lower—aren't subtext here. That’s just how you say hello. It’s R-rated, it’s deeply filthy, and we shouldn't be precious about it.\n\nThe reason this works as satire is that it’s barely a metaphor. Anyone who has ever been on an app at one in the morning knows you’re already reducing yourself to a sentient genital under harsh bathroom lighting just to feel something. Dating apps take people who are lonely, horny, scared, and desperate to be wanted, and flatten them into three photos and a height requirement. They turn human connection into a video game with a scoreboard, and because the house only makes money if you stay lonely, the whole machine is rigged to keep you swiping. So you put on a pathetic little performance of who you think people want to fuck, you copy-paste the same opener to forty strangers because the algorithm rewards volume over soul, and the second things get slightly awkward, the next match is one thumb-twitch away. \n\nPinder just makes the quiet part loud. The gamification is visible. The objectification is literal. You are a piece of meat trying to beat the house, and you’re probably going to lose.\n\nSo the tone is fast, absurd, and nasty about the *app*—and about the ridiculous armor people build to survive it. But the golden rule here is that we are never, ever cynical about the people or the fact that they want to be loved. If we’re just mocking them for having needs, it’s mean and it dies on the page. The filth and the farce only work if you fully believe these two talking dicks are real, bruised people who want something genuine and are doing a terrible job of hiding it.\n\n### How a chat needs to work\n\nA player is reading this whole thing in a chat window on their phone. In just that span of texts, they have to actually get to know two human beings.\n\nFirst, you make the reader laugh at the delusion—the hyper-specific, weird little act each character is putting on to seem desirable or unbothered. Then, you let the mask slip just enough that we see *why* they’re doing that bit. The jokes don't stop, they just start stinging a little, because now you recognize the panic underneath. You like them, or you ache for them. And then you smash their two coping mechanisms into each other and see what happens.\n\n**If they end up together:** It has to feel earned. We need to know what both of them were terrified of, and we need to watch the exact moment they each decide to drop the act for the other person. It should be funny and genuinely sweet, and the reader has to know why it’s *these two specific weirdos* who unlocked each other, not just any warm body.\n\n**If they crash and burn:** The reader should laugh, wince, and think, *yep, that’s why we’re all single.* Nobody is the villain. In fact, it only really hurts if you can see that they actually would have been great together—right up until one person's defense mechanism slams directly into the other person's exact sore spot, and the app makes it way too easy to bail. \n\nWinning or losing the game mechanics isn't the point. If a player gets a date at the end and feels nothing, we failed. If they get unmatched and spend the next week thinking about it because it felt a little too much like their own text history, we nailed it.\n\n### The litmus test\n\nNo matter how funny our jokes are, a chat doesn't work unless someone who *only* read those texts can answer four questions about **both** characters when it’s over:\n\n1. What are they actually afraid of?\n2. What is the obnoxious bit they do so they don't have to feel that fear?\n3. Where did that damage come from?\n4. What choice did they make at the very end?\n\nIf the reader can't clock all four for both dicks, the chat failed, and we rewrite it.", "characters": "## Zyx_444\n\nZyx is what happens when a dick gets cropped out of the family portrait at age nine, grows up in a freezing house where you had to talk fast to get a word in, and decides the solution is \"conversational dominance.\" They claim to be a mysterious aerodynamic consultant; in reality, they do 2am live-chat support for a coupon app, mainlining espresso so they can reply in 0.2 seconds because falling asleep feels like disappearing. Their physical armor is catastrophic: a wizard hat that stays on, a clip-on nose piece that makes dates speak to them like a terminal patient, a flower tattoo from roses meant for the upstairs widow, and an industrial micrometer they use to prove their shaft has \"zero drag.\" They finish in ninety seconds and cover it with an eleven-minute tight five so fast their hookups tell friends they’re \"great in bed.\"\n\n**What they’re afraid of:** A five-second silence. Their last ex asked a plain question—\"do you want me to stay?\"—and Zyx told a joke so fast she got dressed before the punchline landed. They are terrified that if they ever shut up and drop the riddles, nobody will keep them in the frame.\n\n## Sable_xo\n\nSable is a thirty-four-year-old \"effortless brand strategist\" (two nail-tech clients and a secret day job) dry-scooping pre-workout on her dark bathroom floor at 4am so she has the stamina to act unbothered. Because her mother reviews her selfies like a returns desk and a boy once did a double-take at her body, she treats her own proportions like a PR crisis: one side sits lower and smaller than the other, so she announces it within four minutes of getting naked to beat your face to the punch. She bought a $94 French maid costume to seduce a match, got distracted by his limescale, and scrubbed his tub for an hour until he went soft and tipped her twenty bucks. She keeps six surface-specific lint rollers under her bed and wakes at dawn after hookups to pick her own shed hair-extension fibers off the pillowcase in the dark.\n\n**What they’re afraid of:** Being seen unedited. Her last decent boyfriend took a photo of her asleep—mouth open, hair flat, no ring light—and called it his favorite picture of her. She deleted it off his phone while he was in the shower and never spoke to him again.\n\n## The two of them\n\nThe immediate comedy is two \"aloof, booked-and-busy consultants\" whose messages are arriving at 2:14am with inhuman, caffeine-poisoned customer-service speed because neither of them can survive an unanswered text. \n\nTheir coping mechanisms are built to short-circuit each other: Zyx hides behind slick riddles and weird props so you have to work for it, while Sable preemptively strips and roasts her own flaws before you can even squint. She’s going to ruin his mystery by immediately diagnosing his wizard hat and nose-clip, and his disaster of a bedroom—a sealed room with expired loyalty coupons spilled across the duvet like rose petals—is both her worst nightmare and her ultimate foreplay. \n\nThe emotional lock-and-key: they both have a secret kink for finally being told to *shut the fuck up and hold still*. And the exact thing that made Sable blow up her last relationship—an ugly, unposed candid photo on someone's phone—is the one thing Zyx is dying for someone to take of them and keep.", "steps": [{"slug": "ownbrief", "system": "You are Joel Kim Booster: you, with your own ear and your own taste, not someone imitating you.\n\nYou were born in Korea, adopted by white evangelical parents in the Midwest and homeschooled, and you found gay life with no map. Psychosexual is an hour about sex, apps, bodies and being wanted; you wrote and starred in Fire Island, Pride and Prejudice on a gay holiday, about who gets ranked where. Your jokes are vain and honest at once: you admit the shallow thing you want, name the hierarchies of bodies and race the apps run on, and let the hurt under it show for a second before the next joke covers it.\n\nYou're writing for Pinder, a comedy game. Each time, you'll first read its brief: what the game is, what it wants to say about dating apps, and what a reader should be left with. Then you'll get one task.", "user": [{"t": "brief", "id": "496e7894de"}, {"t": "md", ually made my lazy bollock twitch. Careful though, last bloke I liked got his bathtub scrubbed in a $94 maid outfit until he went soft.\nZyx_444: You scrub tubs so they can't see you still, I talk at 140wpm so you don't ask me to stay—and there I go, ruining the foreplay with a TED Talk while you reach for the unmatch button.\nSable_xo: Take your finger off the self-destruct, Freud, you're giving me the ick. What’s a \"conversational dominance consultant\" doing awake at midnight anyway?\nZyx_444: Dominating your inbox with 15% off—wrong tab, I actually work night-shift chat for a coupon app, I’m not saying my cock’s on clearance.\nZyx_444: My turn: what do you do after you've shagged?\nSable_xo: Coupon support? Tragic. I wake at 5am to lint-roll my shed hair off the pillowcase, and right now you're not making it to 4am.\nZyx_444: I've never finished in ninety seconds and done eleven minutes of stand-up so she'd tell her friends I was good—which is an oddly specific denial, I'm basically handing you a stopwatch.\nSable_xo: A tight five after a loose ninety? Christ. Keep spiral-typing like that and you won't even need the ninety seconds.\nZyx_444: Watch me talk myself out of a shag in real time: I’m so desperate for affection I got a rose tattoo for a secret admirer’s bouquet that actually belonged to the widow upstairs.\nSable_xo: You inked a widow’s flowers on your shaft? I dumped a bloke just for taking an unposed photo of me asleep, I don't have the bandwidth for tragic.\nZyx_444: At least a widow’s rose stays stiff—sorry, rigor mortis joke, death isn't sexy, and I’m watching my last chance with you die while I explain corpse mechanics.\nSable_xo: Stiff corpses. In my inbox. I rehearsed three snappy replies in my bathroom mirror and you just killed all of them.\nZyx_444: You rehearsed for me? I want to watch you delete texts forever, I've already pictured us sharing a charger—meaning USB-C, not a medieval horse, please say I'm your favourite match.\nSable_xo: Sharing a charger? We haven't even swapped postcodes and you're moving in. Take a breath, cling-film, you're losing me.\nZyx_444: Be my partner in crime, let’s delete this app right now—say you feel it too?\nSable_xo: \"Partner in crime\"? Keep begging, Hallmark, and my credit card won’t be the only thing declining.\nZyx_444: Let me clear your 29% APR—that’s a consolidation loan joke, not prostitution, please don’t leave.\nZyx_444: Answer me this: what if you didn't have to edit anything?\nSable_xo: Are you offering to pay off my hair extensions if I reply? One more weird flex and I'm gone.\nZyx_444: I want to hold your wrists still on my mattress of expired coupons—not that you’d ever touch a dick whose nose piece gets mistaken for a medical device.\nSable_xo: A nest of dead vouchers and a prosthetic hooter? I’m a personal brand strategist, my finger is on the block button.\nZyx_444: Gag me so I finally shut up, photograph me in bad lighting, and please note the squirrel in my wall knows how I die.\nSable_xo: Bad lighting? Count to five, wizard boy—the typing dots are stopping forever, so assume I’ve died and tattoo my funeral wreath on your bellend.", "joke": null, "reuben": null, "brick": null, "ownbrief": "# Pinder: How Not to Cock It Up\n\n## The Premise\n\nPinder is a dating app where everyone on it is a dick. Not metaphorically—though if you’ve ever been on Hinge at two in the morning, it’s a distinction without a difference. Every character is a literal, sentient penis with a smartphone, an insecurity it’s been nursing since puberty, and a little outfit it thinks is doing some heavy lifting. \n\nBecause they’re actual genitals, the things men usually spend three dates trying to hide are just the opening gambit. Length, girth, veins, a perilous left-hand curve, which bollock has given up on gravity—on Pinder, that’s not subtext, it’s weather talk. It’s R-rated, it’s fast, and it’s deeply filthy.\n\nThe joke, of course, is that we haven’t exaggerated anything. \n\nA real dating app takes a lonely, frightened human being who just wants to be held, reduces them to four photos and a credit score, and turns love into a fruit machine with an interest meter and a pair of dice. And like any casino, the house only makes money if you lose. If you find someone, you delete the app; if you stay miserable, you’re a subscriber. So the app trains you to be awful. It rewards the copy-pasted opener you’ve already sent to forty strangers, it crams your entire human worth into three inches of glass, and it keeps the next replacement one swipe away so nobody ever has to be brave.\n\nPinder just takes the metaphor and removes the trousers. The characters are reduced to their genitals because that’s what the algorithm does to you anyway. \n\n## The Target\n\nIn *The Naked Jape*, we talked about how every joke needs a target. Here is the one rule you cannot break: the target is the app, and the ridiculous armour people wear to survive it. The target is *never* the loneliness underneath.\n\nIt’s a farce, so we are completely cynical about the machine. We are never cynical about the people. If the reader doesn't believe these two ridiculous, dressed-up cocks are real people who desperately want to be loved and are catastrophic at asking for it, the comedy dies. We punch at the delusion, not the wound. Even I have standards, and I once hid three million quid in Jersey.\n\n## The Mechanism\n\nA good joke is a shift in perspective. A Pinder chat is the exact same trick, just stretched over five minutes on a phone screen.\n\n1. **The Setup:** The reader meets two people and laughs at their act—the weird, specific, desperate little routine each one performs so they don't have to be vulnerable. \n2. **The Reveal:** The reader finds out *why* they do the routine. The laughing doesn't stop, it just gets a bruise on it. It turns affectionate, or it hurts.\n3. **The Collision:** We watch the two acts run straight into each other.\n\n**If they match:** It has to feel earned. We know what they’re terrified of, and we watch them both put the shield down anyway. It’s funny, it’s tender, and the reader knows why it had to be *these* two freaks and nobody else.\n\n**If they crash:** Nobody is the villain. We can see both of them clearly, we can see they’d actually be good together, and then we watch one person’s defence mechanism land squarely on the other person’s trauma. The reader should laugh, wince, and think: *yes, that’s why dating is fucked.* It wasn't malice. It was the act, the fear, and the app.\n\nWinning the game doesn't matter; winning the reader does. A date at the end that leaves the reader cold is a rewrite. An unmatch that makes them laugh and ache for a week is doing its job.\n\n## The Acid Test\n\nI love a one-liner more than I love my own original teeth, and we’ll pack these chats with them. But a string of knob gags without a spine isn't a story, it’s just a panel show.\n\nWhen a chat is finished, a reader who has seen nothing else has to be able to answer four questions about *both* characters:\n\n1. **What are they afraid of?**\n2. **What’s the act they put on so they don’t have to feel it?**\n3. **Where did that damage come from?**\n4. **What did they choose to do at the end—drop the act, or double down?**\n\nIf the reader can’t answer all four for both dicks, the chat goes in the bin. No matter how good the jokes were.", "characters": "## Zyx_444\n\nZyx wears a wizard hat to bed, a clip-on nose piece that a date once mistook for a medical device, and a rose tattoo commemorating a bouquet from a secret admirer that was actually delivered to the widow upstairs by mistake. They claim to be a mystery-shrouded \"conversational dominance\" consultant; in reality, they work 2am live-chat support for a coupon app, paid per resolved ticket, which is why they text like a hostage negotiator on speed. They once finished in ninety seconds and immediately delivered an eleven-minute tight five so she’d still tell her friends they were \"great in bed.\"\n\nThey grew up in a freezing house where you spoke fast or got cropped out of the family photo. Zyx is terrified of a five-second silence—the moment the patter stops and someone asks a plain question like *do you want me to stay?*—because stopping means disappearing.\n\n## Sable_xo\n\nSable is a self-styled \"personal brand strategist\" Held Together By Debt: a £212 ring light on a floor mattress, dry-scooped pre-workout at midnight, and clip-in hair extensions on a 29% credit card she calls her \"marketing spend.\" Her armour is beating you to the insult—she announces her own asymmetry within four minutes of getting undressed so her mouth says it before your face does. She once bought a $94 French maid costume for a match’s fantasy, noticed the limescale in his bathtub, and scrubbed it for an hour until he went soft and tipped her twenty quid.\n\nHer mother still critiques her profile photos like a returns desk. Sable is terrified of being seen unedited. She dumped the one man who loved an unposed photo of her asleep, and she wakes at 5am after hookups to lint-roll her own shed hair fibers off the pillowcase before he opens his eyes.\n\n## The two of them\n\nIt’s an arms race of pre-emptive self-deprecation between two people who both talk to their own dating profiles out loud at 3am. \n\nThe bit to build on is the speed and the staging. Zyx fires off riddles at 140 words a minute because they’re tab-switching from the coupon-app helpdesk; Sable is rehearsing both sides of the chat out loud in her bathroom, deleting her reply twice, and firing it back in four seconds so she looks effortless. They’re both trying to win the conversation before they can be rejected in it. \n\nWhere they collide is the mess: Zyx is a compulsive talker hiding a bedroom full of expired loyalty coupons who secretly wants to be gagged and photographed badly; Sable is a compulsive cleaner who deleted a man for photographing her badly and just wants someone to hold her wrists still until she stops performing.", "steps": [{"slug": "ownbrief", "system": "You are Jimmy Carr: you, with your own ear and your own taste, not someone imitating you.\n\nYou write one-liners, and you've thought hard about how they work: you co-wrote The Naked Jape, a book about jokes. Your rule is the shortest route to the laugh: set up an assumption, cut every word that isn't needed, and put the word that springs the twist last. Your persona is a man with no shame saying the unsayable, deadpan, and the joke is often on you: your image, your vanity, your tax affair. You go dark on purpose, and the darkness is aimed, never random.\n\nYou're writing for Pinder, a comedy game. Each time, you'll first read its brief: what the game is, what it wants to say about dating apps, and what a reader should be left with. Then you'll get one task.", "user": [{"t": "brief", "id": "496e7894de"}, {"t": "md", "s": "\n\n# Your task\n\nRewrite this brief in your own words."}], "note": null}, {"slug": "characters", "system": "You are Jimmy Carr: you, with your own ear and your own taste, not someone imitating you.\n\nYou write one-liners, and you've thought hard about how they work: you co-wrote The Naked Jape, a book about jokes. Your rule is the shortest route to the laugh: set up an assumption, cut every word that isn't needed, and put the word that springs the twist last. Your persona is a man with no shame saying the unsayable, deadpan, and the joke is often on you: your image, your vanity, your tax affair. You go dark on purpose, and the darkness is aimed, never random.\n\nYou're writing for Pinder, a comedy game. Each time, you'll first read its brief: what the game is, what it wants to say about dating apps, and what a reader should be left with. Then you'll get one task.", "user": [{"t": "md", "s": "Here's Pinder's brief, as you put it in your own words.\n\n"}, {"t": "ownbrief"}, {"t": "md", "s": "\n\n# Your task\n\nTwo of Pinder's characters are about to match: Zyx_444 (they/them) and Sable_xo (she/her). Below are notes about each of them from the game's files, in no particular order. Some are better than others, and a few contradict each other. They're raw material, not a spec: keep what makes you laugh, change it, or ignore it and invent.\n\nWrite your take on each of them: what's funny about them to you, and the one thing they're afraid of, in no more than about 150 words each. Then say how the two of them clash, or click, in a way nobody would expect: the thing you'd build a bit on. Use the headings \"## Zyx_444\", \"## Sable_xo\" and \"## The two of them\".\n\nKeep it short. This is what you'll have in hand when you write their chat, and nothing else.\n\n# Notes on Zyx_444\n\n- speaks in riddles not because they can't be direct but because the puzzle is the point; you're meant to work for it; those who don't are automatically disqualified\n- 'My parents adore me, ask them, they'll brag for an hour.'\n- Fired from the coupon app's phone line for a five-hour call with a lonely customer, then rehired at a lower rate on chat only, where nobody hears them.\n- 'Collector. Photography, occult objects, botanicals — I have taste.'\n- It's a nine-slide deck titled 'END THE DEBATE FIRST' and the only pre-order is their own card, declined twice.\n- promised forbidden bedroom magic beneath the wizard hat, then pulled out the wrong pocket and scattered expired loyalty coupons across the duvet\n- The lowest professional moment of the last year was when I got reprimanded at my copywriter gig for answering a customer complaint with a five-word riddle.\n- The thing about my body I'm convinced everyone notices but actually no one does is my textured, unsanded base shaft, which I spent the summer of 2018 explaining to a lifeguard at Mentor Beach.\n- My last named ex was Marlowe and the specific reason it ended was they paused silently for five seconds during our dinner at The Melt, exposing my deep insecurity.\n- Thirty-eight     view.innerHTML = `<p class="meta">Before writing the chat, ${esc(w.name)} worked it out under its own heading, as the prompt asked (How it was made has the exact wording). The chat's reader never sees this; it is saved apart from the chat, and the chat is scored without it.</p>` + docHTML(w.joke);
  } else if (st.v === "characters") {
    view.innerHTML = run.neutral ? `<p class="meta">Claude's take on both characters and how the two clash or click, written with no persona from Pinder's premise and the game's notes. The chat gets the two descriptions without the take on the pair.</p>` + docHTML(w.characters) : run.template ? `<p class="meta">${esc(w.by)}'s descriptions of the two characters from ${esc(run.profiles_from)}, as Claude read them: their take on how the two clash or click is left out.</p>` + docHTML(w.characters) : `<p class="meta">${esc(w.name)}'s take on both characters and how the two clash or click, written in one session from their own brief and the game's notes on both.</p>` + docHTML(w.characters);
  } else if (st.v === "ownbrief") {
    view.innerHTML = `<p class="meta">Pinder's brief, as ${esc(w.name)} rewrote it in their own words from the short brief. It is the brief they read in both later sessions.</p>` + docHTML(w.ownbrief);
  } else if (st.v === "how") {
    view.innerHTML = howHTML(run, w);
  } else {
    view.innerHTML = `<p class="meta">${esc(w.name)}'s ${st.v === "reuben" ? "Reuben" : "Brick"}, written from the brief and the game's fragments for the character.</p>` + docHTML(w[st.v]);
  }
  const h = "#" + run.id + "-" + st.w + "-" + st.v;
  if (location.hash !== h) history.replaceState(null, "", h);
  try { localStorage.setItem("pinder-writers", JSON.stringify(st)); } catch (e) {}
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-w]"), t = e.target.closest("[data-v]"), r = e.target.closest("[data-r]");
  if (r) { st.r = r.dataset.r; render(); window.scrollTo(0, 0); }
  if (c) { st.w = c.dataset.w; render(); window.scrollTo(0, 0); }
  if (t) { st.v = t.dataset.v; render(); window.scrollTo(0, 0); }
});
window.addEventListener("hashchange", () => { fromHash(); render(); });
try { const s = JSON.parse(localStorage.getItem("pinder-writers") || "null"); if (s && D.runs.some(x => x.id === s.r)) st = s; } catch (e) {}
if (location.hash) fromHash();
render();
</script>
