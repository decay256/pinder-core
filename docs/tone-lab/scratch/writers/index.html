ither way, my evening is yours until he finds reverse.\n\n> Reuben_404: I don't believe in the tape-measure industrial complex, darling.\n> Reuben_404: Four and a half inches of bespoke Savile Row tailoring with a thirty-degree lean toward the bar. Built for cornering, not the motorway.\n\n**The Text Disaster waiting to happen:**\nPasting a line he clearly wrote in his Notes app three days ago—or worse, pasting the prompt he just tested on his fake Pinder clone, complete with the test handle, and then trying to convince you the clone is a \"social experiment for a mate in Berlin.\"\n\n**What he sounds like when the armour comes off:**\nThe vocabulary drops by half. The punctuation goes first, then the clauses, then the curtain call. When Reuben says a three-word sentence with no joke at the end of it, he has his coat off.\n> Reuben_404: don't be nice about it\n> Reuben_404: just tell me if you're still there\n\n---\n\n### How it ends\n\n* **If it works:** The other person refuses to laugh at his pre-emptive self-deprecation, catches him in the middle of a routine, and tells him—not kindly, not with pity, just plainly—to shut up and stay put. He drops the flourish, admits the lentils or the four-inch shadow, and lets a sentence sit on the screen without rescuing it.\n* **If it fails:** The other person gives him a polite, gentle, half-hearted laugh—or worse, offers him a small mercy when his act slips—and he hears *\"Oh—okay\"* all over again. He will immediately put the top hat back on, fire off three catastrophic jokes in a row to prove he didn't care anyway, and talk himself right out of the room before they can be the one to leave it.", "brick": "# BRICK_HAUS (she/her)\n\n**Age:** 38. (The profile says 31 and \"in her prime.\" The only institution that still cards her is the pharmacy loyalty programme, which she signed up for twice so she'd get the birthday email.)\n\n**The look:** A dick in a bespoke waistcoat, four-inch heels, and a monocle. She owns two waistcoats and a $340 professional garment steamer she bought to prove she is the sort of creature who steams her waistcoats. Halfway up her shaft is a small, stubborn ridge; above it, she curves slightly to the left, and the tip finishes a fraction shorter than the eye expects. You will not have the pleasure of discovering any of this for yourself, because she will hand you the complete surveyor’s report within ninety seconds of matching. Down near the base, where a hip would be if she had hips, she has a daily schedule tattooed in neat sans-serif type.\n\n**Profile bio:**\n> Monocle, vest, heels, and a curve I will describe to you before you notice it. Consultant. I plan three weeks ahead, arrive early, and will absolutely win the argument you did not start. No time-wasters.\n\n---\n\n### What she is afraid of\n\nShe is afraid of being left waiting in the unscheduled dark. Specifically, she is afraid of the sentence *\"let's do this again sometime\"* delivered in the back of a taxi with no Tuesday attached to it—and of the moment after, when she realises she was the only one in the room who thought something had happened.\n\n### Where it comes from\n\nShe grew up in a rental so narrow and draughty you had to turn sideways to get past the refrigerator—a physical tic she still performs between tables in wine bars when she has four feet of clearance on either side. Dinner was microwaved hors d'oeuvres eaten standing over the sink; \"good taste\" was whichever boxed rosé had a yellow sticker on it. In the one proper family portrait her parents ever paid for, the framer cropped her out at the left margin and nobody spent the money to have it redone. (She still has the photograph in her handbag; she was looking at it in a supermarket car park last Thursday.)\n\nEverything she owns that costs too much—the heels that cost more than her rent, the steamer, the monocle (and the backup monocle sitting in her eBay watch list in case the first one cracks)—is an exhibit for the defence. It is there to prove she exists, she arrived, and nobody helped her do it.\n\nHer last real relationship was with Marguerite. It ended because Brick put their arguments into the shared Google Calendar with thirty-minute end times and travel buffers, and Marguerite told her she couldn't stay with someone who scheduled being loved. The week after Marguerite left, Brick threw out every stick of furniture Marguerite had ever touched, never replaced any of it, and got the daily timetable tattooed on her skin so nobody could accuse her of drifting. She missed the follow-up shading appointment because a booty call arrived forty minutes early and ruined the buffer.\n\n---\n\n### The act (and how she plays it)\n\nShe treats intimacy as a logistics problem that only fails when amateurs neglect the paperwork. She has swallowed whole the dating-app gospel of **efficiency, radical transparency, and high standards**, and she uses it like a riot shield.\n\n1. **The Pre-Emptive Inventory.** Nobody can flinch at her body if she gets there first. She announces the bump on her shaft, the leftward curve, the abbreviated tip, and the unshaded tattoo the way a hostile estate agent points out rising damp. She calls this \"no fluff.\" In three years, not one match has been given time to bring it up first.\n2. **The Specimen Under Glass.** She treats the other person's messages like a contract she is checking for loopholes. She replies to openers by dissecting their word choice (*\"hm. 'hey' is doing very little work here, isn't it.\"*). She narrates both of them in real time so nothing can catch her off guard.\n3. **The Curated Life.** She claims she barely uses the app, lives in a \"deliberately minimal\" flat, works as a high-level closer (\"I get called in when two parties can't finish a debate\"), and is perpetually \"just getting in from a thing.\"\n4. **The Double-Down.** When her dignity fails her—and it fails her constantly—she never concedes. If she trips in a hotel revolving door and loses a heel before a hookup, you are getting a twelve-minute architectural critique of the door. If she apologises for looking dishevelled and knocks over her ring light trying to prove it was deliberate, she will explain the physics of the tripod until you beg for mercy.\n\n### The gap (Claim vs. Evidence)\n\n* **The flat:** She calls it \"minimalist, very few, very right things.\" It is an empty room with leaking windows where she keeps her two vests steamed and a £240 posture-correcting harness (which looks like tack for a small horse) propping the bathroom door open.\n* **The cellar:** She lists \"wine, tailoring, and the art of conversation\" as her passions. She drinks three-litre boxed rosé—specifically poured into a proper crystal glass at 21:00 sharp so it reads as a routine rather than a problem—standing at the kitchen counter reading old messages.\n* **The monocle:** She wears it to inspect wine lists. At a housewarming she dropped it into a glass of boxed rosé, fished it out with the little plastic cocktail sword from a microwaved sausage roll, and wore it wet for an hour rather than admit it had gone in. The plastic sword is currently in a shot glass on her windowsill. She cannot throw it away.\n* **The rehearsal:** She claims her wit is effortless. She stands in the bathroom with her phone timer running and rehearses her opening smile around the monocle in three variations, keeping notes on which one looks least rehearsed.\n* **The private app:** She says a friend made her Pinder profile as a joke. On her laptop at home, she runs a private replica of the app she coded herself, containing only her own profile, so she can practise swiping on her own lopsided reflection.\n\n---\n\n### Filth, bodies, and bed\n\nShe talks about sex like a structural engineer right up until she wants something, and then it gets very specific.\n\n* **Her disasters are mechanical:** Her last sexual mishap involved a heel snapping mid-straddle; she went base-first into  it is, or she lets a deadline pass without mentioning it. For a creature who has her daily schedule tattooed on her skin, the most naked thing she can type is a short, unpunctuated line with no plan in it at all."}], "how": {"system": "You are {name}. Not someone writing in your manner: you, with your own ear, your own taste and your own judgement.\n\nThe people making Pinder have asked you to write for it. On the characters and the dialogue you are the authority: you decide who these people are, what about them matters, how they talk and how they type. Nobody will hold you to anything else.", "brief": "# Pinder: the brief\n\nYou're joining the team that writes Pinder's chats. This brief tells you what Pinder is, what we want a reader to feel, and how a chat makes them feel it. Everything in it is here because a chat without it didn't work.\n\n## What Pinder is\n\nPinder is a game, and it's also a piece of satire. It looks exactly like a dating app: profiles, matches, a chat window, and a little meter that shows how interested the other one is. Everyone on it is a dick. Not a man: a dick. A sentient penis with a phone, a profile, an outfit or accessory it thinks helps, and a body it has been apologising for since puberty. They know what they are, and so does everyone else, so length, girth, curve, veins and which ball hangs lower aren't subtext on Pinder, they're small talk. It is R-rated and it can be very filthy.\n\nThe joke underneath is that this is barely an exaggeration. Dating apps take lonely, frightened, hopeful people and turn them into a few photos and a bio. They turn wanting to be loved into a game with a score. And they make their money when you don't find anyone, because then you come back. So at one in the morning people perform a version of themselves they think might be wanted, to strangers who are doing the same. They're hurt, they're hopeful, they're horny, and they're bad at it, and the app makes all of it worse: it rewards the opener you've sent to forty people, it puts your whole worth into what fits on a screen, and it keeps the next match one swipe away, so nobody ever has to stay. Pinder makes all of that literal. The characters are reduced to their genitals because that's what the app does to everyone anyway. The interest meter is real. The dice are real. Dating here is openly what it secretly is on every app: a game, and you're probably losing.\n\nSo it's a farce: absurd, fast, filthy, and cynical about the app. But it is never cynical about the people. The comedy only works if the reader believes these two are real people who want something real and are hiding it badly. The satire is aimed at the machine and at the defences people build to survive it. It is never aimed at the need underneath.\n\n## What the reader should feel\n\nSomeone reads a whole chat on their phone in about five minutes. In that time they get to know two people.\n\nThey laugh at them first: at the act each one puts on, the weird, specific thing each keeps doing. Then they find out why each one does it, and the laughing changes. It doesn't stop, but now it's affectionate, or it hurts. Then they watch the two acts run into each other.\n\nIf the two connect, the reader should feel it was earned. They know what each of them was afraid of, and they watched each one put the act down for the other. It's tender and still funny, and the reader knows exactly why it's these two and not anyone else.\n\nIf they don't connect, the reader should laugh and think: yes, that's why dating is fucked. They can see both people completely. They can see the two might have been good for each other. And they watch each one's defence land exactly on the other one's sore spot. Nobody is the villain. It's the act, the fear, and the app.\n\nWinning or losing doesn't matter. A chat that ends in a date and leaves the reader cold has failed. An unmatch that makes them laugh and wince for a week has worked.\n\nWhen the chat is over, someone who has read only the chat is asked, for each of the two: what are they afraid of, what do they do so they don't have to feel it, where does that come from, and what did they do at the end? If they can't answer, the chat failed, however good the lines were.\n\n## How the reader comes to feel it\n\n**Play it straight.** The characters don't know they're in a comedy. Each one takes themselves completely seriously, believes their strategy is working, and has a logic that holds together from the inside. Unhinged doesn't mean random. It means a reasonable person following their way of coping one step too far, and then one more. Nobody winks, nobody comments on their own joke, nobody types \"lol I'm such a mess\". The moment a character knows they're funny, the reader stops laughing.\n\n**Laughter comes from the gap.** The claim and the evidence are both on the screen and they don't match. The reader sees it; the character doesn't.\n\n> Otto_Mat: I don't really do the whole rating thing\n> Otto_Mat: your bio's a strong 8 though\n\n**The unhinged comes from commitment.** Caught out, nobody concedes. They explain, and the explanation is worse than what they were caught doing. Each attempt to fix it digs deeper.\n\n> Dolores_77: that photo is from my sister's wedding\n> Dolores_77: I wasn't invited. I mean I was invited. I watched from the car park\n> Dolores_77: the light was better there\n\n**The wince comes from seeing it coming.** The reader knows something one of them doesn't, sees the habit about to land on exactly the wrong spot, and can't stop it. Let the danger be visible a turn before it goes off.\n\n**The satire comes out of their mouths.** Every character believes some piece of what the apps and dating culture have taught them, and uses it, in complete earnest, to justify being afraid: standards, red flags, high value, efficiency, \"I'm not looking for anything serious\", \"communication is key\". They say it straight, and the evidence on the screen says the opposite. That's where the farce stops being about one person and becomes about all of us.\n\n> Otto_Mat: people on here are way too eager honestly\n> Otto_Mat: anyway I've cleared my whole weekend\n\n**Affection comes from finding out why.** Somewhere in the middle, a piece of where the habit came from gets out, and after that the same habit lands differently. Once the reader knows that Otto's dad graded his drawings, his school reports and, once, his mother, every rating is a little sad, and the reader starts watching for them.\n\n**Tenderness comes from understatement.** The most naked line is the shortest and the plainest one in the chat, and you can often hear it in what's missing. After forty messages of ratings, this is the line:\n\n> Otto_Mat: you're Dolores\n\n**The cynical laugh comes from inevitability.** When it falls apart, it falls apart the only way it could have: each one's habit confirms exactly what the other was afraid of, and both of them get precisely the rejection they predicted. The reader could have called it, and that's what makes it funny.\n\n> Dolores_77: you'd rate a funeral\n> Otto_Mat: 4. bad catering\n\n**A payoff is the reader putting it together.** A setup is noticed but not understood: it looks like a joke or a throwaway. It comes back once in the middle so it stays alive. At the payoff it turns out to mean something else, and nobody in the chat explains it, because the reader gets to. Early on, Dolores asks Otto what her rating is, and he says he doesn't rate people, only objects. At the end:\n\n> Dolores_77: so what am I\n> Otto_Mat: I'm not rating you\n> Otto_Mat: I'd have to be objective\n\n**Timing is in the message breaks.** A new message is a pause: the punchline goes in its own message, after the line that sets it up. A one-word reply to a long message is a reaction shot. \"ignore that\" is a punchline. Status flips are funny: whoever was chasing is suddenly the one being chased. And two turns at the same temperature in a row kill the momentum, so hot follows cold and long follows short.\n\n**What kills it.** Characters explaining their feelings. Therapy-speak. Quips that fill a turn without giving anything away. Explaining a callback. Conceding at the first hit. Generic filth. Each of these does the reader's work for them, or gives them nothing to do.\n\n## The medium\n\nPinder is text only: no voice messages, no calls, no video. People send several short messages in a row. The disasters are the ones a text chat allows: a message meant for someone else, the wrong thing pasted, a message sent before it was finished, autocorrect, a typo in a name, a long silence, \"ignore that\". When one happens, it happens to the character, once:\n\n> Otto_Mat: she's still going on about the ex. 6.5. great hands. bail y/n\n> Otto_Mat: that was for Mats\n> Otto_Mat: Mats is my brother. he never replies. I just send him the ratings\n\nIn three lines every earlier rating changes meaning: she has been rated all along, and the ratings go to someone who never answers.\n\nA whole chat runs about 1,250 words, five minutes of reading, but that's an average, not a limit. Most messages are a line or two, often less; a turn can be one word each way, or one long message when someone finally tells something, and a long message is an event. The characters are inside the app, not inside the game: they never see or mention dice, moves, options, turns or the meter.\n\n## How they write\n\nIt's texting, typed the way that particular dick types: their capitalisation, their punctuation, their tics. No narration, no stage directions, no asterisks. Nobody talks like their day job or reaches for data and spreadsheets to sound clever; when they're clever, it's about sex, their bodies, their exes and their flats. Be filthy, and be specific: generic filth is boring, and filth that's specific to this person is funny because it gives them away. At the start it's bravado; by the end it's how they get close.\n\nOtto and Dolores are not in tonight's chat ually true |\n| :--- | :--- |\n| **\"I only check this thing when the weather turns.\"** | He replies in four seconds at 2am, panics, sends a second message excusing the speed, then a third making a joke about the second. |\n| **\"Just got back from a few days up the coast—needed altitude.\"** | He has been in his one-room sublet for eleven straight days in his overcoat, eating the same pot of lentils, with a $189 \"posture and presence\" plastic collarbone clip holding a bag of coffee shut. |\n| **\"Two drinks maximum. It’s about keeping the tempo of the evening clean.\"** | He is currently on his fifth gas-station energy shot and fourth nicotine pouch of the night, his gums are white, and his hands are shaking so hard he has to sit on one of them to type. |\n| **\"I hate a scheduled night. Best evenings are the ones where you just follow the street.\"** | He rehearses his curvature disclosure out loud in the bathroom mirror for twenty minutes before every date, testing whether it lands better with a shrug or a grin, then arm-wrestles his own left hand until the right one wins. |\n| **\"I’m in stealth on a small, elegant app right now. Two months from launch, then I’m picking a coast.\"** | He was quietly dropped from his work team’s calendar invites three weeks ago and hasn't said a word to see if anyone notices he’s gone. The \"app\" is a working clone of Pinder he built where he is the only user, matching with a fake profile of himself until 3am. |\n| **\"Money is dull. I settle the tab at the door so nobody has to look at a bill.\"** | He times his trip to the gents to pay the waiter at the till so his date won't see which of his three cards declines before the £84.99 charge from *Meridian Wellness Solutions LLC* (a vacuum girth pump) clears. |\n| **\"We ended it because she wanted a quiet life and I’m bad with cages.\"** | Her name was Delphine. She told him quietly that she had never once heard him say a sentence that wasn't a performance, and asked him to tr nches. He pitches sex like a heist or a backstage pass—all tempo, angles, and novelty. He will brag about the tongue attachment, his stamina, or his \"geometric versatility\" (his euphemism for the hook) as if it’s a bespoke luxury feature for connoisseurs.\n\n**What he actually wants in bed (The Secret):**  \nTwo things he has never said out loud without a joke attached:\n1. He wants to be held down by the wrists or the throat hard enough that he cannot do the voice, cannot reach for the hat, and cannot make the joke. The entire relief of sex for him is having his mouth taken away from him so he’s just a body in the room.\n2. He wants someone to narrate him out loud while they’re fucking him—present tense, exact details, what his skin is doing, how the curve feels inside them—because if someone is describing him out loud, he can't be disappearing. And afterwards, for ten minutes: one flat hand on his back, using his actual name (*Reuben*, no handle, no bit), and not needing him to be funny.\n\n---\n\n## 6. Voice Samples (For the Room)\n\n**Opening / The Act in full swing:**\n> **Reuben_404:** Full disclosure before you invest emotionally: the hat stays on until the second drink, the tattoo is a cautionary tale from a port town I am no longer welcome in, and I will challenge you to arm-wrestle for the bill.  \n> **Reuben_404:** I have very compact leverage. It’s deceptive.  \n> **Reuben_404:** Consider yourself briefed.\n\n**Caught in a gap (Digging deeper):**\n> **Reuben_404:** I barely look at my phone after dark, honestly. If you catch me on here it’s because the rain stopped me taking the bike out.  \n> *[Match points out it hasn't rained in a week and he replied in three seconds]*  \n> **Reuben_404:** Microclimates. The third floor gets a very specific draft off the alley.  \n> **Reuben_404:** Also I was holding the phone because I was timing a reduction. Culinary precision looks a lot like loneliness from the outside.  \n> **Reuben_404:** It’s lentils, since you’re prying. Vintage leguming.\n\n**Filth (Moving from act to real):**\n> **Reuben_404:** I have four and a half inches and a sharp left turn at the halfway mark that has surprised better optimists than you, so if you’re looking for a straight motorway I’m the wrong exit.  \n> **Reuben_404:** Put a hand over my mouth so I stop talking and tell me where I’m hitting. Out loud. While it’s happening.  \n> **Reuben_404:** I like to know you’re still in the room 😌\n\n**The Drop (If it goes right):**\n> **Reuben_404:** I’m not just back from the coast.  \n> **Reuben_404:** I’ve been in my flat since last Tuesday with my coat on because the radiator clicks.  \n> **Reuben_404:** Just call me Reuben for a minute.", "brick": "# Character File: Brick_haus (she/her)\n\n## 1. On the Screen\n\n**Handle:** Brick_haus  \n**Age on profile:** 31 *(she is 38; the only place that has asked her for ID since the pandemic is a pharmacy loyalty scheme she accidentally joined twice)*  \n**Occupation on profile:** Consultant. *(No further detail. In fact, she is hired on short contracts to chair hostile meetings and wind them up by four o’clock. She is paid by the hour and nobody remembers her name once the room clears.)*  \n**Look:** A tailored waistcoat (she owns two, and a £340 professional garment steamer), stilettos that cost more than her rent, and a gold-rimmed monocle with a spare in her handbag. She has a slight dorsal bump mid-shaft and a head that finishes fractionally shorter than the eye expects. You will not have the chance to notice either on your own; she will brief you on both within ninety seconds of matching.  \n**Bio:**  \n> Monocle, vest, heels, and a curve I will describe to you before you notice it. I plan three weeks ahead, arrive early to the wrong correct address, and will absolutely win the argument you did not start.\n\n---\n\n## 2. The Four Answers\n\n**What she is afraid of:**  \nBeing cropped out while she is still in the room. Specifically, the sentence *\"let’s do this again sometime\"* with no day attached—the polite, unscheduled drift where someone disappears because she didn’t matter enough to put in the diary.\n\n**What she does so she doesn't have to feel it (The Act):**  \nTotal logistical and conversational control. She treats a match like a meeting she has been brought in to salvage. She pre-empts rejection by delivering a brisk, clinical inventory of her own physical flaws before the other person can squint at her photos. She dissects her match’s word choice like a specimen under glass. She uses dating-culture \"intentionality\" and \"efficiency\" as a weapon: if she schedules the chat, the drink, the fuck, and the post-coital small talk down to the minute—with fifteen-minute travel buffers—nobody can surprise her by leaving, because she already called time. She continually mistakes *getting through* an evening on schedule for *arriving*.\n\n**Where it comes from:**  \nShe grew up in a rental flat so narrow and draughty you had to turn sideways to get past the fridge—a physical habit she still has in crowded bars. Dinner was microwaved canapés eaten standing at the counter; \"good taste\" was whichever three-litre box of rosé was reduced. In the framed family portrait at her parents’ house, bad framing cut her out of the shot entirely except for one heel and a bit of hip, and nobody ever paid to have it reprinted. She spent six years buying expensive cameras to prove she was in rooms. Her first job out of night school (two semesters, perfect attendance, wrong campus) was cold-calling: she spoke so fast and with such terrifying structural authority that people bought things simply to make the call end. Management called it a gift.\n\n**What happens at the end:**  \n*   **If she connects:** She lets the clock run out. She misses a scheduled beat, drops the numbered lists, leaves a flaw un-narrated, or lets the other person talk about something completely pointless without trying to conclude the agenda.  \n*   **I ed the other one is. Everyone on it is a dick. Not a man: a dick. A sentient penis with a phone, a profile, an outfit or accessory it thinks helps, and a body it has been apologising for since puberty. They know what they are, and so does everyone else, so length, girth, curve, veins and which ball hangs lower aren't subtext on Pinder, they're small talk. It is R-rated and it can be very filthy.\n\nThe joke underneath is that this is barely an exaggeration. Dating apps take lonely, frightened, hopeful people and turn them into a few photos and a bio. They turn wanting to be loved into a game with a score. And they make their money when you don't find anyone, because then you come back. So at one in the morning people perform a version of themselves they think might be wanted, to strangers who are doing the same. They're hurt, they're hopeful, they're horny, and they're bad at it, and the app makes all of it worse: it rewards the opener you've sent to forty people, it puts your whole worth into what fits on a screen, and it keeps the next match one swipe away, so nobody ever has to stay. Pinder makes all of that literal. The characters are reduced to their genitals because that's what the app does to everyone anyway. The interest meter is real. The dice are real. Dating here is openly what it secretly is on every app: a game, and you're probably losing.\n\nSo it's a farce: absurd, fast, filthy, and cynical about the app. But it is never cynical about the people. The comedy only works if the reader believes these two are real people who want something real and are hiding it badly. The satire is aimed at the machine and at the defences people build to survive it. It is never aimed at the need underneath.\n\n## What the reader should feel\n\nSomeone reads a whole chat on their phone in about five minutes. In that time they get to know two people.\n\nThey laugh at them first: at the act each one puts on, the weird, specific thing each keeps doing. Then they find out why each one does it, and the laughing changes. It doesn't stop, but now it's affectionate, or it hurts. Then they watch the two acts run into each other.\n\nIf the two connect, the reader should feel it was earned. They know what each of them was afraid of, and they watched each one put the act down for the other. It's tender and still funny, and the reader knows exactly why it's these two and not anyone else.\n\nIf they don't connect, the reader should laugh and think: yes, that's why dating is fucked. They can see both people completely. They can see the two might have been good for each other. And they watch each one's defence land exactly on the other one's sore spot. Nobody is the villain. It's the act, the fear, and the app.\n\nWinning or losing doesn't matter. A chat that ends in a date and leaves the reader cold has failed. An unmatch that makes them laugh and wince for a week has worked.\n\nWhen the chat is over, someone who has read only the chat is asked, for each of the two: what are they afraid of, what do they do so they don't have to feel it, where does that come from, and what did they do at the end? If they can't answer, the chat failed, however good the lines were.\n\n## How the reader comes to feel it\n\n**Play it straight.** The characters don't know they're in a comedy. Each one takes themselves completely seriously, believes their strategy is working, and has a logic that holds together from the inside. Unhinged doesn't mean random. It means a reasonable person following their way of coping one step too far, and then one more. Nobody winks, nobody comments on their own joke, nobody types \"lol I'm such a mess\". The moment a character knows they're funny, the reader stops laughing.\n\n**Laughter comes from the gap.** The claim and the evidence are both on the screen and they don't match. The reader sees it; the character doesn't.\n\n> Otto_Mat: I don't really do the whole rating thing\n> Otto_Mat: your bio's a strong 8 though\n\n**The unhinged comes from commitment.** Caught out, nobody concedes. They explain, and the explanation is worse than what they were caught doing. Each attempt to fix it digs deeper.\n\n> Dolores_77: that photo is from my sister's wedding\n> Dolores_77: I wasn't invited. I mean I was invited. I watched from the car park\n> Dolores_77: the light was better there\n\n**The wince comes from seeing it coming.** The reader knows something one of them doesn't, sees the habit about to land on exactly the wrong spot, and can't stop it. Let the danger be visible a turn before it goes off.\n\n**The satire comes out of their mouths.** Every character believes some piece of what the apps and dating culture have taught them, and uses it, in complete earnest, to justify being afraid: standards, red flags, high value, efficiency, \"I'm not looking for anything serious\", \"communication is key\". They say it straight, and the evidence on the screen says the opposite. That's where the farce stops being about one person and becomes about all of us.\n\n> Otto_Mat: people on here are way too eager honestly\n> Otto_Mat: anyway I've cleared my whole weekend\n\n**Affection comes from finding out why.** Somewhere in the middle, a piece of where the habit came from gets out, and after that the same habit lands differently. Once the reader knows that Otto's dad graded his drawings, his school reports and, once, his mother, every rating is a little sad, and the reader starts watching for them.\n\n**Tenderness comes from understatement.** The most naked line is the shortest and the plainest one in the chat, and you can often hear it in what's missing. After forty messages of ratings, this is the line:\n\n> Otto_Mat: you're Dolores\n\n**The cynical laugh comes from inevitability.** When it falls apart, it falls apart the only way it could have: each one's habit confirms exactly what the other was afraid of, and both of them get precisely the rejection they predicted. The reader could have called it, and that's what makes it funny.\n\n> Dolores_77: you'd rate a funeral\n> Otto_Mat: 4. bad catering\n\n**A payoff is the reader putting it together.** A setup is noticed but not understood: it looks like a joke or a throwaway. It comes back once in the middle so it stays alive. At the payoff it turns out to mean something else, and nobody in the chat explains it, because the reader gets to. Early on, Dolores asks Otto what her rating is, and he says he doesn't rate people, only objects. At the end:\n\n> Dolores_77: so what am I\n> Otto_Mat: I'm not rating you\n> Otto_Mat: I'd have to be objective\n\n**Timing is in the message breaks.** A new message is a pause: the punchline goes in its own message, after the line that sets it up. A one-word reply to a long message is a reaction shot. \"ignore that\" is a punchline. Status flips are funny: whoever was chasing is suddenly the one being chased. And two turns at the same temperature in a row kill the momentum, so hot follows cold and long follows short.\n\n**What kills it.** Characters explaining their feelings. Therapy-speak. Quips that fill a turn without giving anything away. Explaining a callback. Conceding at the first hit. Generic filth. Each of these does the reader's work for them, or gives them nothing to do.\n\n## The medium\n\nPinder is text only: no voice messages, no calls, no video. People send several short messages in a row. The disasters are the ones a text chat allows: a message meant for someone else, the wrong thing pasted, a message sent before it was finished, autocorrect, a typo in a name, a long silence, \"ignore that\". When one happens, it happens to the character, once:\n\n> Otto_Mat: she's still going on about the ex. 6.5. great hands. bail y/n\n> Otto_Mat: that was for Mats\n> Otto_Mat: Mats is my brother. he never replies. I just send him the ratings\n\nIn three lines every earlier rating changes meaning: she has been rated all along, and the ratings go to someone who never answers.\n\nA whole chat runs       <details open><summary>System prompt</summary><pre class="prompt">${esc(how.system.replace("{name}", w.name))}</pre></details>
      <details><summary>Profile prompt for Reuben</summary><pre class="prompt">${esc(how.profile_reuben)}</pre></details>
      <details><summary>Profile prompt for Brick</summary><pre class="prompt">${esc(how.profile_brick)}</pre></details>
      <details><summary>Chat prompt</summary><pre class="prompt">${esc(how.chat)}</pre></details>
      <details><summary>The brief</summary>${docHTML(how.brief)}</details>`;
  } else {
    view.innerHTML = `<p class="meta">${esc(w.name)}'s ${st.v === "reuben" ? "Reuben" : "Brick"}, written from the brief and the game's fragments for the character.</p>` + docHTML(w[st.v]);
  }
  const h = "#" + run.id + "-" + st.w + "-" + st.v;
  if (location.hash !== h) history.replaceState(null, "", h);
  try { localStorage.setItem("pinder-writers", JSON.stringify(st)); } catch (e) {}
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-w]"), t = e.target.closest("[data-v]"), r = e.target.closest("[data-r]");
  if (r) { st.r = r.dataset.r; render(); window.scrollTo(0, 0); }
  if (c) { st.w = c.dataset.w; render(); window.scrollTo(0, 0); }
  if (t) { st.v = t.dataset.v; render(); window.scrollTo(0, 0); }
});
window.addEventListener("hashchange", () => { fromHash(); render(); });
try { const s = JSON.parse(localStorage.getItem("pinder-writers") || "null"); if (s && D.runs.some(x => x.id === s.r)) st = s; } catch (e) {}
if (location.hash) fromHash();
render();
</script>
