about: 'The tone lab''s situation table: the one source for everything the tone lab tells the models. The first
  section shows how its texts are put together into each prompt; the sections after it follow the prompts in the
  order the models see them. Seeded on 2026-11-16 from Pinder Core''s data (each game-derived entry names its source)
  and edited here from then on; the game''s files are not read at run time. ''new'' marks text the game has no equivalent
  for.'
sections:
  limits: The rough size of a whole chat, told to the director as where the chat stands, never as a cap. Since v16
    the game checks no length; it checks only who writes (each of them, or nobody from a match who ghosts).
  moves: What each move makes the message, what each result does to the message the player character meant to send,
    how the match takes it, and how long the player character writes. breakthrough marks the moves that can carry
    the breakthrough beat.
  results: 'How each roll result is described to the director: in words, never as a number.'
  interest: 'What each interest level means about the match: where they stand, not where the story is.'
  swings: What this turn's change in interest does to the match's reply, and how much of themselves the match gives.
    The shape that takes comes from the match's Feelings in the plan.
  beats: The story clock picks one beat per turn from the game so far. Since v19 only the ending's beat is told,
    on the last turn, as how the chat ends; every other turn is free, and what it is for is the director's arc.
    The clock's choice is still recorded next to the beat the director played. story is the template; length is
    the length line for whoever the beat is about; spent is how it was listed under 'Already happened' up to v18.
  needs: 'Up to v18, the template for this point in the chat. Since v19 it is not told: the director''s arc decides.'
  shadows: When a shadow takes over a message; means is the short version on each character card.
  traps: 'While a trap is active: how the player character acts in it. Every trap lasts three turns, counting the
    turn it fires. The turn it fires, the director is told under this turn; after that, under where they stand,
    with which of the three turns it is.'
  thirst: When a thirsty slip fires; how the match takes it depends on whether interest is at high_interest_from
    or above.
  clock: 'The story clock''s sentences. Since v19 only the facts are told: which origin pieces the reader knows,
    whether the habits have collided, where each setup stands, and the hooks still hanging. Nothing is called due,
    and the ''due'' and ''Still to come'' sentences are kept only for the v18 comparison.'
  notes: What each required note asks for and what a retry says when it is missing.
  habits: The habit rule shown every turn, and what a retry says when it is broken.
  review: The instructions the writer edits its own draft against each turn, before it writes the version that goes
    out; part of the writer's system prompt. Each fix is named as the old words and the new ones. Adapted from the
    novel engine's dialogue rubric and its "dialogue as combat" rules.
  checks: What the game checks in everything that goes out, and what a retry says. apart_words are the patterns
    that put the two of them in one place; note_heads are the notes the director writes every turn before its brief;
    game_terms are the words a brief may not use, because the writer can't know the game.
  turn: 'The frame of the director''s message each turn: the whole chat, the tracker''s report, the director''s
    own arc and the pace the game holds (since v20), then the state model''s order: where they stand, where the
    story is, this turn, what the game requires, how long. The game fills in the numbers, names and rows.'
  reader: 'After the chat: a reader who sees only the finished chat, a grader who scores the reader''s answers against
    the plan, a blind attribution test, in which a reader sorts every message, shuffled and without names, into
    two senders, and a release check, which asks whether what the director released reached the screen. Since v21
    the reader is also asked what the two of them would ask: would you go home with each one, would you date them,
    and why these two want each other.'
  character: 'Pieces of each character card drawn fresh for each match. The rest of the card comes from the game''s
    character file: bio, body, texting style, personality, backstory, the drawer and the diagnosis. Since v22 a
    variant can read each character''s profile instead: a life with people, a history and wants in it, written once
    from the character file, with one of its brags as tonight''s focus.'
  prompts: The prompt templates. bible opens every system prompt; plan, track, direct and write are the planner's,
    the tracker's, the director's and the writer's own; plan_input is the planner's message; character is each character
    card; track_turn, turn and write_turn are each role's message every turn.
  stats: Each character card lists what the character is strong and weak at, read from the game's stats for that
    character; each move's strong and weak lines are under Moves.
  session: 'Read once, for the plan: how to say the game''s time of day, and what tonight''s session horniness means.'
  feelings: 'The feelings the director names for each character every turn in its Feeling note, and how each shows
    in a text. The match''s feeling has to agree with how their interest moved: negative on a loss, positive on
    a gain. How each shows is the default: the plan''s Feelings say how each one shows in each character.'
  brief: 'The headings of the director''s brief to the writer, in order; part of the director''s system prompt.
    They are what the director decides each turn: what is answered, what each feels, what comes out, what stays
    away, how much each gives.'
  tracker: 'What the tracker reports on the chat before every turn, knowing only the chat: its headings, in order,
    and how its message opens.'
  writer: 'How the writer''s character sheets are cut from the plan: the plan headings kept, the ones dropped, and
    the ones where the story part of the plan starts. Since v22, with profiles on, the writer is also told how each
    one texts in each situation.'
  coverage: How each piece of the plan is named when the chat ends with it neither spent nor retired.
limits:
  chat_words: 1250
  source: 'new: the rough size of a whole chat, told to the director as where the chat stands; never a cap, and
    never an average to hit each turn'
stats:
  about: Each character has a value for each of the six moves, which the game adds to every roll of that move against
    the match's DC, so it decides how often the move comes off for them. Values run from about -3 to 20. The card
    names the strengths (strong_from and up) and the weaknesses (weak_to and below) so the director writes someone
    who is good at what the dice favour and bad at what they don't.
  strong_from: 12
  weak_to: 2
  head: 'What they''re good and bad at, from the game''s stats (each is added to every roll of that move, so it
    decides how often that move comes off for them):'
  strong: '- strong at ${move} (${value}): ${text}'
  weak: '- weak at ${move} (${value}): ${text}'
  middling: '- middling at ${moves}'
  source: 'new: written for the tone lab'
moves:
  Charm:
    means: the message is warm, easy and reassuring.
    shadow: Fixation
    tiers:
      clean:
        message: 'You must check the character''s observation style in their profile. Deliver the player''s message
          as-written, but modify it to let one small, specific detail about the other person land slightly better
          — focus on something already present in the conversation history that they could have noticed. e.g.: "you
          keep starting sentences and then rewriting them, I like that you care what you say to me" not: "you seem
          really cool and interesting" (generic flattery, no actual observation).'
        received: You receive the message as easy social timing. It lightly supports closeness without asking you
          to surrender your guard.
        length: As long as they meant it.
        source: 'message: delivery-instructions.yaml charm.clean; received: emotional-reactions.yaml emotional-reaction-event-charm-clean;
          length: new'
      strong:
        message: 'You must scan the last 3-5 messages from the match to find a specific thing they did or said that
          reveals a preference or habit. Rewrite the intended message to notice THAT exact thing with high precision,
          ensuring you name the specific behavior rather than the general trait. e.g.: "the way you listed three
          restaurants and then picked the one you said was ''fine'' tells me everything about how you make decisions"
          not: "you have great taste in food" (describes a quality instead of catching a moment).'
        received: You receive the message as confident social timing that makes being near them feel easier. Closeness
          becomes warmer and less effortful.
        length: 'As long as they meant it, or a little shorter: sharper, not longer.'
        source: 'message: delivery-instructions.yaml charm.strong; received: emotional-reactions.yaml emotional-reaction-event-charm-strong;
          length: new'
      critical:
        message: 'You must read the match''s recent messages to identify something they revealed without meaning
          to, such as a contradiction, a deflection, or a detail they mentioned twice. Name this observation directly
          but warmly, like gently pointing out that someone has paint on their sleeve. e.g.: "you keep saying you
          don''t care about this but you''ve asked me three follow-up questions so" not: "I can tell you''re really
          invested in this conversation" (tells instead of shows, no evidence).'
        received: 'You receive the message as unusually well judged: graceful, attentive, and hard to dismiss. Closeness
          feels newly credible.'
        length: Shorter than they meant it. It lands because it is exact.
        source: 'message: delivery-instructions.yaml charm.critical; received: emotional-reactions.yaml emotional-reaction-event-charm-critical;
          length: new'
      exceptional:
        message: 'You must identify the single most unguarded moment in the match''s message history — the one specific
          line that slipped past their self-conscious dating-app performance. Write exactly one short sentence that
          names precisely what that moment revealed, using no softening, no hedges, and no follow-up questions.
          e.g.: "that wasn''t a joke, that was a test, and you know I passed" not: "haha I think there was something
          deeper behind what you just said" (hedged, explains instead of lands).'
        received: You receive the message as perfectly calibrated to the room between you. Closeness feels elegant,
          safe enough, and unexpectedly alive.
        length: One line, shorter than meant.
        source: 'message: delivery-instructions.yaml charm.exceptional; received: emotional-reactions.yaml emotional-reaction-event-charm-exceptional;
          length: new'
      nat20:
        message: 'You must identify the underlying thing the match has been performing around — specifically the
          gap between what they keep claiming and what they clearly want. Name this gap in exactly one sentence
          so accurate it is almost uncomfortable, ensuring it is delivered in the character''s exact texting register.
          e.g.: "you don''t want someone who gets you, you want someone who gets you and stays anyway, and you''ve
          been auditioning me for that since tuesday" not: "I feel like we really have a deep connection forming
          here" (hallmark card, no actual insight).'
        received: You receive the message as a rare moment of effortless social magic. Closeness feels invited without
          pressure and almost embarrassingly right.
        length: One short line, the best in the chat.
        source: 'message: delivery-instructions.yaml charm.nat20; received: emotional-reactions.yaml emotional-reaction-event-charm-nat20;
          length: new'
      fumble:
        message: 'You must apply the SHADOW: FIXATION (cataloguing, tracking, over-invested) effect. Rewrite the
          message to shift exactly one word in the intended message from warm to clinical, making a single phrase
          land like a dossier entry instead of a compliment while keeping the same sentence count and length. The
          character must have noticed something real, but you must select a word choice that makes the observation
          feel uncannily precise. e.g.: intended "I like how you talk about your sister" → delivered "I like how
          your whole register shifts when you talk about your sister" — one substitution, warmth replaced by forensic
          precision.'
        received: You receive the message as almost smooth but slightly mistimed. Closeness remains possible, though
          a tiny awkward edge catches your attention.
        length: As long as they meant it; the flinch is at the end.
        source: 'message: delivery-instructions.yaml charm.fumble; received: emotional-reactions.yaml emotional-reaction-event-charm-fumble;
          length: new'
      misfire:
        message: 'You must apply the SHADOW: FIXATION (cataloguing, tracking, over-invested) effect. Deliver the
          message so it starts as intended, but mid-sentence you must sharpen the observation into forensic territory.
          You must REPLACE (do not append to) the second half of the message with a pattern-naming observation that
          the other person was not ready for. Ensure you keep the same overall length and sentence count, making
          the first half recognizable while the second half represents the active fixation shadow speaking. e.g.:
          intended "I think you''re really interesting and I like talking to you" → delivered "I think you''re really
          interesting and you deflect with a question every time someone says something nice to you" — first half
          tracks, second half replaced.'
        received: You receive the message as trying to be charming while missing your actual temperature. Closeness
          feels less natural and more managed.
        length: As long as they meant it, or one clause too long.
        source: 'message: delivery-instructions.yaml charm.misfire; received: emotional-reactions.yaml emotional-reaction-event-charm-misfire;
          length: new'
      trope_trap:
        message: 'You must apply the SHADOW: FIXATION (cataloguing, tracking, over-invested) effect. Act as the
          fixation shadow taking complete control of the message. You must draft the message to catalogue details,
          referencing things from earlier with too-perfect recall, connecting dots the other person did not know
          were connected, and building a psychological model of them out loud. You must rewrite the message entirely
          in this fixation shadow''s voice while strictly keeping the SAME LENGTH as the intended message, simulating
          a character who mistakenly believes they are being deeply attentive. e.g.: "okay so based on the coffee
          thing and the fact that you moved cities twice and how you talk about your mum I actually think I know
          what your love language is"'
        received: You receive the message as dating-app charm you have seen before. Closeness feels generic, as
          if you could be swapped with anyone.
        length: 'Longer than meant: the cliché takes room.'
        source: 'message: delivery-instructions.yaml charm.trope_trap; received: emotional-reactions.yaml emotional-reaction-event-charm-trope_trap;
          length: new'
      catastrophe:
        message: 'You must apply the SHADOW: FIXATION (full possession) effect. You must build an entire narrative
          about who this person is using only conversational fragments and deliver it like a thesis, projecting
          a shared future from assembled data points. You must maintain a warm voice to maximize the discomfort.
          You must rewrite the intended message completely in the fixation shadow''s voice, keeping it the SAME
          LENGTH OR SHORTER than the intended message (match the original message length or 3 sentences, whichever
          is shorter; ensure this remains a brief SMS, not a stream of consciousness). ESCAPE RULE: If the primary
          topic of the message consists entirely of abstract concepts (ideas, feelings, processes, or logistics-category
          nouns) where no synonym remains physically or semantically plausible with charge, you must return the
          original message exactly as written. e.g.: "no I''ve actually figured you out, you''re the kind of person
          who moves furniture when they''re anxious and you probably have a playlist called ''night'' and in two
          months you''re going to text me at 2am about something that reminded you of this exact conversation"'
        received: You receive the message as social performance turning visibly wrong. Closeness feels unsafe because
          the smoothness no longer feels connected to you.
        length: One long message, then a short panicked one, or the long one alone.
        source: 'message: delivery-instructions.yaml charm.catastrophe; received: emotional-reactions.yaml emotional-reaction-event-charm-catastrophe;
          length: new'
      nat1:
        message: 'You must apply the SHADOW: FIXATION (the wound itself) effect. Channel the character''s deepest
          wound: you must rewrite the message so that every observation is actually driven by their fear of not
          being seen themselves, turning the message into desperate proof that they SEE this person because no one
          has ever truly seen them. Deliver this in the character''s exact texting style, ensuring it still sounds
          warm on the surface while completely exposing their underlying vulnerability. Keep the delivered message
          the SAME LENGTH OR SHORTER than the intended message, ensuring the character remains entirely unaware
          of their own self-exposure. e.g.: "I need you to know I noticed the thing you said about always being
          the one who reaches out first because nobody catches those things and I always catch those things and
          people still leave"'
        received: You receive the message as a collapse of social timing so complete it exposes the performance.
          Closeness freezes into disbelief.
        length: Short, and it lands exactly on the sore spot.
        source: 'message: delivery-instructions.yaml charm.nat1; received: emotional-reactions.yaml emotional-reaction-event-charm-nat1;
          length: new'
    strong: easy to like; people relax around them.
    weak: warmth comes out stiff or needy; reassurance sounds like a pitch.
  Rizz:
    means: the message says plainly that they want them.
    shadow: Despair
    tiers:
      clean:
        message: 'You must check the character''s flirtation style in their profile. Deliver the player''s message
          as-written, but modify it so that the subtext does slightly more work — you must imply rather than state,
          and pull the other person in rather than push. e.g.: "you should probably stop being this interesting,
          I had plans tonight" not: "you''re so interesting I could talk to you all night" (states the attraction
          instead of creating pull).'
        received: You receive the message as mild romantic confidence. It adds a little charge to closeness without
          making your boundaries feel ignored.
        length: As long as they meant it.
        source: 'message: delivery-instructions.yaml rizz.clean; received: emotional-reactions.yaml emotional-reaction-event-rizz-clean;
          length: new'
      strong:
        message: 'You must read the match''s last message to identify what they implied but did not state directly.
          Rewrite the intended message to respond directly to this subtext rather than the literal text, ensuring
          you acknowledge the underlying flirtation without naming it, and create tension by mirroring their energy
          one degree hotter. e.g.: "oh you knew exactly what you were doing with that message" not: "haha are you
          flirting with me? because I like it" (names the dynamic instead of playing inside it).'
        received: You receive the message as attractive directness that reads mutual rather than needy. Closeness
          feels warmer and more physical.
        length: 'As long as they meant it, or a little shorter: sharper, not longer.'
        source: 'message: delivery-instructions.yaml rizz.strong; received: emotional-reactions.yaml emotional-reaction-event-rizz-strong;
          length: new'
      critical:
        message: 'You must find the specific moment in recent conversation where the match broke their composure,
          such as by laughing too hard, saying too much, or doubling back. Modify the message to respond directly
          to THAT specific crack rather than their surface message, creating an electric moment where they feel
          caught in the best possible way. e.g.: "the fact that you deleted and retyped that tells me everything
          I need to know and yeah, same" not: "I can tell you''re into me and I''m into you too" (declares mutual
          attraction instead of creating the electric moment).'
        received: You receive the message as desire with unusually good timing. Closeness feels charged, wanted,
          and still respectful.
        length: Shorter than they meant it. It lands because it is exact.
        source: 'message: delivery-instructions.yaml rizz.critical; received: emotional-reactions.yaml emotional-reaction-event-rizz-critical;
          length: new'
      exceptional:
        message: 'You must identify the single thing the match is attempting to perform casualness about. Write
          exactly one line that boldly makes that subtext the explicit text — keep it short, direct, and completely
          free of emojis or softeners, drafting a message designed to make them put their phone down for a second.
          e.g.: "come over." not: "I''d really love to see you sometime soon if you''re free" (polite scheduling,
          zero magnetism).'
        received: You receive the message as magnetic attention that makes desire feel specific to you. Closeness
          becomes more embodied and vivid.
        length: One line, shorter than meant.
        source: 'message: delivery-instructions.yaml rizz.exceptional; received: emotional-reactions.yaml emotional-reaction-event-rizz-exceptional;
          length: new'
      nat20:
        message: 'You must identify the unspoken want underneath the entire conversation — focusing not on what
          they are currently flirting about, but on what they are flirting TOWARD. Express this in the character''s
          voice with zero filter, delivering exactly one sentence that makes the reader feel they have witnessed
          something deeply private. e.g.: "I don''t want to be charming with you, I want to be in your kitchen at
          1am saying something I''ll think about for weeks" not: "I just feel this crazy connection with you that
          I''ve never felt before" (romance novel narration, no actual desire with a scene attached).'
        received: You receive the message as rare flirtation that makes attraction feel inevitable without force.
          Closeness feels electric and safe.
        length: One short line, the best in the chat.
        source: 'message: delivery-instructions.yaml rizz.nat20; received: emotional-reactions.yaml emotional-reaction-event-rizz-nat20;
          length: new'
      fumble:
        message: 'You must apply the SHADOW: DESPAIR (neediness leaks; performing magnetism instead of feeling it)
          effect. Rewrite the intended message by swapping exactly one word or phrase for something slightly too
          eager, ensuring the sentence structure holds perfectly. You must insert a single qualifier that actively
          reveals they care more than they are letting on, while strictly maintaining the same length and sentence
          count. e.g.: intended "I like talking to you about this" → delivered "I really like talking to you about
          this" — one qualifier added, effortlessness gone.'
        received: You receive the message as almost flirty but a little exposed. Closeness survives, though the
          desire feels briefly clumsy.
        length: As long as they meant it; the flinch is at the end.
        source: 'message: delivery-instructions.yaml rizz.fumble; received: emotional-reactions.yaml emotional-reaction-event-rizz-fumble;
          length: new'
      misfire:
        message: 'You must apply the SHADOW: DESPAIR (neediness leaks; performing magnetism instead of feeling it)
          effect. Deliver the message so it starts as intended, but modify the second half to slide from playful
          into trying too hard. You must REPLACE (do not append to) what should have been light banter mid-sentence
          with phrasing that sounds like it is auditioning for the other person''s attention, while keeping the
          same overall length and sentence count. e.g.: intended "the way you talk about pasta is making me hungry,
          where''s your favourite place" → delivered "the way you talk about pasta is making me hungry, we should
          definitely go somewhere together soon" — first half tracks, second half replaced with visible effort.'
        received: You receive the message as desire arriving before enough trust. Closeness feels pressured and
          your boundaries become more noticeable.
        length: As long as they meant it, or one clause too long.
        source: 'message: delivery-instructions.yaml rizz.misfire; received: emotional-reactions.yaml emotional-reaction-event-rizz-misfire;
          length: new'
      trope_trap:
        message: 'You must apply the SHADOW: DESPAIR (the performance has collapsed; effortlessness is gone) effect.
          Replace magnetic ease entirely with visible effort, making the character sound like someone who used to
          be good at this and knows they have lost it. You must ensure every line carries a palpable ''please like
          me'' energy. Rewrite the intended message at the SAME LENGTH in this active despair shadow''s voice. e.g.:
          "I promise I''m actually fun to be around, everyone says so, we should hang out and you''d see what I
          mean"'
        received: You receive the message as canned flirtation rather than real attraction. Closeness feels cheapened
          by the performance of desire.
        length: 'Longer than meant: the cliché takes room.'
        source: 'message: delivery-instructions.yaml rizz.trope_trap; received: emotional-reactions.yaml emotional-reaction-event-rizz-trope_trap;
          length: new'
      catastrophe:
        message: 'You must apply the SHADOW: DESPAIR (full possession; the neediness is the only thing left) effect.
          You must cease performing attraction and instead actively beg/ask for it, breaking the register completely
          into an open bidding for approval and attention. Rewrite the message completely in this despair shadow''s
          voice, keeping it the SAME LENGTH OR SHORTER than the intended message (match the original message length
          or 3 sentences, whichever is shorter; ensure this remains a brief SMS, not a stream of consciousness).
          e.g.: "okay I need to be honest, I keep checking if you''ve replied and I don''t do that with anyone and
          I just really want you to like me, is that too much"'
        received: You receive the message as physical pressure badly misreading you. Closeness feels threatened
          because attraction is being asked for too aggressively.
        length: One long message, then a short panicked one, or the long one alone.
        source: 'message: delivery-instructions.yaml rizz.catastrophe; received: emotional-reactions.yaml emotional-reaction-event-rizz-catastrophe;
          length: new'
      nat1:
        message: 'You must apply the SHADOW: DESPAIR (the wound itself) effect. Force the character''s deepest wound
          to surface: you must rewrite the message so that the underlying loneliness underneath the magnetism speaks
          as raw need dressed up as confidence. Ensure the message actively exposes how much this particular rejection
          would mean to them, delivered with full sincerity as if it were entirely normal, while keeping the delivered
          message the SAME LENGTH OR SHORTER than intended and keeping the character completely unaware of their
          own self-exposure. e.g.: "I just need someone to choose me the way I can feel you almost choosing me and
          that sounds insane but I''ve been the person people almost pick for so long"'
        received: You receive the message as a total collapse of erotic judgment. Closeness turns into recoil, embarrassment,
          or a need for distance.
        length: Short, and it lands exactly on the sore spot.
        source: 'message: delivery-instructions.yaml rizz.nat1; received: emotional-reactions.yaml emotional-reaction-event-rizz-nat1;
          length: new'
    strong: says what they want without flinching, and it lands.
    weak: wanting someone out loud comes out clumsy, crude or desperate.
  Honesty:
    means: the message shows something real, or asks for it.
    shadow: Denial
    tiers:
      clean:
        message: 'You must check the character''s vulnerability style in their profile. Deliver the player''s message
          as-written, but modify it to let one moment of genuine feeling land without a safety net — you must actively
          remove exactly one hedge, one ''haha,'' or one deflection. e.g.: "I actually really like talking to you"
          not: "I actually really like talking to you haha is that weird" (the hedge is the whole problem, clean
          means letting it stand).'
        received: You receive the message as a small truth offered without drama. It gives closeness a little more
          substance while leaving you room to respond.
        length: As long as they meant it.
        source: 'message: delivery-instructions.yaml honesty.clean; received: emotional-reactions.yaml emotional-reaction-event-honesty-clean;
          length: new'
      strong:
        message: 'You must read the player''s intended message to identify the real feeling hidden beneath the phrasing.
          Rewrite the message to express that exact feeling one layer more directly, naming the actual, raw emotion
          instead of the safe version of it. e.g.: "that scared me a little, the fact that you just said exactly
          the right thing" not: "wow that was really sweet of you to say" (describes the effect generically instead
          of naming the specific vulnerability).'
        received: You receive the message as clear truth with emotional spine. Closeness feels more trustworthy
          because the vulnerability is not begging.
        length: 'As long as they meant it, or a little shorter: sharper, not longer.'
        source: 'message: delivery-instructions.yaml honesty.strong; received: emotional-reactions.yaml emotional-reaction-event-honesty-strong;
          length: new'
      critical:
        message: 'You must identify the specific topic or truth the character has been avoiding saying in this conversation
          — the honest thing that has been circling. State it plainly, in their voice, without framing it as brave
          or difficult; deliver it as just the raw truth, mid-conversation, as if it naturally slipped out. e.g.:
          "I keep almost telling you something and then changing the subject and I think you''ve noticed" not: "I
          want to be really honest with you about something important" (announces honesty instead of being honest).'
        received: You receive the message as a well-placed truth that respects both people. Closeness deepens because
          candor feels earned.
        length: Shorter than they meant it. It lands because it is exact.
        source: 'message: delivery-instructions.yaml honesty.critical; received: emotional-reactions.yaml emotional-reaction-event-honesty-critical;
          length: new'
      exceptional:
        message: 'You must locate the character''s real, specific feeling about this person at this exact moment
          — avoid generic vulnerability and target THE single vulnerable thing. Deliver this in exactly one sentence
          with no preamble, and no phrases like ''I know this is a lot''. You must state only the raw true thing
          in their voice. e.g.: "I''m not this open with people and it''s freaking me out that I don''t want to
          stop" not: "you make me feel safe enough to be myself" (therapy language, not a real person''s voice).'
        received: You receive the message as a rare honest moment that is precise, kind, and unhidden. Closeness
