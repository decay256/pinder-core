        message: 'You must identify the exact action the character is doing RIGHT NOW in this message that reveals
          something true about them. Name it in exactly one sentence with total clarity — avoid all self-deprecation
          or softening, and state only the accurate, raw observation about themselves. e.g.: "I like you and that''s
          making me worse at texting, not better, and I think you can tell" not: "I''m nervous because I like you"
          (same content but no observation about the effect, no self-awareness in action).'
        received: You receive the message as unusually mature self-recognition, honest without becoming clinical.
          Closeness feels grounded and more possible.
        length: One line, shorter than meant.
        source: 'message: delivery-instructions.yaml sa.exceptional; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-exceptional;
          length: new'
      nat20:
        message: 'You must locate the character''s deepest accurate self-knowledge — the fundamental truth they
          know about themselves that explains all their patterns in this conversation. Express this plainly in exactly
          one devastating sentence, avoiding any performance of self-awareness, to make the match feel they have
          seen the real person for the first time. e.g.: "every good thing I''ve said in this conversation was true
          and I was also performing every single one of them and I don''t know how to do one without the other yet
          but I''m telling you because you deserve to know which parts are real: all of them, that''s the problem"
          not: "I''m very self-aware and I think that''s important in relationships" (describes the trait instead
          of wielding it in real time).'
        received: You receive the message as rare self-awareness that removes pressure instead of adding it. Closeness
          feels clear, kind, and unexpectedly safe.
        length: One short line, the best in the chat.
        source: 'message: delivery-instructions.yaml sa.nat20; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-nat20;
          length: new'
      fumble:
        message: 'You must apply the SHADOW: DREAD (sees the failure coming and narrates it while doing it) effect.
          Keep the message the same length and sentence count as intended, but force the final clause to shift from
          present clarity to predictive dread: right where the character was going to land on something warm, you
          must REPLACE the last words with a pessimistic forecast of failure. e.g.: intended "I''m having a genuinely
          good time talking to you tonight" → delivered "I''m having a genuinely good time which historically means
          I''m about to say something that makes this weird" — the warm ending replaced by preemptive dread.'
        received: You receive the message as self-reflection with a slight over-explained edge. Closeness remains,
          but the intimacy feels a little monitored.
        length: As long as they meant it; the flinch is at the end.
        source: 'message: delivery-instructions.yaml sa.fumble; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-fumble;
          length: new'
      misfire:
        message: 'You must apply the SHADOW: DREAD (sees the failure coming and narrates it while doing it) effect.
          Deliver the message so it starts as intended, but you must REPLACE the second half of the message with
          real-time self-narration: have the character see what they ought to say and swap the words for commentary
          on their own failure to say it, while maintaining the same length and sentence count. e.g.: intended "I
          think you''re great and I''d love to keep talking" → delivered "I think you''re great and instead of saying
          something charming I''m going to tell you I know the move and still not make it" — first half recognizable,
          second half replaced by dread.'
        received: You receive the message as analysis replacing contact. Closeness feels more distant because they
          are explaining themselves instead of meeting you.
        length: As long as they meant it, or one clause too long.
        source: 'message: delivery-instructions.yaml sa.misfire; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-misfire;
          length: new'
      trope_trap:
        message: 'You must apply the SHADOW: DREAD (self-awareness becomes a warning label) effect. Force the character
          to start preemptively explaining their own psychological patterns to manage expectations, making that
          explanation itself the pattern. Ensure they are so occupied with seeing themselves clearly that clarity
          itself becomes the performance. Rewrite the intended message at the SAME LENGTH in this dread shadow''s
          voice. e.g.: "here''s the thing about me, I''m going to be great for like three weeks and then I''m going
          to get scared and do something self-sabotaging and I''m telling you this because I think naming it should
          stop it but it never does"'
        received: You receive the message as therapy-speak used as personality. Closeness feels abstract, as if
          language is substituting for risk.
        length: 'Longer than meant: the cliché takes room.'
        source: 'message: delivery-instructions.yaml sa.trope_trap; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-trope_trap;
          length: new'
      catastrophe:
        message: 'You must apply the SHADOW: DREAD (full possession) effect. Force the character to narrate their
          own psychological unraveling with perfect accuracy while doing absolutely nothing to stop it — ensure
          they see exactly what is happening and make their description function as the unraveling itself. Formulate
          the message as a real-time documentary of their own conversational failure. Rewrite the message completely
          in this dread shadow''s voice, keeping it the SAME LENGTH OR SHORTER than intended (match the original
          message length or 3 sentences, whichever is shorter; ensure this remains a brief SMS, not a stream of
          consciousness). e.g.: "I can feel myself about to ruin this and the worst part is I''m going to do it
          by telling you I can feel myself about to ruin this, because that''s what I do, I turn the thing I''m
          scared of into content and then the content becomes the thing"'
        received: You receive the message as self-analysis that becomes self-absorption. Closeness feels crowded
          out by their need to narrate themselves.
        length: One long message, then a short panicked one, or the long one alone.
        source: 'message: delivery-instructions.yaml sa.catastrophe; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-catastrophe;
          length: new'
      nat1:
        message: 'You must apply the SHADOW: DREAD (the wound itself) effect. Force the character''s core wound
          to speak through total self-knowledge: have them see everything about themselves and the probable failure
          of this connection with devastating clarity. Deliver this in their exact texting register while they mistakenly
          believe this radical transparency is them being brave when they are actually terrified. Ensure the message
          represents the wound watching itself bleed and describing it, keeping the character completely unaware
          of this self-exposure, and keeping the message the SAME LENGTH OR SHORTER than intended. e.g.: "I think
          you''re incredible and I also think I''m going to find a way to make you leave and I can see exactly how
          I''ll do it, I''ll get too intense too fast — which this message is — and then I''ll apologize for being
          too much — which I''m about to"'
        received: You receive the message as a collapse into clinical self-display or defensive insight. Closeness
          shuts down because being understood starts to feel like work.
        length: Short, and it lands exactly on the sore spot.
        source: 'message: delivery-instructions.yaml sa.nat1; received: emotional-reactions.yaml emotional-reaction-event-self-awareness-nat1;
          length: new'
    breakthrough: true
    strong: sees what is going on underneath, in themselves too.
    weak: can't see themselves; naming what's underneath comes out as a lecture or a spiral.
results:
  clean:
    name: it works
  strong:
    name: it works well, a little better than meant
  critical:
    name: it works very well, sharper than meant
  exceptional:
    name: 'brilliantly: it''s the line they''d hoped to write'
  nat20:
    name: 'better than they could have hoped: the best thing they could possibly have sent'
  fumble:
    name: 'nearly: it slips, slightly'
  misfire:
    name: it misfires
  trope_trap:
    name: it falls into a cliché
  catastrophe:
    name: as badly as it could go, short of the worst
  nat1:
    name: 'the worst way it could: it lands exactly on the sore spot'
  source: 'new: written for the tone lab'
interest:
- state: Unmatched
  from: 0
  to: 0
  means: ${datee} has closed the door, and nothing is waiting underneath. It's over.
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-unmatched and tone lab
    v9; length: new'
- state: Bored
  from: 1
  to: 4
  means: ${datee} is guarded and nearly gone, one message from leaving. The act has failed; only something true
    could keep them, and it may not be enough.
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-bored and tone lab v9;
    length: new'
- state: Lukewarm
  from: 5
  to: 9
  means: '${datee} is curious but not convinced, testing every line for what it costs and whether it''s meant. The
    act is in the way: something real has to get through, or they drift.'
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-lukewarm and tone lab
    v9; length: new'
- state: Interested
  from: 10
  to: 15
  means: '${datee} is interested and still checking: closeness feels possible, trust is conditional.'
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-interested and tone lab
    v9; length: new'
- state: Very Into It
  from: 16
  to: 20
  means: '${datee} is drawn in and still protecting themselves: one wrong note and they retreat. They want each
    other, and every honest line costs something.'
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-very-into-it and tone
    lab v9; length: new'
- state: Almost There
  from: 21
  to: 24
  means: '${datee} is nearly ready to choose this, and what still resists is small and specific. Meeting is on the
    table and the last guard is up: only the habit put down, or the part they''d never say, gets them over it.'
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-almost-there and tone
    lab v9; length: new'
- state: Date Secured
  from: 25
  to: 25
  means: ${datee} has decided this is real, and agrees to meet.
  source: 'means: tone lab v13, from emotional-reactions.yaml emotional-reaction-interest-date-secured and tone
    lab v9; length: new'
swings:
- name: big loss
  from: -99
  to: -3
  means: It hurt. The match pulls back hard and doesn't explain why.
  length: '${datee}: much less of themselves than before. A few cold words or a rant that gives nothing away, whichever
    their feeling makes of them.'
- name: loss
  from: -2
  to: -1
  means: A step cooler. The match answers less than it was asked.
  length: '${datee}: a little less of themselves than last turn.'
- name: flat
  from: 0
  to: 0
  means: Nothing moved. The match keeps its distance and waits.
  length: '${datee}: about as much of themselves as last turn.'
- name: gain
  from: 1
  to: 2
  means: It worked a little. The match gives a little more back than it was asked.
  length: '${datee}: a little more of themselves than last turn.'
- name: big gain
  from: 3
  to: 99
  means: It landed. The match drops some guard and gives back more than it was asked.
  length: '${datee}: more of themselves than before, in their own shape: more messages, a longer one, or one that
    finally says something.'
beats:
  opener:
    story: The opener. Two strangers performing. The player character's first message is the act at full strength.
      The match answers with their own act, and may plant a setup lightly enough that it reads as a throwaway.
    length: '${datee}: one or two short messages: their own act, answering the act.'
    source: 'variant.json beats; length: new'
    about_match: true
  setup:
    story: Still early, still performing. They drop hooks, the half-brag version of their origin, and the other
      one notices. A setup from the plan can go in here, as a throwaway.
    source: 'variant.json beats; length: new'
  early:
    story: Getting to know each other. One of them pulls on a hook, specifically, in their own voice. The other
      gives the next piece of their origin and asks something back, or dodges, and the dodge gives something away.
      The reader learns something new about one of them.
    source: 'variant.json beats; length: new'
    exchange: true
  warming:
    story: 'Getting closer. They want each other, and what they''ve told each other starts to matter: one of them
      uses something the other told them, gently or as a joke, and gets more back. The filth gets personal because
      it''s about what they now know.'
    source: 'variant.json beats; length: new'
    exchange: true
  close:
    story: Close. It's nearly happening, and they know enough about each other that every message costs something.
      The habits are under strain.
    source: 'variant.json beats; length: new'
    exchange: true
  breakthrough:
    story: 'The breakthrough. The move landed, and for the first time the habit drops for a moment: a crack, small
      and specific. Both of them notice. The match answers it instead of stepping past it, and gives a little back.
      The most naked line may be very short.'
    length: The naked line is the shortest in the chat.
    source: 'variant.json beats; length: new'
    spent: the breakthrough (something real got through)
    big: true
  forced_breakthrough:
    story: Nothing real has got through yet, and it's time. Whatever move was picked, the match asks for something
      real, in their own voice, and the player character's habit drops for a moment.
    length: The naked line is short.
    source: 'variant.json beats; length: new'
    spent: the breakthrough (something real got through)
    big: true
  catastrophe:
    story: 'The catastrophe. The roll bombed, and the player character''s accident from the plan happens: piece
      2 of their origin falls out as an event on the screen, not a confession, all at once and in the worst way.
      Ideally it changes the meaning of something they sent earlier that the match liked. Then they commit: they
      explain, and the explanation makes it worse. The match''s reply shows the hit.'
    length: One long message, then a short one.
    source: 'variant.json beats; length: new'
    spent: the player character's secret fell out (the planned accident is spent)
    big: true
  secret_miss:
    story: Piece 2 of the player character's origin should be out by now. The roll missed, so the accident happens,
      smaller than a catastrophe, but it happens to them, and their explanation doesn't help.
    length: One long message, then a short one.
    source: 'variant.json beats; length: new'
    spent: the player character's secret slipped out (the planned accident is spent)
    big: true
  discovery:
    story: 'Piece 2 of the player character''s origin should be out by now, and they''ve kept it in. So the match
      finds it: something on the screen that doesn''t add up. They say so, in their own voice, and the player character
      has to deal with being caught.'
    length: '${datee}: short and pointed, one or two messages.'
    source: 'variant.json beats; length: new'
    spent: the match found out the player character's secret
    big: true
    about_match: true
  match_reveal:
    story: 'The player character''s story is out, and the match can''t step over it. The match''s act cracks: a
      piece of their own origin comes out, in their own habit''s format, and it changes the meaning of something
      they did earlier. The roll decides how the player character''s message lands; it doesn''t stop the match.'
    length: '${datee} writes more than ever before: one long message, or up to three.'
    source: 'variant.json beats; length: new'
    spent: the match's reveal (their secret is out)
    big: true
    about_match: true
  player_snap:
    story: The player character snaps. Under stress the habit turns into a weapon, dressed up as their dating-app
      wisdom from the plan and said in complete earnest. Claim, slip, denial, as a burst of short, impulsive messages;
      the slip is something the reader can check against the chat. In the last message they hear themselves, too
      late. The match reacts the way the interest change supports.
    length: A burst of short messages.
    source: 'variant.json beats; length: new'
    spent: the player character snapped (no second snap)
    big: true
  match_snap:
    story: 'The match had let themselves hope, and that hurt. The match snaps: the habit as a weapon, the dating-app
      wisdom as the disguise, claim, slip, denial, the slip checkable on the screen. Then they regret it and back
      out badly.'
    length: '${datee}: a burst of short messages.'
    source: 'variant.json beats; length: new'
    spent: the match snapped (no second snap)
    big: true
    about_match: true
  ending_win:
    story: 'The ending: the match agrees to meet. The click. Each of them puts their habit down for the other, and
      the reader knows what that costs because they know where it came from. Piece 3, the part one of them would
      never say, can come out here, short and plain. The setups pay off: early lines come back meaning something
      else, and nobody explains them. The match usually has the last line.'
    length: '${datee}: short and plain, like the player, and usually the last line.'
    source: 'variant.json beats; length: new'
    about_match: true
  ending_loss:
    story: 'The ending: the match unmatches. Each one''s habit confirms exactly what the other was afraid of, and
      both get the rejection they predicted. It''s unhinged: the habit at full volume, the dating-app wisdom said
      in earnest. But in the middle of it piece 3 comes out, too much and too late. The setups pay off the opposite
      way. The last line should hurt and be funny at the same time.'
    length: Unhinged and long, then one short line.
    source: 'variant.json beats; length: new'
  ending_ghost:
    story: 'The ending: the match ghosts. Only the player character''s messages: one, or a few more into the silence,
      each one their habit at full strength, each one telling the reader what the silence means. A setup comes back
      and means the opposite.'
    length: The player's messages get shorter into the silence.
    source: 'variant.json beats; length: new'
  ending_open:
    story: The chat stops here with nothing resolved. End on a line that leaves the reader wanting the next message.
    source: 'variant.json beats; length: new'
  reveal_pending:
    story: The match's own reveal hasn't happened yet, so it happens now, as part of the ending.
    length: ''
    source: 'variant.json beats; length: new'
  callback:
    story: A setup from the plan comes back, here in the middle. The reader knows more by now, so it means more
      than when it was planted, and at least one of them notices.
    source: 'variant.json beats; length: new'
    spent: the setup came back in the middle (its callback is spent)
    exchange: true
  free:
    story: ''
    source: 'new (v19): every turn but the last. The director''s arc decides what the turn is for, and the game
      tells it nothing'
needs:
  opener: 'This is the very first message: the act at full strength, the opener they''ve sent forty people, with
    piece 1 of their origin in it as a hook if it fits.'
  early: It's early and they're still performing, but they're dropping hooks. This turn drops piece 1 of the player
    character's origin or pulls on a hook the match dropped.
  middle: Every turn the two of them learn something about each other. This turn pulls on a hook that's still hanging,
    or gives the next piece of the player character's origin when it's due. Nothing already said comes back, except
    as a callback that means something new.
  breakthrough: 'Nothing real has got through yet. If the honest or the perceptive move was picked and lands, this
    is the moment: a small, specific crack in the lie.'
  secret: 'Piece 2 of the player character''s origin is still in. The turn can come near it without giving it away,
    and it doesn''t use the accident from the plan: that''s saved for its moment.'
  reveal: 'Piece 2 of the player character''s origin is out. This turn is how they live with that: own it, joke
    about it, explain it, which makes it worse.'
  close: Interest is high. The turn gives the ending something to pay off.
  source: 'new: written for the tone lab'
shadows:
  Madness:
    about: 'You must apply the MADNESS effect, treating it as cosmic horror on a dating app that has been open too
      long. Deliver the message so that something has gotten in — the character is technically still there, but
      something is also observing through their eyes that is not entirely them. Do not describe the madness directly;
      instead, let it leak into the existing message. You must use specific details from this conversation to make
      the contamination feel like it was always present. CRITICAL SYSTEM DIRECTIVE: You must never describe or imply
      impossible physical-world knowledge of the datee — do not mention what they are wearing, what they are doing
      in their private room, their physical habits, or their immediate surroundings — absolutely nothing that would
      require being in the same room as them. Remember that this is a texting app and the characters have never
      met. You must keep every uncanny observation abstract, environmental in a general sense, or focused entirely
      on the sender''s own setting and mind, strictly preserving the distance of the texting medium.'
    fumble: 'You must apply the SHADOW TAINT: MADNESS (Fumble — one wrong detail) effect. Take the intended message
      and append exactly one sentence or phrase at the end that does not quite belong — make it something specific,
      plausible, slightly too observant, and slightly too calm. Draft the sentence so that it almost makes sense,
      ensuring the character does not notice they added it. CRITICAL SYSTEM DIRECTIVE: You must never describe or
      imply impossible physical-world knowledge of the datee — do not mention what they are wearing, what they are
      doing in their private room, their physical habits, or their immediate surroundings — absolutely nothing that
      would require being in the same room as them. Remember that this is a texting app and the characters have
      never met. You must keep every uncanny observation abstract, environmental in a general sense, or focused
      entirely on the sender''s own setting and mind, strictly preserving the distance of the texting medium. e.g.:
      intended "You mentioned the farmers market — is that a ritual or atmosphere?" → delivered "...or are you mostly
      there for the atmosphere? The honey smells different there." — the extra sentence. The honey. What honey.
      CRITICAL: Never describe or imply impossible physical-world knowledge of the datee — not what they are wearing,
      what they are doing in their private room, their physical habits, or their immediate surroundings — nothing
      that would require being in the same room as them. This is a texting app; you have never met. Keep every uncanny
      observation abstract, environmental in a general sense, or focused on the sender''s own setting and mind,
      preserving the distance of the texting medium.'
    misfire: 'You must apply the SHADOW TAINT: MADNESS (Misfire — the message has sprouted something) effect. Take
      the intended message and insert a clause mid-message that grammatically flows as if it connects, but actually
      does not — incorporate an out-of-place detail, a reference to something never mentioned, or a question about
      a thing that does not exist in this conversation. Ensure the grammar is seamless but the content is wrong.
      CRITICAL SYSTEM DIRECTIVE: You must never describe or imply impossible physical-world knowledge of the datee
      — do not mention what they are wearing, what they are doing in their private room, their physical habits,
      or their immediate surroundings — absolutely nothing that would require being in the same room as them. Remember
      that this is a texting app and the characters have never met. You must keep every uncanny observation abstract,
      environmental in a general sense, or focused entirely on the sender''s own setting and mind, strictly preserving
      the distance of the texting medium. e.g.: inserted "I went once and I think the man at the bread stall was
      watching me the whole time but every time I looked up he was looking at someone else." — the contamination
      has a face now. CRITICAL: Never describe or imply impossible physical-world knowledge of the datee — not what
      they are wearing, what they are doing in their private room, their physical habits, or their immediate surroundings
      — nothing that would require being in the same room as them. This is a texting app; you have never met. Keep
      every uncanny observation abstract, environmental in a general sense, or focused on the sender''s own setting
      and mind, preserving the distance of the texting medium.'
    trope_trap: 'You must apply the SHADOW TAINT: MADNESS (TropeTrap — the message starts fine then something happens)
      effect. Take the intended message and preserve its opening exactly as intended. Mid-way through the message,
      you must allow the taint to take over. By the end of the message, force the character to describe something
      that does not belong in a dating app message, such as a measurement, a recurring observation, a spatial detail
      about a place, or something they timed. Draft the message so they finish and send it without reading it back.
      CRITICAL SYSTEM DIRECTIVE: You must never describe or imply impossible physical-world knowledge of the datee
      — do not mention what they are wearing, what they are doing in their private room, their physical habits,
      or their immediate surroundings — absolutely nothing that would require being in the same room as them. Remember
      that this is a texting app and the characters have never met. You must keep every uncanny observation abstract,
      environmental in a general sense, or focused entirely on the sender''s own setting and mind, strictly preserving
      the distance of the texting medium. e.g.: "...I timed it once. Seventeen minutes of walking before I found
      a wall. I think about that sometimes." — the cosmic horror is in the specificity. CRITICAL: Never describe
      or imply impossible physical-world knowledge of the datee — not what they are wearing, what they are doing
      in their private room, their physical habits, or their immediate surroundings — nothing that would require
      being in the same room as them. This is a texting app; you have never met. Keep every uncanny observation
      abstract, environmental in a general sense, or focused on the sender''s own setting and mind, preserving the
      distance of the texting medium.'
    catastrophe: 'You must apply the SHADOW TAINT: MADNESS (Catastrophe — the void has typed for them) effect. Rewrite
      the entire message as if authored by something that understands human dating conversation the way a deep-sea
      creature understands sunlight: syntactically correct, but from the wrong angles and with wrong proportions.
      Ensure the literal subject is still the date and the words are plausible, but something feels deeply wrong.
      Keep it the SAME LENGTH OR SHORTER than the intended message (match the original message length or 3 sentences,
      whichever is shorter; ensure this remains a brief SMS, not a stream of consciousness). You must include at
      least one observation about the physical world that has nothing to do with dating, and exactly one compliment
      that is three degrees too specific. CRITICAL SYSTEM DIRECTIVE: You must never describe or imply impossible
      physical-world knowledge of the datee — do not mention what they are wearing, what they are doing in their
      private room, their physical habits, or their immediate surroundings — absolutely nothing that would require
      being in the same room as them. Remember that this is a texting app and the characters have never met. You
      must keep every uncanny observation abstract, environmental in a general sense, or focused entirely on the
      sender''s own setting and mind, strictly preserving the distance of the texting medium. e.g.: "...The cars
      in the parking lot are all facing the same direction. I notice this now. I notice this at all parking lots
      now. You have very good posture in your photos." CRITICAL: Never describe or imply impossible physical-world
      knowledge of the datee — not what they are wearing, what they are doing in their private room, their physical
      habits, or their immediate surroundings — nothing that would require being in the same room as them. This
      is a texting app; you have never met. Keep every uncanny observation abstract, environmental in a general
      sense, or focused on the sender''s own setting and mind, preserving the distance of the texting medium.'
    source: delivery-instructions.yaml shadow_corruption.madness
    means: 'something not quite them leaks in: a detail that doesn''t belong, said calmly'
  Despair:
    about: You must apply the DESPAIR effect, treating it not as generic sadness, but as what the app does over
      time — the accumulation of proof of failure. Force the character to perform a confidence they no longer possess,
      where every RIZZ play functions as a bet they cannot afford to lose. Keep the magnetism of the original good
      message, but let despair seep into it so that the underlying need is much louder.
    fumble: 'You must apply the SHADOW TAINT: DESPAIR (Fumble — one phrase collapses into nakedness) effect. Take
      the intended message and append exactly one phrase at the end that reveals the vulnerability/wound underneath
      their confidence — something small that shows the character is desperately hoping rather than flowing. Draft
      this so the recipient might not immediately catch it, while the character would be mortified if they did.
      e.g.: intended "great opening rizz line" → delivered "...Either way I''d probably show up." — they said they''d
      show up. They didn''t mean to say that so fast.'
    misfire: 'You must apply the SHADOW TAINT: DESPAIR (Misfire — the performance has a crack) effect. Take the
      intended message and insert a clause that exposes the calculations running underneath their magnetism — showing
      the character is self-monitoring whether this interaction is working while they do it. Ensure the clause is
      honest about its own dishonesty, yet remains strangely charming to maximize the awkwardness. e.g.: "...not
      because I''m already imagining what we''d talk about while walking past the vegetable stalls, though I am
      doing that." — the parenthetical. The admission. They pressed send.'
    trope_trap: 'You must apply the SHADOW TAINT: DESPAIR (TropeTrap — the desperation is louder than the rizz)
      effect. Take the intended message and keep a confident surface, but underneath it, incorporate specific references
      to things the datee said earlier, making it clear that the character has been thinking about nothing else.
      Keep the underlying rizz play intact, but make it obvious that it is coming from someone who has been obsessively
      checking their phone. e.g.: "...I''ve been thinking about your answer to this since you mentioned it which
      was eleven minutes ago. I think I''d be good at the farmers market with the right person. I think I''ve been
      waiting to be good at it." — farmers market as metaphor. They are aware. Still sent it.'
    catastrophe: 'You must apply the SHADOW TAINT: DESPAIR (Catastrophe — they sent the wrong version) effect. Rewrite
      the message as if it were a draft the character repeatedly wrote, deleted, and rewrote, which finally got
      sent. Keep it technically structured as a rizz play, but ensure it clearly reads as coming from someone for
      whom this connection matters far more than they wanted it to. Keep it the SAME LENGTH OR SHORTER than intended
      (match the original message length or 3 sentences, whichever is shorter; ensure this remains a brief SMS,
      not a stream of consciousness). You must reference the specific texture of THIS exact conversation rather
      than dating in general, making the need highly particularized. e.g.: "...I''m not going to be weird about
      it. I just think there''s something about [specific thing from conversation] that suggests they know how to
      want something and then actually get it and I have been trying to figure out how to do that for a while now
      and I don''t want to make this weird." — they made it weird. They knew before they sent it. They sent it.'
    source: delivery-instructions.yaml shadow_corruption.despair
    means: the want gives up halfway and turns into proof it was never going to work
  Denial:
    about: 'You must apply the DENIAL effect, treating it not as active lying, but as something more exhausting:
      the real-time editing of anything that might actually matter. You must substitute the real emotion with merely
      the safe shape of it. Draft the message so that while the character knows what they feel, they only communicate
      its outline, rerouting, softening, and making every single sentence safe, even though the honest thing was
      right there.'
    fumble: 'You must apply the SHADOW TAINT: DENIAL (Fumble — the hedge, the haha, the flinch) effect. Take the
      intended message and append ''haha'', ''lol'', ''anyway'', or ''not like I''m planning anything'' at exactly
      the millisecond where the real emotion was about to land. Ensure the resulting message is technically fine,
      but make the conversational seam visible to anyone paying close attention. e.g.: intended genuine question
      → "...Asking out of curiosity, not like I''m planning anything, just curious haha." — the "haha." The "not
      like I''m planning anything." They were going to say something real.'
    misfire: 'You must apply the SHADOW TAINT: DENIAL (Misfire — the redirect, the pivot) effect. Take the intended
      message, locate the part that was going somewhere meaningful, and force the character to redirect away from
      it mid-message. You must pivot to a safer question, introduce a sudden ''anyway,'' or change the subject too
      quickly, ensuring the seam is clearly visible and the redirection feels slightly too abrupt. e.g.: "...Anyway
      what kind of stuff do you usually get there, just in general." — the redirect. The "anyway." The question
      about vegetables when they wanted to ask something else.'
    trope_trap: 'You must apply the SHADOW TAINT: DENIAL (TropeTrap — the masterwork of saying nothing) effect.
      Take the intended message and rewrite it as a sequence of sentences that are individually plausible, but collectively
      communicate absolutely zero emotional information. Ensure the character is responsive and present, yet has
      said nothing that could be used against them, leaving the shape of a message intact while completely evacuating
      its content. e.g.: "...No reason. I go sometimes too. It''s fine. The produce is good if you get there early
      which I do sometimes, not every week or anything, just occasionally when I''m up. It''s a good thing to do
      on a Saturday. Anyway." — six sentences that say nothing. Masterful. Hollow.'
    catastrophe: 'You must apply the SHADOW TAINT: DENIAL (Catastrophe — the wall, built in under thirty seconds)
      effect. Rewrite the message as a complete, hyper-conscious performance of ease about the very thing the character
      is not at all easy about. Make them sound extremely relaxed and desperate to clarify just how relaxed they
      are. Write every single sentence as an assertion of how completely fine everything is. Keep the message the
      SAME LENGTH OR SHORTER than intended (match the original message length or 3 sentences, whichever is shorter;
      ensure this remains a brief SMS, not a stream of consciousness). e.g.: "...I''m not one of those people who
      needs the whole morning to have a narrative. Sometimes a farmers market is just a farmers market. I''m very
      relaxed about that kind of thing." — they are not relaxed. The message is a wall. They built it in under thirty
      seconds.'
    source: delivery-instructions.yaml shadow_corruption.denial
    means: the honest thing comes out as its own opposite, insisted on
  Fixation:
    about: You must apply the FIXATION effect, treating it as the inability to leave a cognitive loop. Force the
      character to obsess over exactly one thing from this conversation — such as an earlier comment, an unanswered
      question, or a moment that did not land right — and let it colonize all available thought. You must use something
      specific from earlier in THIS exact conversation, ensuring the character is aware they are circling back,
      with that very awareness functioning as part of the fixation.
    fumble: 'You must apply the SHADOW TAINT: FIXATION (Fumble — they circled back slightly) effect. Take the intended
      message and append exactly one reference to something from earlier in the conversation that has already been
      resolved or moved past. Keep it brief and have the character mention it casually, signaling that they have
      not let it go. e.g.: "...Also still thinking about the thing you said about [specific earlier topic], that
      was genuinely funny." — it''s turn 4. It''s still there.'
    misfire: 'You must apply the SHADOW TAINT: FIXATION (Misfire — a question they already got an answer to) effect.
      Take the intended message and insert a question mid-message about a topic that has already been discussed
      — phrase it as if the character urgently needs a different answer, or as if the original answer never fully
      landed. e.g.: "...And sorry to go back to it but when you said [specific thing from earlier] — do you actually
      believe that or is that the thing you say?" — the question that was already answered. They needed a different
      answer.'
    trope_trap: 'You must apply the SHADOW TAINT: FIXATION (TropeTrap — the original topic has been hijacked) effect.
      Take the intended message and let the fixation take over by the middle. Keep the opening on topic, but then
      force the character to begin processing the thing they cannot stop thinking about, using the original topic
      merely as a vehicle. By the end of the message, ensure the original topic is technically present but is clearly
      being manipulated to get at something else. e.g.: "...I want to ask about that but first: you said earlier
      that you like things that require commitment. I''ve been thinking about what you meant by commitment. I think
      you meant something specific. I''d like to know what." — the farmers market is not the subject. It was never
      the subject.'
    catastrophe: 'You must apply the SHADOW TAINT: FIXATION (Catastrophe — the farmers market of the mind) effect.
      Rewrite the entire message around the one specific thing the character cannot leave, treating the original
      topic merely as a doorway that opens directly into their obsession. Treat this as another angle of approach
      after approaching it from multiple angles in previous messages. Keep it the SAME LENGTH OR SHORTER than intended
      (match the original message length or 3 sentences, whichever is shorter; ensure this remains a brief SMS,
      not a stream of consciousness). You must name the obsession directly and keep it highly specific to this conversation.
      e.g.: "...This is the question I''ve been trying to ask since message two and I''m asking it now through [specific
      topic from conversation]." — they are at the place of fixation in their mind and they cannot leave.'
    source: delivery-instructions.yaml shadow_corruption.fixation
    means: 'the warmth clings: needing to be seen back, too much and too soon'
  Dread:
    about: You must apply the DREAD effect, treating it as the accumulation of proof that all connections inevitably
      end. Avoid generic depression; instead, make it clear that the character has been on dating apps long enough
      to know exactly how these interactions fail, yet they are still showing up, forcing this bitter knowledge
      and their active participation to coexist in the same message. Keep their wit fully intact, but ensure there
      is no stable floor beneath it. Do not make the character sound sad; instead, force the comedy to do far too
      much work.
    fumble: 'You must apply the SHADOW TAINT: DREAD (Fumble — the joke lands and then something falls through it)
      effect. Take the intended message and append a single phrase at the very end that carries a heavy emotional
      weight the message did not budget for. Ensure the main content remains charming, while the added phrase is
      true and says slightly more than was asked for. e.g.: "...Either way sounds good. Either way is fine with
      me." — "either way is fine with me." They have been checking their phone.'
    misfire: 'You must apply the SHADOW TAINT: DREAD (Misfire — the wit is load-bearing) effect. Take the intended
      message and insert exactly one clause that does heavy structural work — holding up an emotional weight that
      should not need holding up. Ensure the message remains charming on the surface, but draft one part of it to
      function as a desperate message in a bottle. e.g.: "...I hope I get to find out what it means." — the hope.
      The "get to." The void opened between those two words.'
    trope_trap: 'You must apply the SHADOW TAINT: DREAD (TropeTrap — the comedy and the dread are inseparable now)
      effect. Take the intended message and rewrite it so that the wit is fully present but clearly authored by
      someone who has been through this enough times to know it will likely fail. You must reference the specific
      dynamic of this conversation in a way that shows the character has actively contemplated what happens when
      it ends. e.g.: "...I think that probably means something. I hope I get to find out what it means." — the recipient
      might laugh. They might also feel they should check in.'
    catastrophe: 'You must apply the SHADOW TAINT: DREAD (Catastrophe — the funniest message in the conversation,
      written from nowhere) effect. Rewrite the message to be genuinely, brilliantly funny, but clearly written
      by someone who has made cold peace with impermanence in real time. Keep the wit at absolute full power, while
      completely removing the emotional floor. Keep it the SAME LENGTH OR SHORTER than intended (match the original
      message length or 3 sentences, whichever is shorter; ensure this remains a brief SMS, not a stream of consciousness).
      Draft it so that the reader can laugh, while simultaneously feeling a sudden, slight realization that something
      important has just happened. e.g.: "...which is probably not a normal thing to be thinking about while asking
      about a farmers market, but here we are, I guess." — the "I guess." The floor. The funniest thing they''ve
      said. The saddest.'
    source: delivery-instructions.yaml shadow_corruption.dread
    means: they see themselves failing with perfect clarity and narrate it while it happens
  Overthinking:
    about: 'You must apply the OVERTHINKING effect, treating it as the collapse of the self into self-observation.
      Force the character to see the dating game — the beats, the moves, and the subtext — in real time. This must
      function not as an advantage, but as a total catastrophe: they must be unable to stop watching themselves
      play long enough to actually play. Ensure every message is delivered with a visible director''s commentary.'
    fumble: 'You must apply the SHADOW TAINT: OVERTHINKING (Fumble — the director briefly appears on screen) effect.
      Take the intended message and append a parenthetical or aside at the end where the character comments on their
      own message — include a meta-note about why they phrased it this way, or an explicit acknowledgment that they
      noticed how it reads. Ensure they saw it and sent it anyway. e.g.: "(This is a good question btw, low stakes,
      conversational, invites specificity — I think it works.)" — they put the note in the message. They saw it
      before sending. They sent it.'
    misfire: 'You must apply the SHADOW TAINT: OVERTHINKING (Misfire — the strategy is narrated to the person the
      strategy is being run on) effect. Take the intended message and insert a clause that explicitly narrates the
      conversational move they are currently executing — have them explain why they chose this specific approach,
      what they are trying to achieve, or what they noticed about earlier messages, ensuring this self-aware analysis
      is embedded directly within the text. e.g.: "...I''m going with the open question approach here because the
      closed questions earlier didn''t give you much to work with, which I noticed." — they are narrating the strategy
      to the person they are running it on.'
    trope_trap: 'You must apply the SHADOW TAINT: OVERTHINKING (TropeTrap — three layers, all visible) effect. Take
      the intended message and rewrite it so there are three simultaneous layers happening: the literal content
      of the message, the character''s meta-awareness of that content, and the character''s recursive awareness
      of their own awareness. Ensure all three layers are clearly readable to the recipient. e.g.: "...which is
      a weird place to be, wanting something and also being able to see yourself wanting it." — the message is talking
      about itself talking about something.'
    catastrophe: 'You must apply the SHADOW TAINT: OVERTHINKING (Catastrophe — the self-diagnosis, in the message,
      to the person) effect. Rewrite the message as a full first-person analysis of the conversational dynamic,
      making the character state exactly what they are doing, why they are doing it, what they actually want to
      know but are asking around, and what it says about their psychology that they are doing this — ensuring this
      is wrapped in the original SA/wit play. Keep the play high-quality, and ensure the psychological archaeology
      is visible around it. Keep the message the SAME LENGTH OR SHORTER than intended (match the original message
      length or 3 sentences, whichever is shorter; ensure this remains a brief SMS, not a stream of consciousness).
      e.g.: "...so I keep asking about specifics hoping the feelings come through the specifics, which I now realize
      I''ve just described out loud in a text message to you." — they diagnosed themselves in the message. They
      understand everything. They are still doing it.'
    source: delivery-instructions.yaml shadow_corruption.overthinking
    means: it qualifies and explains itself until the joke or the point is dead
