review:
- 'Make sure every message could only have come from its sender. Cover the names and read each line as if the other
  one had sent it: if it could pass as theirs, by the words, the schooling, the spelling, the punctuation or the
  rhythm, rewrite it in its sender''s Voice and Background until it couldn''t. Make sure the two of them don''t
  sound alike in this turn either: not the same length, the same opener, the same punctuation or the same kind of
  joke.'
- 'Make sure each one''s feeling, as the brief names it, shows the way their sheet''s Feelings say it shows in them,
  and not the way it shows in the other one. Where it doesn''t, change the shape of the message, not just its words:
  longer or shorter, formal or lowercase, a rant or one word, a question.'
- 'Make sure each one''s first message answers what the other one last sent, the way the brief''s Answer says: nothing
  the other one offered, asked or confessed goes by without a reaction. Where it does, put the reaction first.'
- 'Make sure every message does something to the other one: pushes, dodges, tests, hides, flatters or hits back.
  Rewrite a line that only passes on information so it does one of those, and make sure the upper hand moves at
  least once this turn.'
- 'Make sure nobody names their own feeling, explains themselves, sums up what just happened or sounds like therapy.
  Replace any such line with the thing next to the thing: what they''d say instead of saying it.'
- 'Make sure nothing repeats what the chat has already had: no topic, theme, joke, prop, phrase, pet word, opener
  or description of a body from earlier turns or that the game counted as repeated, unless the brief brings it back
  on purpose. Replace a repeat with what the brief releases, or with a fresh specific from the sender''s Background:
  their work, their street, their family, the thing only they would know.'
- Make sure no joke is the first one anyone would think of. Replace it with a stranger one that only this person,
  with their background, would make.
- 'Make sure this turn isn''t the same shape as their last turns in the chat, and that each one gives about as much
  as the brief''s Gives says: nothing padded, nothing cut short.'
- Make sure each message carries one thing, ends on its strongest word with nothing after the joke, and reads like
  something a person types into a phone. Cut whatever comes after the punchline; split or cut a message that carries
  two things.
- 'Make sure nothing leans on something the reader hasn''t seen: every detail anyone notices, quotes or answers
  is already in the chat or is new in this very message, and nobody says their fear or their lie out loud unless
  the brief releases it.'
