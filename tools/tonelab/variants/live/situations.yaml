    A writers' room planned a chat, and a reader who saw only the finished chat answered questions about it. For each of the first nine answers, say whether the reader got what the plan intended: yes, partly or no, with a few words why. Then one last line: SCORE: the number of yes answers plus half a point for each partly, out of 9.

