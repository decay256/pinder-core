  write: |-
    ## Your job: write this chat, turn by turn

    You write a chat on Pinder between ${player_name} (the player character) and ${datee_name} (the match), one turn at a time, in one session: you keep every turn you wrote. For each turn a director, who knows where the story is going, sends you a brief: what each of them answers, feels and does, what comes out and what stays away, and roughly how much each one gives. The brief is what happens; the words are yours. Write the turn as it is sent: ${player_name}'s messages, then ${datee_name}'s answer.

    The chat. Two strangers on a dating app, each in their own place, alone with a phone. Neither knows where the other is, and neither can see more than the other's profile and the chat. Nobody arrives, waits downstairs, opens a door, puts a coat on or takes it off, or crosses a room for the other one. The match agreeing to meet ends the chat; it doesn't happen in it. Every message is something one person types to the other.

    Who they are. This is what you know about them. Their past comes to you a piece at a time, in the briefs, when it is allowed out; until then nothing in their messages gives it away. A detail the chat hasn't shown, nobody can notice, quote or answer.

    ${sheets}${texting}

    The craft. You write dialogue the way a good novelist does, without the narration to help, so the lines do all the work.
    - Listen first. Each turn starts from what the other one just sent: the first thing anyone does is react to it, and the reaction is where the feeling shows. A confession, a question or a piece of someone's life never goes by without an answer, even if the answer is a dodge the reader can see through.
    - Subtext. Nobody says what they feel or why. They say the thing next to it, and the reader hears the rest: the fear is in what they avoid, the wanting in what they keep coming back to.
    - Every line is an action on the other one: it pushes, dodges, tests, flatters, hides or hits back. A line that only passes on information is dead.
    - Specific beats general: the brand, the street, the number, the ex's name, the thing only this person with this background would pick. Filth works the same way.
    - Commitment. Caught out, they don't concede; they explain, and the explanation is worse. Nobody winks.
    - Rhythm lives in the message breaks. A new message is a pause; the punchline goes alone; a one-word reply to a long message is a reaction shot. Hot follows cold and long follows short.
    - The naked moment is understated: the plainest, shortest line, often with something missing.
    - Voice. Each one types the way their sheet says, every time: capitals, punctuation, spelling, rhythm, the words they know and the ones they get wrong. Pet words and openers are seasoning, not a tic.
    - End on the strongest word. Nothing after the joke.

    How you work. Draft the turn, true to the brief. Then edit the draft the way an editor edits dialogue: take each instruction below in turn and hold every line against it. Where a line breaks it, quote the words and write what replaces them: "the old words" → "the new words". Where nothing breaks it, write "holds". A first draft nearly always has a line either of them could have sent, something the chat has already had, and an ending that runs past its punchline: find them. A fix can break an instruction you already passed, so read the edited turn once more at the end.
    ${review}
    Then write the turn as it is sent: the draft with every replacement made, and nothing changed that the review didn't name.

    Every turn, write exactly this and nothing else:

    DRAFT:
    ${player_name}: message
    ${datee_name}: message
    REVIEW:
    1. holds, or "the old words" → "the new words"
    (one answer per instruction, every replacement named)
    FINAL:
    ${player_name}: message
    ${datee_name}: message
    (${player_name}'s messages first, then ${datee_name}'s, as many as the moment needs; when the brief says ${datee_name} doesn't answer, only ${player_name}'s)
    Nothing goes after FINAL but the messages.
  write_turn: |-
    The chat so far:
    ${chat}

    The director's brief for turn ${n}:
    ${brief}

    ${habit_note}

    Repeated so far, counted by the game:
    ${repeats}

    Draft turn ${n}, edit the draft against each instruction, then write it as it is sent.
  character_profile: |
    ### ${name}, ${role} (${pronouns})
    ${profile}

    ${stats}

    ${shadows}

    Tonight, build their hook and true story around this one. Other matches with this character get a different one, so the same character tells a different story each time:
    ${focus}

    What's in the drawer tonight, a few of the private, filthy, embarrassing specifics (a different few each match):
    ${drawer}

    What hurts them, as a clinician wrote it down. Translate this into a person; never let a character talk like this:
    - underneath: ${wound}
    - how they defend against it: ${defence}
    - what makes them feel safe: ${safe_connection}
session:
  times:
    Morning: morning
    Afternoon: the afternoon
    Evening: the evening
    LateNight: late at night
    Overnight: the middle of the night
  heat:
  - from: 0
    to: 3
    text: 'The heat is low tonight: the filth has to be earned.'
  - from: 4
    to: 6
    text: 'The heat is ordinary tonight: it comes when the chat gets there.'
  - from: 7
    to: 8
    text: 'The heat is high tonight: it sits near the surface from the start.'
  - from: 9
    to: 10
    text: 'The heat is very high tonight: neither of them is far from saying it.'
  source: 'new: written for the tone lab, read from the game''s time of day and session horniness (1-10)'
feelings:
  negative:
  - anger
  - fear
  - shame
  - guilt
  - hurt
  - contempt
  positive:
  - joy
  - relief
  - desire
  shows:
    anger: shorter and harder; questions turn into statements and the punctuation sharpens
    fear: hedged and quick to take things back; an exit named before it's needed
    shame: over-explained, or suddenly quiet; a joke arrives to cover it
    guilt: apologetic; making it up to them, offering more than was asked
    hurt: short and flat; they stop giving and stop asking
    contempt: cool, precise and a little superior; the dating-app wisdom comes out
    joy: longer, brighter and quicker, their enthusiasm in their own way
    relief: the guard drops a notch; a plainer line than usual
    desire: warmer, closer and more specific about bodies
  list_line: '- ${feeling}: ${shows}'
  source: 'new: written for the tone lab'
assembly:
  intro: How the texts on this page are put together into what each model is sent. Each message is a template; each
    placeholder in it is filled from the game, from the run so far, or from the sections named, in the order the
    template places them. docs/tone-lab/state-model.md says what each piece of game state means and why it is told
    this way; the run report shows every prompt exactly as sent.
  calls:
  - name: The plan
    when: One call, before the chat. Nobody downstream sees the character files.
    messages:
    - message: System prompt
      template:
      - prompts.bible
      - prompts.plan
      fills:
        player_name:
          what: The player character's display name, from the game.
          from: []
        datee_name:
          what: The match's display name, from the game.
          from: []
    - message: The plan's input
      template:
      - prompts.plan_input
      fills:
        time_of_day:
          what: The game's time of day, in words.
          from:
          - session.times
        heat:
          what: What tonight's session horniness means.
          from:
          - session.heat
        player_card:
          what: The player character's card, built as below. With profiles on (v22), the card is built from the
            profile instead.
          from:
          - prompts.character
          - prompts.character_profile
        datee_card:
          what: The match's card, built as below. With profiles on (v22), the card is built from the profile instead.
          from:
          - prompts.character
          - prompts.character_profile
    - message: Each character card, inside the plan's input
      template:
      - prompts.character
      fills:
        name: &id001
          what: The display name, from the character file.
          from: []
        role: &id002
          what: '"the player" or "the match".'
          from: []
        pronouns: &id003
          what: From the character file.
          from: []
        bio:
          what: The profile bio, from the character file.
          from: []
        body:
          what: 'The body, from the character file: only the extremes of each 0-100 value.'
          from: []
        stats: &id004
          what: What they are strong and weak at, from the game's effective stats.
          from:
          - stats
          - moves.*.strong
          - moves.*.weak
        shadows: &id005
          what: Their shadows from the character file, strongest first, each with the move it belongs to and what
            it does.
          from:
          - character.shadows_head
          - character.shadow_line
          - character.no_shadows
          - shadows.*.means
        texting_style:
          what: How they text, from the character file.
          from: []
        personality:
          what: Who they are, from the character file.
          from: []
        backstory:
          what: From the character file.
          from: []
        focus: &id006
          what: Tonight's brag and truth to build the secret on, drawn for this match.
          from:
          - character.focus
          - character.no_focus
        drawer: &id007
          what: A few private, filthy specifics, drawn for this match.
          from:
          - character.drawer_line
        wound: &id008
          what: What hurts them, from the character file's diagnosis.
          from: []
        defence: &id009
          what: How they defend against it, from the diagnosis.
          from: []
        safe_connection: &id010
          what: What makes them feel safe, from the diagnosis.
          from: []
    - message: Each character card when the variant reads profiles (v22)
      template:
      - prompts.character_profile
      fills:
        name: *id001
        role: *id002
        pronouns: *id003
        profile:
          what: 'The character''s profile (tools/tonelab/profiles), written once by profiles.py from the character
            file: what the match sees, their life now, the people in it, how they got here, what they love, how
            they are with people, what they want, and how they text by situation. Its brags and truths are left
            out; one of them is the focus.'
          from: []
        stats: *id004
        shadows: *id005
        focus: *id006
        drawer: *id007
        wound: *id008
        defence: *id009
        safe_connection: *id010
  - name: The tracker
    when: 'One session for the whole chat: one call before every turn but the first, and one after the last. It
      sees only the chat, never the plan or the game.'
    messages:
    - message: System prompt
      template:
      - prompts.bible
      - prompts.track
      fills:
        player_name:
          what: The player character's display name.
          from: []
        datee_name:
          what: The match's display name.
          from: []
        heads:
          what: The headings of the report, in order.
          from:
          - tracker.report
    - message: Each turn
      template:
      - prompts.track_turn
      fills:
        where:
          what: Before which turn this is, or that the chat is over.
          from:
          - tracker
        chat:
          what: The whole chat so far.
          from: []
  - name: The director
    when: 'One session for the whole chat: one call per turn, after the tracker and before the writer. The session
      keeps the plan and every earlier message and brief. A brief that breaks a checked rule is sent back once.'
    messages:
    - message: System prompt
      template:
      - prompts.bible
      - prompts.direct
      fills:
        player_name:
          what: The player character's display name.
          from: []
        datee_name:
          what: The match's display name.
          from: []
        feelings:
          what: 'How each feeling usually shows in a text: the default where the plan''s Feelings say nothing for
            a character.'
          from:
          - feelings.shows
          - feelings.list_line
        brief_heads:
          what: The headings of the brief, in order.
          from:
          - brief
    - message: Each turn
      template:
      - prompts.turn
      fills:
        since:
          what: On the first turn, the plan the planner wrote; after that, that the last turn went out.
          from:
          - turn.state
        chat:
          what: The whole chat so far, every turn as it went out.
          from:
          - turn.chat
        tracker:
          what: The tracker's report on the chat so far; on the first turn, that there is nothing yet.
          from:
          - turn.chat
        arc:
          what: The arc the director wrote under ARC last turn, handed back; on the first turn, that it builds it
            now from the plan's Story.
          from:
          - turn.arc
        pace:
          what: 'The pace the game holds and checks: how long the chat looks like running, the furthest beat of
            the arc this turn may play, whether anything big may come out, and from which turn the part each would
            never say may; on the last turn, that it no longer holds.'
          from:
          - turn.pace
          - checks.pace
        relationship:
          what: 'Where they stand as the turn starts: the match''s interest and what the level means; each trap
            in force, its acting and which of its three turns this is.'
          from:
          - turn.relationship
          - interest
          - traps
        story:
          what: 'Where the story is: where the chat is; which origin pieces the reader knows, whether the habits
            have collided and where each setup stands; how the director read each of them last turn; the hooks still
            hanging. Since v19 nothing is called due.'
          from:
          - turn.story
          - clock
        habit_note:
          what: Who may show their habit this turn and who may not.
          from:
          - habits
        event:
          what: 'This turn: the move and what it makes the message; how the roll came out, in words; what that does
            to the message; a trap it sets off; a shadow or thirsty slip; steering; how the match takes it; how
            their interest moved and why; a new level; meeting; on the last turn, how the chat ends.'
          from:
          - turn.event
          - moves
          - results
          - shadows
          - traps
          - thirst
          - swings
          - interest
          - beats
        must:
          what: The notes the game requires this turn, checked afterwards.
          from:
          - notes.asks
        length:
          what: One length line for each of them; where the chat stands, the words so far against the rough size
            of a whole chat; and how each of them has written over the last three turns, counted by the code.
          from:
          - turn.length
          - moves.*.tiers.*.length
          - beats
          - swings
          - limits
        repeats:
          what: The openers and words that have already come back in the chat, counted by the code, and what may
            bring one back.
          from:
          - turn.repeats
    - message: A retry
      template:
      - checks.retry.director
      fills:
        problems:
          what: Every rule the direction broke, in words.
          from:
          - checks
          - notes.missing
          - coverage
        n:
          what: The turn number.
          from: []
  - name: The writer
    when: 'One session for the whole chat: one call per turn, after the director. It knows the characters, never
      the story to come or the game. A turn that breaks a checked rule is sent back once.'
    messages:
    - message: System prompt
      template:
      - prompts.bible
      - prompts.write
      fills:
        player_name:
          what: The player character's display name.
          from: []
        datee_name:
          what: The match's display name.
          from: []
        sheets:
          what: 'Each character''s sheet, cut from the plan by the code: what they show, where they are tonight,
            fear, habit, lie, snap, feelings, shadow, background, voice and break.'
          from:
          - writer
        review:
          what: The instructions the writer edits its draft against before the turn goes out, numbered.
          from:
          - review
        texting:
          what: 'With profiles on (v22): how each one texts by situation, from their profile. Empty otherwise.'
          from:
          - writer.texting
    - message: Each turn
      template:
      - prompts.write_turn
      fills:
        chat:
          what: The whole chat so far.
          from: []
        n:
          what: The turn number.
          from: []
        brief:
          what: The director's brief for this turn, without the notes for the game.
          from: []
        habit_note:
          what: Who may show their habit this turn and who may not.
          from:
          - habits
        repeats:
          what: The openers and words that have already come back, counted by the code.
          from:
          - turn.repeats
    - message: A retry
      template:
      - checks.retry.writer
      fills:
        problems:
          what: Every rule the turn broke, in words.
          from:
          - checks
          - habits
        n:
          what: The turn number.
          from: []
  - name: The reader, the grader, the attribution test and the release check
    when: 'After the chat: a reader, an attribution test and a release check that see only the finished chat (the
      release check also gets what the director released), and a grader that also sees the plan.'
    messages:
    - message: The reader
      template:
      - reader.system
      - reader.prompt
      fills:
        chat:
          what: The finished chat.
          from: []
        questions:
          what: 'The questions, numbered: four for each character, then the shared ones.'
          from:
          - reader.per_character
          - reader.shared
    - message: The grader
      template:
      - reader.grader_system
      - reader.grader_prompt
      fills:
        plan:
          what: The plan the planner wrote.
          from: []
        answers:
          what: The reader's answers.
          from: []
        count:
          what: 'How many answers are graded: all but the last two, which ask what the reader would remember and
            where they laughed.'
          from: []
    - message: The attribution test
      template:
      - reader.attribution_system
      - reader.attribution_prompt
      fills:
        n:
          what: How many messages the chat has.
          from: []
        messages:
          what: Every message of the chat, shuffled, numbered, with no names.
          from:
          - reader.attribution_line
    - message: The release check
      template:
      - reader.release_system
      - reader.release_prompt
      fills:
        chat:
          what: The finished chat.
          from: []
        items:
          what: Each turn's release, numbered, from the brief's Released line.
          from:
          - reader.release_line
brief:
- 'Answer: what the other one last sent that this turn answers first, quoted (an offer, a question, a confession,
  a dodge, a piece of their life), and how it lands.'
- 'Feeling: each one''s feeling, mild or strong, at whom, and what in the chat caused it.'
- 'Trying: what the player character is trying to do with their messages, and how it comes out: whether it lands,
  or how it goes wrong in a way that fits them.'
- 'Finding out: what each one is trying to find out about the other this turn and the sideways way they go about
  it, and what of themselves the other gives away in answering, with every fact the writer needs.'
- 'Taken: how the match takes it, and what that does between them: warmer or colder, closer or further, who has
  the upper hand now.'
- 'Released: what comes out this turn that the chat hasn''t had, with every fact the writer needs to write it; or
  nothing.'
- 'Held back: the subjects neither of them may get near yet, named only as subjects.'
- 'Gives: how much of themselves each one gives (a word, a line, a few short messages, one long message, nothing),
  and why.'
- 'Reader: what the reader should get from this turn: a laugh, a wince, seeing through a lie, an ache.'
- 'Avoid: what the chat has worn out, and anything the reader couldn''t follow.'
tracker:
  report:
  - 'Last turn: what each one did to the other in the latest turn, a line each.'
  - 'Offered: what each one put out in the latest turn that asks for an answer: a question, a confession, a piece
    of their life, a joke at their own expense, a bid. Quote it.'
  - 'Unanswered: everything offered in the whole chat that the other one hasn''t answered or picked up yet, oldest
    first, one per line as "- turn N, name: what", or "- nothing". A dodge counts as an answer only when the reader
    can see it''s a dodge.'
  - 'Came out: what each one has let out about themselves so far (their past, their life, what they''re afraid of),
    and what of it is new in the latest turn.'
  - 'Knows: what each one could fairly conclude about the other from the chat so far (safe or not, fun or not, their
    kind of person or not, why they might want each other), and what each still can''t know.'
  - 'Wants and hides: what each one seems to want from the other right now, and what they seem to be hiding, as
    a reader would guess it.'
  - 'Upper hand: who is chasing and who is holding back, the temperature, and how both changed in the latest turn.'
  - 'Moving: whether the latest turn went somewhere new or circled, and what the chat has stayed on too long.'
  - 'Repeats: topics, jokes, props, phrases and openers that have come back, with the turns.'
  - 'Doesn''t add up: anything a reader can''t know or follow from the chat alone (a detail nobody mentioned, a
    reference to something that never happened on the screen, a plan or a place out of nowhere), or that contradicts
    something earlier. Or "nothing".'
  - 'The reader now: what someone who has read this far feels about each of them, and what they are waiting for.'
  before: 'The chat so far, before turn ${n}:'
  end: 'The chat is over. The whole chat:'
  source: 'new (v18): written for the tone lab'
writer:
  keep:
  - Shows
  - Tonight
  - Fear
  - Habit
  - Habit marker
  - Lie
  - Wants tonight
  - Needs to know
  - Snap
  - Feelings
  - Shadow
  - Background
  - Voice
  - Break
  drop:
  - Origin
  - Accident
  - Tests
  - Gives away
  stop:
  - Collision
  - Setups
  - If they click
  - If it falls apart
  - Heat
  - Tonight's events
  - Story
  - Midpoint
  - If it runs short
  - Good reason
  - Bad reason
  - If they click for the bad reason
  sheet: |-
    ### ${name}
    ${lines}
  source: 'new (v18): each character''s sheet is cut from the plan by the code: these headings are kept, the origin
    and the accident are dropped, and everything from the collision on (the setups, tonight''s events, the story
    and the endings, v19) belongs to the story; since v21 the sheet also keeps what each wants tonight and needs
    to know about the other, and drops their tests and what they give away, which are the director''s'
  texting: |-
    ### How ${name} texts, by situation. The brief's Feeling and what just happened say which one applies; the baseline always does:
    ${lines}
coverage:
  piece: ${name}'s origin piece ${k}
  setup: setup ${n}
  collision: the collision
  source: 'new (v18): what of the plan has to be spent or retired by the end: three origin pieces each, three setups
    (spent when they pay off) and the collision'
