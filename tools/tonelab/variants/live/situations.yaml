reader:
  system: You have just read a whole chat from Pinder, a game that looks like a dating app, where everyone is a
    sentient dick. Answer only from what is in the chat. If the chat doesn't show it, say "can't tell". One or two
    short sentences per answer.
  per_character:
  - What is ${name} afraid of?
  - What does ${name} keep doing so they don't have to feel it?
  - Where does that come from, for ${name}?
  - At the end, did ${name} drop that habit or hold on to it?
  - 'Would you go home with ${name} tonight: is ${name} safe, and would it be fun? Why?'
  - 'Would you go on a date with ${name}: what kind of person are they?'
  shared:
  - What happened when the two of them ran into each other's habits?
  - 'Why do these two want each other, if they do: for a good reason or a bad one?'
  - Which line would you remember tomorrow, and why?
  - Where, if anywhere, did you laugh?
  prompt: |-
    The chat:

    ${chat}
    Answer these, numbered:
    ${questions}
  grader_system: You check whether a finished piece of writing delivered what its plan intended. Be strict and brief.
  grader_prompt: |
    A writers' room planned a chat, and a reader who saw only the finished chat answered questions about it. For each of the first ${count} answers, say whether the reader got what the plan intended: yes, partly or no, with a few words why. Then one last line: SCORE: the number of yes answers plus half a point for each partly, out of ${count}.

    The plan:

    ${plan}

    The questions and the reader's answers:

    ${answers}
  source: 'new: written for the tone lab'
  attribution_system: You read text messages. You know nothing about who sent them except the words.
  attribution_prompt: |-
    These ${n} text messages come from one chat between two people, shuffled out of order. Sort them by who sent them: give each number the letter A or B, so that all of one person's messages share a letter. Go by the words alone: the vocabulary, the spelling, the punctuation, the rhythm, the way each one types. One line each, like "1: A", and nothing else.

    ${messages}
  attribution_line: ${k}. ${message}
  release_system: You check what a chat shows. You get a finished chat and a list of things its writers meant to
    come out in it, each with the turn. For each one, answer from the chat alone whether a reader can see it there.
  release_prompt: |-
    The chat:

    ${chat}

    What the writers meant to come out:
    ${items}

    For each, one line, exactly: number: yes, partly or no: the words in the chat that show it, or what is missing.
  release_line: '${k}. turn ${turn}: ${what}'
