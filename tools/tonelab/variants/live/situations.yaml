notes:
  asks:
    TOLD:any: 'something new from one of their origins comes out, the next piece of whoever it fits (note: TOLD)'
    TOLD: 'the next piece of ${name}''s origin comes out (note: TOLD)'
    COLLIDED: 'one''s habit lands on the other one''s fear, the way the plan''s Collision says (note: COLLIDED)'
    PLANTED: 'a setup from the plan is planted as a throwaway (note: PLANTED and its number)'
    CALLBACK: 'a setup comes back, meaning more by now (note: CALLBACK and its number)'
    PAID: 'a setup pays off (note: PAID and its number)'
    nothing: '- nothing beyond the template'
  missing:
    TOLD:any: nothing new from either origin came out (no TOLD note)
    TOLD: the next piece of ${name}'s origin didn't come out (no TOLD note for them)
    COLLIDED: their habits didn't collide (no COLLIDED note)
    PLANTED: the setup due to be planted wasn't (no PLANTED note)
    CALLBACK: the setup due to come back didn't (no CALLBACK note)
    PAID: nothing was cashed in (no PAID note)
    too_many_pieces: ${name} gave away more than one piece of their origin in one turn
  source: 'new: written for the tone lab'
habits:
  banned: ${name}'s habit (${shown}) showed in each of the last two turns, so it stays out of this turn completely.
  allowed: ${name}'s habit (${shown}) can show in one message this turn at most, or not at all.
  broke_ban: ${name}'s habit showed although it had to stay out of this turn
  too_often: ${name}'s habit showed in ${n} messages, one at most
  source: 'new: written for the tone lab'
checklist:
- Where are they? Each alone in their own place, apart. Does any line put them in one place, or let one see or know
  where the other is?
- What did the other one just say, give away or dodge, and does this answer it?
- 'What does this do to the reader: a laugh, a wince, seeing through a lie, an ache?'
- What does it cost the one who sends it? Is their fear nearer the surface than last turn?
- What does the chat need at this interest level, and does this do it?
- 'Is anything stale back: a prop, a joke, a description, a habit, a line?'
- Does each line sound like the one who sends it, carry one thing, and read like something a person would type?
- Does the roll show in the message itself, and does the match's answer show the feeling you named?
