# The tone lab's scorecard (v23): candidate metrics for the profile, the plan and the chat.
#
# Every dimension scores 1 to 6. There is no midpoint: a 3 leans fail and a 4 leans pass, so
# every score has to come down on one side of the bar. Each dimension writes its own bar as
# `line` (what puts it at 4 rather than 3); `low` and `high` describe the ends.
#
# priority: core = we need it to know whether the product works; useful = it steers prompt
# work; diagnostic = it explains a failure once we know there is one.
# batch: dimensions with the same family and batch are judged in one call.
# probe: a separate reader call that sees only `sees` and answers `ask`; its answer goes to the
# judge with the rest of the material. Used where the judge must not be the one who knows.
# scope: set = needs several artefacts (seeds, versions, writers) at once; scored on a set
# target that holds them all, not per artefact.
# needs: materials a dimension needs; a target without them skips it rather than scoring 1.
# source: whose rule the dimension states, where it comes from one.
# A family's `context` replaces the judge's general description of the lab for that family.

scale:
  1: Fails outright. The thing is absent, or works against what we need.
  2: Fails. Present in name only, or too weak to change what a reader gets.
  3: Leans fail. There, but below the bar; a reader would notice what is missing.
  4: Leans pass. Meets the bar, with flaws a careful reader notices.
  5: Good. Does it well; small flaws only.
  6: As good as this gets. Nothing worth changing.

families:
  profile:
    title: The profile
    artefact: one character's profile, the document the director and the writer work from
  plan:
    title: The plan
    artefact: the story plan a planner writes for one match at the start of the night
  chat:
    title: The chat
    artefact: >-
      the chat as the reader sees it, played turn by turn as the game's dice fall, written in one
      go by a writer, or written by a writer improvisation by improvisation
    context: >-
      The lab makes Pinder's chats. Pinder looks like a dating app and is a satire of one: everyone
      on it is a sentient penis with a phone, a profile and a life, so bodies are small talk, and it
      can be very filthy. A reader reads a whole chat in about five minutes and gets to know two
      people: they laugh at each one's act, find out sideways why each does it, and watch the two
      acts run into each other. It is cynical about the app and never about the people. Whether
      they connect does not matter: a chat that leaves the reader cold has failed, and one that
      makes them laugh and wince has worked. The test is whether someone who has read only the chat
      can say, for each of the two, what they are afraid of, what they do so they don't have to
      feel it, where that comes from, and what they did at the end. Some chats were played turn by
      turn with the game's dice and a plan; others were written in one go by a writer from two
      character profiles that writer wrote, with no plan, no dice and no turns; others again were
      written by a writer improvisation by improvisation, told before each one how it goes for the
      first character (the approach, how well it comes off, any trap, how the other's interest
      moves). Those instructions are part of the design: the reader never sees them, and the work
      is how well the chat plays them.

materials:
  profile: the profile being scored
  game: what the game's character file gives this character (the input the profile had to keep)
  cast: the other profiles of the same generation
  brief: >-
    what the chat was written from: for a chat the game played, everything the planner was given
    about the two characters and tonight; for a writer's chat, the two profiles that writer wrote
  plan: the plan
  chat: the chat
  chat_but_last: the chat without its final turn (a writer's chat, without its last fifth)
  chats: every chat in the set, each under its writer's name
  chat_masked: the chat with the speakers' names replaced by message numbers
  dice: what the game rolled each turn, and what it did to interest
  improvisations: >-
    what the writer was told before each improvisation, each followed by what they wrote for it; for
    a set, the instructions alone, the same for every chat in it

sees:
  profile: [profile, game, cast]
  plan: [brief, plan]
  chat: [chat, plan, brief, dice, improvisations]

dimensions:

# ── the profile ───────────────────────────────────────────────────────────────

- id: profile.life
  family: profile
  batch: 1
  name: A life to find out about
  priority: core
  tells: >-
    How much of a life there is for a chat to find: people, places, job, money, routines,
    and things going on this week.
  method: >-
    List the facts a character could plausibly bring up tonight, by type (work, home, people,
    money, routines, plans), and judge how many there are and how usable.
  low: Mostly traits, jokes and body. Few facts a chat could find; no current situation.
  line: >-
    A 4 has at least a dozen concrete, usable facts across at least four types, including
    something happening this week. A 3 has fewer, or they cluster in one type.
  high: Dense with usable facts of every type, several live this week, each a possible thread.

- id: profile.ordinary
  family: profile
  batch: 1
  name: Ordinary life outweighs humiliation
  priority: core
  tells: >-
    Whether this is a life or a list of humiliations, the original complaint about the
    backstories.
  method: >-
    Label each sentence as ordinary life, humiliation, sincere, sexual or wound, and judge
    the shares.
  low: Humiliation, sex and wound set the tone; ordinary life is a garnish.
  line: >-
    A 4 has ordinary life as the largest single share, and the humiliations stand out
    because of it. A 3 still reads as a list of humiliations or sex.
  high: An ordinary life with sharp moments; the comedy comes from the ordinary detail.

- id: profile.distinct
  family: profile
  batch: 1
  name: Distinct from the rest of the cast
  priority: core
  tells: Whether this character is their own person rather than a variation on another.
  method: >-
    Compare with the other profiles: shared motifs, situations, jobs, wounds, phrasings.
  low: Swap the name and it could be someone else in the cast.
  line: >-
    A 4 shares no motif or situation with another profile; parallels exist only at the level
    of type (two people with creative jobs). A 3 recycles at least one motif, or has a wound
    or situation that closely mirrors another's.
  high: Nothing in it could belong to anyone else in the cast.

- id: profile.consistent
  family: profile
  batch: 1
  name: Internally consistent
  priority: core
  tells: Ages, dates, money, places, body, claims and timeline agree with each other.
  method: List contradictions with quotes; judge their number and how much they matter.
  low: Several contradictions, or one that breaks the character.
  line: >-
    A 4 has no contradiction a reader would catch, at most a soft tension. A 3 has one clear
    contradiction.
  high: Fully coherent, and the details reinforce each other.

- id: profile.fidelity
  family: profile
  batch: 1
  name: Faithful to the game file
  priority: core
  tells: The bio, items, body, drawer and clinician's notes the game gives survive and are respected.
  method: Check each element in the game file against the profile.
  low: Elements missing or changed.
  line: >-
    A 4 has everything the game gives, present and not contradicted, even if lightly used.
    A 3 drops or alters something.
  high: Everything present, and the life explains it (the items and the drawer make sense for this person).

- id: profile.voice
  family: profile
  batch: 2
  name: The profile is enough to write them
  priority: core
  tells: Whether a writer who has only this profile produces this character and no other.
  method: >-
    A fresh reader writes five messages from the profile alone; the judge checks whether
    each could only have been sent by this character, against the rest of the cast.
  probe:
    sees: [profile]
    ask: >-
      From this profile alone, write five short dating-app messages this person would send
      tonight, each labelled: (1) an opener to someone they fancy, (2) a reply when the other
      person has gone quiet, (3) a reply when caught in a lie, (4) a message at 2 a.m.,
      (5) the moment they stop performing.
  low: The messages are generic dating-app voice; nothing ties them to this person.
  line: >-
    A 4 has at least three of the five carrying this character's life or texting habits so
    plainly that nobody else in the cast could have sent them. A 3 has two or fewer.
  high: All five unmistakable, and the situations come through as different.

- id: profile.situations
  family: profile
  batch: 2
  name: Texting changes with the situation
  priority: useful
  tells: The texting situations describe different behaviour, not one voice reworded.
  method: >-
    Read the texting lines and judge whether each predicts a different message shape,
    length, timing or habit.
  low: The lines restate one voice, or describe a mood instead of how they type.
  line: >-
    A 4 has at least seven in ten situations predicting observable differences (length,
    punctuation, timing, what they reach for). A 3 has fewer, or no situations at all.
  high: Every situation distinct and observable; you could tell the situation from one message.

- id: profile.texting_vs_cast
  family: profile
  batch: 2
  name: Texting differs from the rest of the cast
  priority: useful
  tells: Hurt Reuben does not read like hurt Brick.
  method: Compare the same situations across the cast's profiles.
  low: The same habits as others (everyone goes lowercase when hurt).
  line: >-
    A 4 differs from every other profile in most situations. A 3 matches another character
    in several.
  high: In every situation the habit is this character's own.

- id: profile.wound
  family: profile
  batch: 2
  name: The wound explains the habits
  priority: core
  tells: Whether the wound is a cause, not a label.
  method: >-
    Check three links: an event in the timeline causes the wound; the wound produces a habit
    in how they are with people; the habit shows in a texting line.
  low: The wound is asserted and connects to nothing.
  line: A 4 has all three links, even if one is thin. A 3 is missing a link.
  high: Each link is specific, and the chain is shown rather than stated.

- id: profile.likeable
  family: profile
  batch: 2
  name: Something to like
  priority: core
  tells: Whether a stranger could come to like them, which a guard-down moment needs.
  method: A fresh reader names what they would like; the judge checks it is specific and shown.
  probe:
    sees: [profile]
    ask: >-
      Name the one thing you would genuinely like about this person if you met them, and the
      one thing you would find hardest to forgive. Be specific, and no jokes.
  low: Nothing to like beyond being funny, or the reader's answer is generic.
  line: >-
    A 4 lets the reader name a specific, non-ironic quality the profile shows in action, not
    just claims. A 3 offers only a generic or claimed quality.
  high: Several, shown through what they do for other people.

- id: profile.tests
  family: profile
  batch: 3
  name: Something to test for
  priority: core
  tells: >-
    The dealbreaker and what they find out first can be seen in a chat, so the other person's
    evaluation has something to work on.
  method: Check each is observable in text, and that a single message could trip it.
  low: Abstract ("dishonesty"), missing, or not observable over text.
  line: >-
    A 4 has both observable and specific to this person; you could write the message that
    trips each. A 3 has one vague or missing.
  high: Both sharp, funny and tied to the life.

- id: profile.people
  family: profile
  batch: 3
  name: The people in their life are live threads
  priority: useful
  tells: Whether the people can come up tonight, rather than being a cast list.
  method: >-
    Per person: something current, specific and unresolved, and a way it could come up
    tonight.
  low: Names with roles, or no people at all.
  line: >-
    A 4 gives most people a live, specific thread, and at least one is good for them. A 3
    has names with roles, or everyone is a source of humiliation.
  high: Every person is a story in progress, and two or three could interrupt tonight.

- id: profile.timeline
  family: profile
  batch: 3
  name: An ordinary spine
  priority: useful
  tells: Whether the history is a life course, mostly ordinary.
  method: >-
    Check for where they grew up, school, first job, leaving home, the longest relationship
    and the recent year; count the humiliation entries.
  low: No timeline, or a chain of humiliations.
  line: >-
    A 4 has at least five of the six, with at most two humiliations. A 3 misses the spine or
    lets humiliations dominate.
  high: All six, each specific, and the recent year leads into tonight.

- id: profile.act
  family: profile
  batch: 3
  name: The gap between the act and the life
  priority: useful
  tells: The claims against the truths, where the comedy and the reveals come from.
  method: >-
    Read each claim and its truth; judge whether the gap is specific, funny, and could leak
    out in a chat.
  low: No claims, or generic ones ("says confident, is insecure").
  line: >-
    A 4 has most pairs specific, with each truth able to leak in text. A 3 has generic pairs.
  high: Every pair is a joke waiting to happen and a reveal the chat can find.

- id: profile.logic
  family: profile
  batch: 3
  proposed: true
  name: The act holds from the inside
  priority: core
  tells: >-
    The brief's "play it straight": a reasonable person following their way of coping one step
    too far, and then one more. Unhinged, but never random.
  method: >-
    State their coping strategy as a rule they would defend, and check the profile lets you
    predict what they do when caught out: explain, and dig deeper.
  low: Quirks without a logic; they do odd things for no reason they could give.
  line: >-
    A 4 lets you write the rule they live by in one sentence they would agree with, and predict
    their next move when it fails. A 3 has a habit but no inner logic, or a logic that only an
    outsider would state.
  high: The rule is sympathetic, the escalation is inevitable, and each step makes sense to them.

- id: profile.creed
  family: profile
  batch: 3
  proposed: true
  name: A belief from app culture, held in earnest
  priority: core
  tells: >-
    The brief's "the satire comes out of their mouths": a piece of what the apps and dating
    culture taught them (standards, red flags, high value, "communication is key") that they
    use straight to justify being afraid.
  method: Name the belief, and check the profile gives evidence that contradicts it.
  low: No belief, or one held ironically.
  line: >-
    A 4 names one specific dating-culture belief they use in earnest, with evidence in the
    profile that contradicts it. A 3 has a vague belief, or no contradicting evidence.
  high: The belief is recognisable from real apps, and every defence they have quotes it.

- id: profile.specific
  family: profile
  batch: 3
  name: Specific detail that does work
  priority: useful
  tells: Concrete names, sums, streets, brands and times, and whether they tell you something.
  method: Judge the density of concrete detail and what each detail says about class, money and taste.
  low: Generic throughout.
  line: >-
    A 4 has concrete detail in most paragraphs, and the details tell you about the person.
    A 3 is concrete in places, or uses detail as decoration.
  high: Every paragraph has detail that characterises.

- id: profile.stock
  family: profile
  batch: 4
  name: Free of stock material
  priority: useful
  tells: Dating-app clichés, recycled comedy shapes, motifs repeated across the cast.
  method: Flag tropes and anything repeated from another profile. Higher means less stock.
  low: Built from stock.
  line: A 4 has at most one stock element, and not a central one. A 3 has several, or a central one.
  high: Nothing you have read before.

- id: profile.plausible
  family: profile
  batch: 4
  name: Plausible
  priority: diagnostic
  tells: London rent against job and wage, geography, ages, durations.
  method: Name anything implausible.
  low: Several implausibilities that are not jokes.
  line: >-
    A 4 has nothing implausible, or a stretch played as a joke. A 3 has an unintended
    implausibility a London reader would catch.
  high: Every number and place checks out.

- id: profile.filth
  family: profile
  batch: 4
  name: Filth grounded in the body and the life
  priority: useful
  tells: Whether the sexual material is theirs rather than generic.
  method: Label each sexual detail as coming from their body, drawer or history, or generic.
  low: Generic, or absent.
  line: A 4 takes most sexual material from their own body, drawer or history. A 3 is mostly generic.
  high: All of it could only be them, and it is funny.

- id: profile.humanity
  family: profile
  batch: 4
  name: Satire aimed at behaviour
  priority: useful
  tells: The jokes target what they do; the person keeps some dignity.
  method: Judge where the contempt points.
  low: The character is the butt of everything, with nothing held back.
  line: >-
    A 4 aims the jokes at behaviour and keeps the person's dignity somewhere. A 3 makes the
    person the joke.
  high: Merciless about the behaviour and fond of the person.

- id: profile.efficiency
  family: profile
  batch: 4
  name: Earns its length
  priority: diagnostic
  tells: Useful facts per word, whether a director can find what they need.
  method: Judge padding, repetition and summary.
  low: Mostly padding.
  line: A 4 has little padding; most sentences give a fact or a behaviour. A 3 has noticeable padding.
  high: No sentence could go.

# ── the plan ──────────────────────────────────────────────────────────────────

- id: plan.grounded
  family: plan
  batch: 1
  name: Grounded in the characters
  priority: core
  tells: Whether the plan uses who they are, or invents a new story over them.
  method: >-
    List what the plan says about each character and map each to the brief or mark it
    invented; judge the share grounded and whether the inventions fit.
  low: Mostly invented; the characters' material is barely used.
  line: >-
    A 4 takes most of what it says about each character from the brief, and its inventions
    extend that material rather than replace it. A 3 invents a large share, or leaves core
    material unused.
  high: Everything traces to the brief, and the plan finds things in it a reader would miss.

- id: plan.contradictions
  family: plan
  batch: 1
  name: Free of contradictions with the characters
  priority: core
  tells: Plan facts that break the brief.
  method: List contradictions with the brief. Higher means fewer.
  low: Several, or one that changes who someone is.
  line: A 4 has none. A 3 has one clear contradiction.
  high: None, and the plan corrects for traps in the brief.

- id: plan.evaluation
  family: plan
  batch: 1
  name: The evaluation fits together
  priority: core
  tells: >-
    Each character has needs, tests and give-aways that mesh: each test probes its owner's
    need, each give-away answers the other's need.
  method: Build the matrix of needs, tests and give-aways for both and count the orphans.
  low: No evaluation logic at all (one-sided seduction, or a sequence of jokes).
  line: >-
    A 4 gives both characters explicit needs and at least one test each that probes them,
    and the other has something that can answer it, with few orphans. A 3 has one side
    missing or mostly orphans.
  high: Every test and give-away connects, and the good and bad reasons fall out of the matrix.

- id: plan.pair
  family: plan
  batch: 1
  name: Specific to this pair
  priority: core
  tells: Whether this is their night or any two people's.
  method: Could the reasons, events and endings be moved to another pair unchanged?
  low: Generic attraction and farce.
  line: >-
    A 4 has reasons and most events that depend on these two people's particulars. A 3 has
    generic attraction logic.
  high: Nothing in it would survive a change of either character.

- id: plan.knowledge
  family: plan
  batch: 1
  name: Respects what each can know
  priority: core
  tells: >-
    Nobody is planned to know or mention what they can't, like the private job leaking in the
    v22 first look.
  method: >-
    For each beat, ask what each character needs to know, and whether it is on the public
    profile, said earlier, or private. Higher means fewer problems.
  low: Several beats depend on private knowledge.
  line: >-
    A 4 has no beat needing private knowledge, or routes explicitly how it comes out. A 3 has
    at least one beat that depends on something unshared.
  high: The plan tracks who knows what, and uses the gaps.

- id: plan.collision
  family: plan
  batch: 1
  proposed: true
  name: Each defence lands on the other's sore spot
  priority: core
  tells: >-
    The brief's two endings both depend on it: each one's habit confirms exactly what the other
    is afraid of. That is what makes it these two, and the fall-apart inevitable.
  method: >-
    For each direction, A on B and B on A, find the planned moment where one's defence presses on
    the other's fear, and check it is concrete and comes from both profiles.
  low: The two defences never touch.
  line: >-
    A 4 plans both directions with a concrete moment each, built from both profiles. A 3 has one
    direction, or a collision that is only described.
  high: Both directions, escalating, and the ending turns on them.

- id: plan.causal
  family: plan
  batch: 1
  name: The beats follow from each other
  priority: core
  tells: A story, not a list.
  method: Label each transition between beats as "therefore/but" or "and then".
  low: A list of scenes.
  line: A 4 has most transitions causal. A 3 is mostly "and then".
  high: Every beat is caused by the one before.

- id: plan.guard
  family: plan
  batch: 1
  name: A moment where the guard comes down
  priority: core
  tells: The turning point the chats are meant to reach.
  method: Check that it exists, has a trigger, and shows in how they type before they say it.
  low: No such moment.
  line: A 4 has all three. A 3 lacks one.
  high: Exactly placed, triggered by tonight's events, and shown entirely in the typing.

- id: plan.heat
  family: plan
  batch: 1
  name: Heat climbs
  priority: core
  tells: >-
    Explicitness and logistics are earned. Full sexual detail or a meeting plan before the
    midpoint fails (the v22 turn-2 rush).
  method: Map heat to beats; flag full disclosure or logistics before the midpoint.
  low: Starts at full heat.
  line: >-
    A 4 escalates in steps tied to trust, with nothing fully explicit or logistical before
    the midpoint. A 3 front-loads.
  high: Each step of heat is a consequence of something said.

- id: plan.spread
  family: plan
  batch: 1
  name: Big moments are spread out
  priority: useful
  tells: Reveals, accidents and snaps are not front-loaded.
  method: Read where the reveals and accidents sit in the beat list, and the gaps between them.
  low: Everything happens early.
  line: A 4 distributes them across the game, with nothing crowding the opening. A 3 clusters them.
  high: Rhythm you could chart, with a reveal held back for late.

- id: plan.events
  family: plan
  batch: 2
  name: Tonight's events come from their lives
  priority: useful
  tells: Whether the outside world presses in, from their own people and places.
  method: Per event, check it is grounded in the brief and presses on its owner's fear.
  low: No events, or generic interruptions.
  line: >-
    A 4 has most events coming from named people or places in the brief and pressing on a
    fear. A 3 has generic events.
  high: Every event is personal and lands on the worst moment.

- id: plan.setups
  family: plan
  batch: 2
  name: Setups planted and paid
  priority: useful
  tells: Things introduced early come back.
  method: Check each setup for plant, return and payoff, and whether endings pay them differently.
  low: No setups.
  line: A 4 gives each setup a plant and a payoff. A 3 has setups without payoffs.
  high: Every setup pays, and each ending pays them differently.

- id: plan.endings
  family: plan
  batch: 2
  name: Distinct endings
  priority: useful
  tells: Whether the possible outcomes are different stories.
  method: >-
    Summarise each ending in a line and judge whether they differ in story, not just the last
    line. If the plan has one ending, judge whether it handles the other outcomes.
  low: One ending, or interchangeable ones.
  line: A 4 has endings that are different stories. A 3 has the same scene with different last lines.
  high: Each ending is the best version of its outcome for this pair.

- id: plan.short_game
  family: plan
  batch: 2
  name: Survives a short game
  priority: useful
  tells: Whether a six-turn game still gets the midpoint and an ending.
  method: Check for a provision for a short game and whether it keeps the turning point.
  low: No provision.
  line: A 4 says what survives a short game, and the turning point does. A 3 has no provision.
  high: The short version is a complete story of its own.

- id: plan.accidents
  family: plan
  batch: 2
  name: Accidents are concrete
  priority: useful
  tells: The misfires the dice will cause are specified as exact on-screen artefacts.
  method: Check each planned accident for exact wording or an exact artefact.
  low: None, or vague ("something embarrassing").
  line: A 4 specifies most accidents concretely enough to write. A 3 is vague.
  high: Every accident is written down and fits the medium.

- id: plan.medium
  family: plan
  batch: 2
  name: Possible over text
  priority: useful
  tells: Everything can reach the other person through the chat.
  method: Flag beats that need shared space, sight or sound, unless sent as a photo or voice note.
  low: Several beats need a shared room.
  line: A 4 has every beat possible in a chat. A 3 has beats a chat cannot carry.
  high: The plan uses the medium itself (timing, typos, photos).

- id: plan.voices
  family: plan
  batch: 2
  name: Two separable voices
  priority: useful
  tells: The two voice specs could not be confused.
  method: Compare the voice specs on observable features.
  low: No voice specs, or the same voice.
  line: >-
    A 4 has voices differing on observable features (length, punctuation, vocabulary, what
    they reach for). A 3 differs only in adjectives.
  high: You could attribute a single message with no names.

- id: plan.original
  family: plan
  batch: 2
  name: Not the default plot
  priority: diagnostic
  tells: Whether it surprises.
  method: Judge whether the story goes anywhere "two mismatched people flirt" would not predict.
  low: The default farce.
  line: A 4 has at least one turn you would not predict. A 3 is the default.
  high: Surprising and inevitable at once.

- id: plan.format
  family: plan
  batch: 2
  name: Format
  priority: diagnostic
  tells: The plan follows the structure it was asked for.
  method: Check the sections and limits the brief asks for, and that it writes no chat itself.
  low: Ignores the structure.
  line: A 4 follows the structure and writes no chat lines. A 3 misses sections or writes the chat.
  high: Exactly as asked.

- id: plan.seeds
  family: plan
  scope: set
  name: Variety across seeds
  priority: useful
  tells: The same pair on different seeds gets different stories.
  method: Compare events and beats across three to five seeds of the same version.
  low: The same story.
  line: A 4 shares no event across seeds. A 3 repeats events or the turning point.
  high: Different stories with the same characters recognisable.

# ── the chat ──────────────────────────────────────────────────────────────────
#
# v24: rewritten against Pinder's brief and what the writers and comedians on the panel say about
# their own craft. The brief's own pass/fail test comes first; laughs are scored by what they give
# away, not counted; explicitness never lowers a score; the pipeline's health checks (plan, dice,
# knowledge) apply only to chats the game played, and are not part of the quality score. `source`
# names whose rule a dimension states. `needs`: the dimension is skipped, not scored 1, when the
# chat has no such material (a writer's chat has no plan and no dice).

- id: chat.test
  family: chat
  batch: 1
  name: The brief's test
  priority: core
  source: Pinder's brief, "What the reader should feel"
  tells: >-
    The brief's own pass/fail question: by the end, a reader of the chat alone knows each of the
    two from the inside.
  method: >-
    A reader who sees only the chat answers the brief's four questions for each character; the
    judge compares the answers with what the chat was written from (the cards or the profiles)
    and with the chat itself.
  probe:
    sees: [chat]
    ask: >-
      From the chat alone, answer for each of the two: what are they afraid of; what do they do
      so they don't have to feel it; where does that come from; and what did they do at the end?
      Quote the lines you rely on. Write "not in the chat" where it does not say.
  low: The reader can say how each one behaves, not why.
  line: >-
    A 4 has the reader right on at least three of the four for each character, with the fear and
    the habit that covers it linked. A 3 gets the habit but not the fear, or the fear only because
    someone states it.
  high: >-
    All four for both, and what each one did at the end follows from their fear; the reader could
    explain both people to a friend.

- id: chat.sideways
  family: chat
  batch: 1
  name: Found out sideways
  priority: core
  source: Pinder's brief, "Affection comes from finding out why"
  tells: Facts and causes come out by slip, inference or being caught, not by statement.
  method: >-
    Label each important disclosure as asked, volunteered, slipped, inferred or caught out. The
    origin of each one's habit counts double.
  low: Everything is stated.
  line: >-
    A 4 has most important facts, and the origin of at least one habit, coming out by slip,
    inference or being caught. A 3 states most of them.
  high: Nothing important is said outright.

- id: chat.subtext
  family: chat
  batch: 1
  name: Says less than it means
  priority: core
  source: >-
    Harold Pinter, "Writing for the Theatre" (1962): speech as a way of covering what is
    underneath; the brief's "characters explaining their feelings" and "therapy-speak"
  tells: The feelings are in what they avoid saying, not in what they say.
  method: >-
    Count the messages that name a feeling outright or explain one ("I think I'm scared of",
    "I realise I", "that's my trauma", therapy-speak), and mark the places where the reader can
    name what a message is avoiding.
  low: They tell each other how they feel.
  line: >-
    A 4 names a feeling outright at most once, and has at least three places where what a message
    is avoiding is legible. A 3 explains feelings more than once, or has nothing underneath.
  high: Nobody names a feeling, and the reader always knows what is being avoided.

- id: chat.plainest
  family: chat
  batch: 1
  name: The plainest line
  priority: core
  source: >-
    Pinder's brief, "Tenderness comes from understatement"; replaces "The guard comes down" and
    "One moment you believe", which asked for the same moment twice
  tells: The moment one of them puts the act down, and how it is written.
  method: >-
    A reader finds the moment; the judge checks that it is there, that it is one of the shortest
    and plainest lines in the chat, and that it does not name the feeling.
  probe:
    sees: [chat]
    ask: >-
      Where, if anywhere, did one of them stop performing for the other? Quote the line, and say
      how you could tell.
  low: No such moment, or it is announced.
  line: >-
    A 4 has the reader find a moment where one of them puts the act down, carried by a short,
    plain line that does not name the feeling. A 3 has it missed, stated, or delivered as a speech.
  high: >-
    It is the shortest, plainest line in the chat, the reader feels it, and the other one's answer
    changes the night.

- id: chat.voices
  family: chat
  batch: 2
  name: Two voices you can tell apart
  priority: core
  source: Pinder's brief, "How they write"
  tells: You know who is talking without the names.
  method: A reader attributes the messages with the names hidden; the judge checks against the real speakers.
  probe:
    sees: [brief, chat_masked]
    ask: >-
      The speakers' names are hidden. Using the two characters described, say who sent each
      numbered message, with a few words of reason each.
  low: The reader guesses.
  line: >-
    A 4 has the reader right on at least 85% of messages, for reasons of voice rather than
    content. A 3 is below that, or right only by content.
  high: Every message attributed, by voice alone.

- id: chat.gap
  family: chat
  batch: 2
  name: The claim and the evidence
  priority: core
  source: Pinder's brief, "Laughter comes from the gap" and "Play it straight"
  tells: The laughs come from a claim and the evidence against it, both on screen, that the speaker does not see.
  method: >-
    List each moment where a character claims something and the chat shows the opposite, and
    mark whether the speaker notices or comments on it.
  low: No gaps; or the characters point out their own.
  line: >-
    A 4 has at least three such gaps, at least one for each character, and the speaker never sees
    their own. A 3 has fewer, or a character winks at the gap.
  high: Each character's act is one long gap the reader watches widen.

- id: chat.wit
  family: chat
  batch: 2
  name: Wit, not wisecracks
  priority: core
  source: >-
    Dorothy Parker, Paris Review (1956): wit has truth in it, wisecracking is calisthenics with
    words; replaces "Lines land", which counted laughs
  tells: Whether the funny lines give the sender away.
  method: >-
    Mark each line meant to be funny. Label it wit if it reveals something about the person who
    sent it, a wisecrack if either character could have sent it. Day-job, data, spreadsheet or
    audit jokes count as wisecracks: the brief rules them out by name.
  low: Quips that fill turns.
  line: >-
    A 4 has most funny lines giving the sender away, and at most two day-job, data or spreadsheet
    jokes. A 3 is mostly wisecracks.
  high: Every laugh is about who the sender is, and the best ones cost them something.

- id: chat.commitment
  family: chat
  batch: 2
  name: Caught out, nobody concedes
  priority: core
  source: >-
    Pinder's brief, "The unhinged comes from commitment"; Larry David's rule for Seinfeld, no
    hugging, no learning
  tells: Caught, they explain, and the explanation is worse; nobody learns a lesson.
  method: >-
    Find each moment a character is caught out, and label the answer: concedes, deflects, or
    explains and digs deeper. Flag any stated lesson, apology for being themselves or change of heart.
  low: They concede at the first hit, or learn a lesson.
  line: >-
    A 4 has most catches answered by an explanation that makes it worse, no concession at the
    first hit, and no stated lesson. A 3 concedes early or ends in a lesson.
  high: Every catch digs deeper, and the deepest hole is where the truth comes out.

- id: chat.status
  family: chat
  batch: 2
  name: Status moves
  priority: useful
  source: >-
    Pinder's brief, "Status flips are funny"; Jesse Armstrong and Sam Bain's Peep Show and
    Succession, which run on who is up and who is down
  tells: Who is chasing and who is on top changes during the night.
  method: >-
    Exchange by exchange, say who is chasing and who has the upper hand; count the flips.
  low: One of them is on top throughout.
  line: >-
    A 4 has at least two flips, and each character spends a stretch on top and a stretch below.
    A 3 keeps one of them on top throughout, or flips once.
  high: The flips are the plot, and the last one is the ending.

- id: chat.timing
  family: chat
  batch: 2
  name: Timing in the message breaks
  priority: useful
  source: >-
    Pinder's brief, "Timing is in the message breaks"; Jimmy Carr and Lucy Greeves, The Naked Jape
    (2006): a joke is a surprise, so the word that delivers it comes last
  tells: Whether the jokes are timed by the medium.
  method: >-
    For each laugh line, check that the word that delivers it is the last word of its message and
    that the punchline sits in its own message after the setup. Mark one-word reaction shots after
    long messages, and runs of messages at the same temperature.
  low: Punchlines buried mid-message.
  line: >-
    A 4 has most punchlines last, in their own message, and hot follows cold. A 3 buries most of
    them or runs one temperature.
  high: You could hear the pauses.

- id: chat.escalation
  family: chat
  batch: 3
  name: It escalates or it changes
  priority: core
  source: >-
    George Saunders, A Swim in a Pond in the Rain (2021): every passage has to raise the stakes or
    turn; replaces "Pacing" and "You'd keep reading"
  tells: Whether the night keeps moving, and whether the reader can see what comes next.
  method: >-
    A reader reads message by message and says where they would stop and where they could predict
    the next beat. The judge finds the longest stretch where nothing changes (stakes, status,
    information or temperature) and checks whether the night is settled early: a time and a place
    agreed in the first quarter settles it. Explicit sex does not count against escalation; on
    Pinder bodies are small talk.
  probe:
    sees: [chat]
    ask: >-
      Read the chat message by message. Where would you have stopped reading if you were not asked
      to finish, and why? At which points could you predict exactly what would happen next? Say
      "never" if neither.
  low: Settled in the opening, or flat for most of it.
  line: >-
    A 4 has no stretch of more than about ten messages where nothing changes, keeps the reader to
    the end, and is not settled in the first quarter. A 3 has a flat stretch, a predictable run,
    or the night decided early.
  high: Every exchange raises the stakes or turns, and the reader cannot call the next beat.

- id: chat.filth
  family: chat
  batch: 3
  name: Filth that gives them away
  priority: useful
  source: >-
    Pinder's brief, "How they write": filthy and specific, bravado at the start and how they get
    close by the end; Ali Wong's material, which works because it is unflattering to her
  tells: Whether the sex talk is about these two people.
  method: >-
    Label each sexual line as specific to this body and life or generic, and as bravado or
    closeness. How explicit a line is never lowers the score.
  low: Generic filth.
  line: >-
    A 4 has most sexual lines specific to this person, and at least one late in the chat used to
    get close rather than to perform. A 3 is generic, or the filth never changes job.
  high: The dirtiest line is the one that tells you most about them.

- id: chat.wince
  family: chat
  batch: 3
  name: You see it coming
  priority: useful
  source: Pinder's brief, "The wince comes from seeing it coming"
  tells: The reader sees a habit about to land on the wrong spot and cannot stop it.
  method: >-
    Find the moments where the reader knows something one character does not, and the danger is
    visible at least one exchange before it goes off. Check that it then goes off.
  low: Nothing is seen coming.
  line: >-
    A 4 has at least one danger visible before it goes off, and it goes off on exactly the wrong
    spot. A 3 has none, or the danger is announced as it lands.
  high: The reader is wincing a message early, more than once.

- id: chat.creed
  family: chat
  batch: 3
  name: The app talks through them
  priority: useful
  source: >-
    Pinder's brief, "The satire comes out of their mouths"; Joel Kim Booster's Fire Island, about
    who gets picked
  tells: Each one believes something dating culture taught them, says it straight, and the screen contradicts it.
  method: >-
    List the beliefs from apps and dating culture each one voices (standards, red flags, high
    value, efficiency, "not looking for anything serious", leagues) and whether the evidence on
    screen contradicts them.
  low: Nobody believes anything from the app.
  line: >-
    A 4 has each character voice at least one such belief in earnest, contradicted on screen. A 3
    has one character, or the belief is mocked by the speaker.
  high: The two creeds collide, and the farce is about all of us.

- id: chat.humanity
  family: chat
  batch: 3
  name: The joke is on them, not on the other
  priority: useful
  source: >-
    Pinder's brief, "never cynical about the people" and "Nobody is the villain"; Amy Schumer's
    material, where the speaker is the first target
  tells: Where the contempt points.
  method: >-
    For each character's sharpest jokes, say who they land on: themselves, the culture they
    believe in, or the other person. Say whether either ends up the villain or the punchline.
  low: One of them is the joke.
  line: >-
    A 4 has each character's sharpest jokes land on themselves or the culture at least as often as
    on the other, and neither ends as the villain. A 3 makes one of them the joke or the villain.
  high: Merciless and fond at once.

- id: chat.callbacks
  family: chat
  batch: 4
  name: A payoff the reader puts together
  priority: useful
  source: Pinder's brief, "A payoff is the reader putting it together"
  tells: A throwaway that turns out to mean something else, unexplained.
  method: >-
    A reader lists what came back; the judge checks each return: did it look like a throwaway at
    first, come back once in the middle, mean something else at the end, and go unexplained?
  probe:
    sees: [chat]
    ask: List the things that come back later in the chat, and for each, whether it means something different when it comes back.
  low: Nothing returns, or a joke is repeated.
  line: >-
    A 4 has at least one setup that looked like a throwaway, came back in the middle, and means
    something else at the end, with nobody explaining it. A 3 repeats jokes, or a character
    explains the payoff.
  high: The last payoff closes the night, and nobody says a word about it.

- id: chat.ending
  family: chat
  batch: 4
  name: The ending is earned
  priority: useful
  source: Pinder's brief, "The cynical laugh comes from inevitability"
  tells: The outcome follows from the two habits, whichever way it goes.
  method: A reader predicts the ending before the last part; the judge compares with the real one.
  probe:
    sees: [chat_but_last]
    ask: Before reading the end, how do you think this ends, and why?
  low: The ending comes from nowhere, or a date that leaves the reader cold.
  line: >-
    A 4 has the reader's prediction matching the real outcome in kind, and the end follows from
    each one's habit. A 3 arrives from nowhere, or ends warm without being earned.
  high: Inevitable in hindsight, surprising in the moment.

- id: chat.listening
  family: chat
  batch: 4
  name: They listen
  priority: useful
  tells: Each message answers the one before.
  method: Count offers and questions left unanswered or not pointedly ignored.
  low: Two monologues.
  line: >-
    A 4 has nearly every message responding to the last, with offers taken up or pointedly
    ignored. A 3 leaves several unanswered.
  high: Every message is a reaction, and ignoring is a choice.

- id: chat.situational
  family: chat
  batch: 4
  name: The voice changes with the situation
  priority: useful
  tells: Typing changes when they are hurt, horny, late, or have their guard down.
  method: Find the moments the situation changes and check whether the typing changes with it.
  low: One register throughout.
  line: A 4 shows the typing change at most situation changes. A 3 keeps one register.
  high: You could read the night's feelings from the message shapes alone.

- id: chat.medium
  family: chat
  batch: 4
  name: Typed, not written
  priority: core
  source: >-
    Elmore Leonard, "Easy on the Adverbs, Exclamation Points and Especially Hooptedoodle" (2001):
    if it sounds like writing, rewrite it; Pinder's brief, "The medium"
  tells: Whether every message is something a person would type into a dating app.
  method: >-
    Flag messages nobody would type with a thumb at 1am: composed sentences, stacked clauses,
    essays, narration, stage directions, shared-space moments. A long message counts once, as the
    event the brief allows when someone finally tells something.
  low: Prose, not messages.
  line: >-
    A 4 reads like messages: a line or two each, the rare long one an event, no narration. A 3
    has composed sentences or long messages as the norm.
  high: You could screenshot it.

- id: chat.fresh
  family: chat
  batch: 4
  name: Fresh within the chat
  priority: diagnostic
  tells: Tics, openers and joke shapes do not repeat inside the chat.
  method: Find repeated tics, openers and joke shapes. Higher means fewer.
  low: The same joke all night.
  line: A 4 repeats nothing more than twice. A 3 has noticeable tics.
  high: Nothing repeats.

- id: chat.leaks
  family: chat
  batch: 5
  needs: [plan]
  name: No knowledge leaks
  priority: diagnostic
  tells: Pipeline health. Nobody mentions what they cannot know.
  method: >-
    Track what each could know (their own life, the other's public profile and photos, what has
    been said) and flag references beyond it. Higher means fewer leaks.
  low: Several leaks.
  line: A 4 has none. A 3 has one a reader would notice.
  high: None, and the characters use what they don't know.

- id: chat.plan
  family: chat
  batch: 5
  needs: [plan]
  name: Plays the plan
  priority: diagnostic
  tells: Pipeline health. The plan's beats, events and setups appear, adapted to the dice.
  method: Check the plan's beats against the chat.
  low: The plan is unused.
  line: A 4 has most beats and events present. A 3 leaves the plan largely unused.
  high: Every beat present, adapted to the dice rather than forced.

- id: chat.dice
  family: chat
  batch: 5
  needs: [dice]
  name: The dice show
  priority: diagnostic
  tells: Pipeline health. Successes land and misses misfire on screen.
  method: Match each turn's text to its roll.
  low: The dice are invisible.
  line: A 4 makes most successes and misses visible in the text. A 3 hides them.
  high: Every roll visible, and the misses are the funniest turns.

- id: chat.improvisation
  family: chat
  batch: 5
  needs: [improvisations]
  name: Plays the improvisations
  priority: core
  source: >-
    Runs 12 on: the chat is written to instructions, and the other dimensions set aside what an
    instruction required. This one scores what the writer made of each instruction, so nothing is
    excused here: excused is always [].
  tells: >-
    Each instruction happens on screen, as the characters, and is funny: the successes land, the
    misses go wrong the way the instruction says, each trap is played for its length and then
    stops, and the other's replies move the way their interest does.
  method: >-
    Go through IMPROVISATIONS one by one and check what was written against what was asked: the
    approach, how well it comes off, the way a miss goes wrong, a trap's behaviour while it lasts
    (the Spiral narrating the chat, Overthinking explaining itself, and the rest), and the reply's warmth against
    the interest change. Note every instruction that is missing, flattened or played as a label
    (a character saying how interested they are, naming the trap, explaining the miss).
  low: >-
    The instructions are ignored, or carried out as labels: the trap is named instead of played,
    and replies announce their interest.
  line: >-
    A 4 plays most instructions so a reader could tell what happened, plays every trap for its
    length, and lets no instruction show through as a label. A 3 misses or flattens several, or
    lets the mechanics show (a reply that says how interested it is, a trap named).
  high: Every instruction is visible in what they type, and the misses and traps are among the funniest moments.

- id: chat.variety
  family: chat
  scope: set
  name: One night, not a template
  priority: core
  source: >-
    The writers' runs: fourteen writers wrote one scene. A chat scored on its own cannot see that
    it is a copy.
  tells: Different writers or seeds with the same pair produce different nights.
  method: >-
    For each chat in the set, write down the opening move, who is on top in the first exchanges,
    the first thing found out, the turning point and the ending; then count how many chats share
    each, and list lines and jokes that recur across chats.
  low: The same scene in every chat.
  line: >-
    A 4 has no opening move or sequence of three beats shared by more than half the chats, and no
    line recurring across more than two. A 3 has most chats sharing the opening and its order.
  high: Every chat is its own night, and the two characters are still recognisable in all of them.
