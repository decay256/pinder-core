# The scorecard's current focus (v24, tone-lab-scratch): which dimensions decide the experiment.
#
# The experiment: writers write Reuben and Brick from Pinder's brief, then a chat between their own
# two, in one go (tools/tonelab/writers.py). The chats are scored on the rewritten chat scorecard,
# one by one and run by run as a set. Profiles and plans keep their earlier tiers for reference.
#
# tier: critical = decides the experiment and the gate; watch = scored and shown, not targeted;
# off = not scored in this experiment. Every entry says why. Quote "off": bare, YAML reads it as false.
# detail: kinds whose every result the focus page shows in full.
# disabled: kinds left off the focus page. runs_from: the first writers' run the focus page shows.

title: The writers' chats
mission: >-
  When the chat is over, someone who has read only the chat is asked, for each of the two: what
  are they afraid of, what do they do so they don't have to feel it, where does that come from,
  and what did they do at the end? If they can't answer, the chat failed, however good the lines
  were.
mission_source: Pinder's brief, "What the reader should feel"
experiment: >-
  Three comedians, Ali Wong, Joel Kim Booster and Jimmy Carr, each rewrite Pinder's brief in their own
  words, write a short take on both characters, and write the chat between them improvisation by
  improvisation on the game's seed 23, told before each one how it goes for the first character. The
  improvisations stay. Run 13 plays Reuben and Brick in the game's language (turns and rolls); run 14
  plays them as improvisation instructions without it. Runs 15 and 16 do the whole workflow for Zyx_444
  and Sable_xo, whom the comedians had not written: in one go (15, no instructions), then as
  improvisations (16). The judge reads each improvised chat with the instructions it was written to,
  says for every score whether the writing or the instruction decided it, and scores how well the
  instructions were played. Every chat is scored on the chat scorecard, and each run as a set. Runs 1
  to 12, and the profiles and plans, are off this page; the full explorer keeps them.
gate: Every critical dimension scores 4 or more on a chat, and the run's set scores 4 or more on variety.
disabled: [profile, plan]
detail: [chat]
runs_from: 13

# Reference columns: the best we have today on the same dimensions.
reference: [profile-reuben-v22, profile-reuben-v22-panel, profile-reuben-v24, profile-reuben-v24-panel,
            profile-brick-v22, profile-brick-v22-panel, profile-brick-v24, profile-brick-v24-panel,
            plan-20261119T004209Z-preview-reuben-brick-s23,
            plan-20261119T191519Z-live-reuben-brick-s23-first2]

tiers:
  # ── the profile ──
  profile.life:        {tier: critical, why: "The chat's job is finding someone out. With nothing to find, there is nothing to find out sideways."}
  profile.ordinary:    {tier: critical, why: "Your original complaint, and still at 3 to 4. The humiliations only land against an ordinary life."}
  profile.timeline:    {tier: critical, why: "Where the humiliation list hides: 2 to 3 on both v22 profiles, though the generator is told to allow two."}
  profile.wound:       {tier: critical, why: "The brief's test in a profile: fear, the habit that covers it, and where it comes from, linked."}
  profile.act:         {tier: critical, why: "Laughter comes from the gap between the claim and the evidence. No gap, no joke and no reveal."}
  profile.logic:       {tier: critical, why: "New, from the brief: play it straight. The act has to make sense from the inside, or the commitment that makes it unhinged has nothing to follow."}
  profile.creed:       {tier: critical, why: "New, from the brief: the satire comes out of their mouths. Without a belief from app culture, the farce is about one person, not all of us."}
  profile.likeable:    {tier: critical, why: "The guard-down moment and the affection the brief wants both need something real to like. Reuben scores 3."}
  profile.tests:       {tier: critical, why: "Each one is deciding whether the other is safe and fun, or the vibe. They need something to test for."}
  profile.voice:       {tier: critical, why: "The writer works from the profile alone. If it isn't enough to write them, nothing downstream is."}
  profile.consistent:  {tier: watch, why: "Matters, but a contradiction is cheap to catch and fix once the rest works."}
  profile.situations:  {tier: watch, why: "Already 5 on both v22 profiles; keep an eye on it, don't steer by it."}
  profile.people:      {tier: watch, why: "Feeds the plan's events, which are critical there; scored here so we can see the cause."}
  profile.specific:    {tier: watch, why: "Already 5; specific detail follows from a real life."}
  profile.filth:       {tier: watch, why: "Pinder is filthy, but the filth works only once the person does."}
  profile.humanity:    {tier: watch, why: "Already 5 on both; the brief's rule is never cynical about the people."}
  profile.stock:       {tier: watch, why: "With two characters, clichés matter more than overlap; watch them."}
  profile.plausible:   {tier: watch, why: "London facts and money; easy fixes once the rest is right."}
  profile.distinct:    {tier: "off", why: "There is no cast to differ from: we want one pair right first. Two different people is covered by the voice and the plan."}
  profile.texting_vs_cast: {tier: "off", why: "Same reason: with two characters, the voice dimension and the plan's two voices cover it."}
  profile.fidelity:    {tier: "off", why: "The experiment is untied from the game's character files, so there is no file to be faithful to."}
  profile.efficiency:  {tier: "off", why: "Diagnostic; length comes later."}
  # ── the plan ──
  plan.grounded:       {tier: critical, why: "The plan has to use who they are. Already 5; it stays critical because the new profiles change what there is to use."}
  plan.evaluation:     {tier: critical, why: "Safe and fun, or the vibe: needs, tests and give-aways that mesh. Stuck at 3 to 4 in every version."}
  plan.collision:      {tier: critical, why: "New, from the brief: both endings work because each one's defence lands on the other's sore spot. That is the pair, not two people."}
  plan.causal:         {tier: critical, why: "A story, not a list: 4 at best, 3 on the v22 first look."}
  plan.guard:          {tier: critical, why: "The moment the chats are meant to reach; 5 since v19, and it must stay there."}
  plan.heat:           {tier: critical, why: "3 in every plan since v19. The turn-2 rush starts in the plan."}
  plan.spread:         {tier: critical, why: "Reveals held back so finding out can happen across the night."}
  plan.events:         {tier: critical, why: "Tonight comes from their lives; 5 since v20, and it depends on the new profiles having lives."}
  plan.contradictions: {tier: watch, why: "3 to 4 lately; worth fixing, cheap to catch."}
  plan.knowledge:      {tier: watch, why: "Plans route knowledge well (5); the leak happens later, in the chat."}
  plan.setups:         {tier: watch, why: "Already 5."}
  plan.endings:        {tier: watch, why: "Already 4 to 5."}
  plan.short_game:     {tier: watch, why: "Solved since v19."}
  plan.medium:         {tier: watch, why: "Already 5."}
  plan.pair:           {tier: watch, why: "5 in almost every version, so its bar doesn't tell versions apart; it needs a stricter line before it can steer."}
  plan.accidents:      {tier: watch, why: "Same: 5 everywhere, bar too easy."}
  plan.voices:         {tier: watch, why: "Same: 5 everywhere, bar too easy."}
  plan.original:       {tier: "off", why: "Diagnostic; the default plot is a worry for later."}
  plan.format:         {tier: "off", why: "The plan's format changes with the experiment."}
  plan.seeds:          {tier: "off", why: "Needs several seeds of one version."}
  # ── the chat ──
  chat.test:        {tier: critical, why: "The brief's own pass/fail test, word for word. The old scorecard asked for a dossier (job, address) instead."}
  chat.subtext:     {tier: critical, why: "Pinter: the feeling is in what they avoid. The brief kills chats where characters explain their feelings."}
  chat.plainest:    {tier: critical, why: "The brief's understatement rule; merges two old dimensions that asked for the same moment twice."}
  chat.voices:      {tier: critical, why: "Two people you can tell apart without the names; the masked reader test is concrete."}
  chat.gap:         {tier: critical, why: "The brief's main source of laughs: the claim and the evidence on screen, unseen by the speaker. Nothing scored it before."}
  chat.wit:         {tier: critical, why: "Parker: a laugh counts only if it gives the sender away. The old dimension gave 5s to day-job jokes the brief bans."}
  chat.commitment:  {tier: critical, why: "Caught out, they dig deeper; no lesson. Nothing scored it before."}
  chat.escalation:  {tier: critical, why: "Saunders: every stretch raises the stakes or turns. Replaces pacing, which docked chats for explicit sex the brief asks for."}
  chat.medium:      {tier: critical, why: "Leonard: typed, not written. 3 on every played chat: the chats read like prose."}
  chat.improvisation: {tier: critical, why: "The improvisations stay, so a weak chat is either a weak instruction or a weak take on one. This scores the take; each score's cause says which."}
  chat.variety:     {tier: critical, why: "Fourteen writers wrote one scene; only a set can show it."}
  chat.sideways:    {tier: watch, why: "Already separates chats (3 to 4); keep it in view."}
  chat.status:      {tier: watch, why: "New: in every run 3 and run 4 opening Brick is on top and stays there."}
  chat.timing:      {tier: watch, why: "Carr's punch-word-last rule, countable; shows whether the lines are timed by the medium."}
  chat.filth:       {tier: watch, why: "Sharpened: the dirtiest line should give the speaker away. Explicitness never counts against it."}
  chat.wince:       {tier: watch, why: "The brief's wince; new."}
  chat.creed:       {tier: watch, why: "The satire through their mouths, scored on the profile before but never on the chat."}
  chat.humanity:    {tier: watch, why: "Sharpened from 5, 5, 5: whom the jokes land on, and no villain."}
  chat.callbacks:   {tier: watch, why: "Sharpened from 5, 5, 5: a throwaway that means something else at the end, unexplained."}
  chat.ending:      {tier: watch, why: "The reader's prediction test; inevitability is the brief's cynical laugh."}
  chat.listening:   {tier: watch, why: "Each message answers the last; cheap to keep."}
  chat.situational: {tier: watch, why: "The typing changes with the night."}
  chat.fresh:       {tier: watch, why: "Repetition inside one chat; the set's variety covers repetition across chats."}
  chat.leaks:       {tier: "off", why: "Pipeline health: needs a plan; the writers' chats have none."}
  chat.plan:        {tier: "off", why: "Pipeline health: the writers' chats have no plan."}
  chat.dice:        {tier: "off", why: "Pipeline health: the writers' chats have no dice."}
