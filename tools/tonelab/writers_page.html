<meta charset="utf-8">
<title>Writers' Pinder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a sticky picker (writer, then view) over one reading column; chats as a phone thread. */
:root {
  --bg: #f6f5f8; --surface: #ffffff; --line: #e2dfe8; --fg: #1d1a24; --muted: #6b6578;
  --accent: #a3245a; --accent-fg: #ffffff; --them: #ebe8f0; --them-fg: #1d1a24; --note: #8a8396;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131a; --surface: #1e1b25; --line: #322d3c; --fg: #ece9f2; --muted: #a39cb1;
  --accent: #d9518c; --accent-fg: #1a0b12; --them: #2b2734; --them-fg: #ece9f2; --note: #8f889c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15131a; --surface: #1e1b25; --line: #322d3c; --fg: #ece9f2; --muted: #a39cb1;
  --accent: #d9518c; --accent-fg: #1a0b12; --them: #2b2734; --them-fg: #ece9f2; --note: #8f889c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
h1 { font: 700 1.25rem/1.2 var(--display); margin: 0; text-wrap: balance; }
h1 small { font: 400 .8rem var(--body); color: var(--muted); margin-left: .4em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
.row::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 500 .88rem var(--body); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
#runs .chip { border-radius: 6px; font-size: .8rem; padding: 4px 10px; }
#runs .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; border-top: 1px solid var(--line); padding-top: 8px; }
.tab { white-space: nowrap; background: none; border: 0; padding: 2px 0 6px; font: 600 .9rem var(--body); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab span { font: 400 .75rem var(--mono); color: var(--muted); margin-left: 4px; }
main .wrap { padding-block: 20px 64px; }
.meta { color: var(--muted); font-size: .85rem; margin: 0 0 18px; }
/* chat */
.thread { display: flex; flex-direction: column; gap: 3px; }
.who { font: 600 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 2px; }
.who.me { align-self: flex-end; }
.b { max-width: 82%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.b.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.b.them { align-self: flex-start; background: var(--them); color: var(--them-fg); border-bottom-left-radius: 6px; }
.note { align-self: center; text-align: center; color: var(--note); font-size: .82rem; font-style: italic; margin: 10px 8%; white-space: pre-wrap; }
/* profile */
.doc { min-width: 0; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--display); line-height: 1.25; text-wrap: balance; margin: 1.6em 0 .5em; }
.doc h1 { font-size: 1.5rem; } .doc h2 { font-size: 1.2rem; } .doc h3 { font-size: 1.05rem; } .doc h4 { font-size: 1rem; }
.doc > :first-child { margin-top: 0; }
.doc p, .doc li { max-width: 68ch; }
.doc blockquote { margin: 1em 0; padding: 2px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc code { font: .85em var(--mono); background: var(--them); padding: 1px 4px; border-radius: 4px; }
.doc pre { overflow-x: auto; background: var(--them); padding: 12px; border-radius: 8px; }
.doc table { border-collapse: collapse; display: block; overflow-x: auto; }
.doc td, .doc th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
pre.prompt { white-space: pre-wrap; overflow-wrap: anywhere; font: .8rem/1.5 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
details { margin: 0 0 14px; }
/* how it was made: one card per session, in the order the writer read it */
.flow { margin: 0 0 22px; padding-left: 1.2em; }
.flow li { margin: 0 0 4px; max-width: 68ch; }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px 16px 4px; margin: 0 0 18px; }
.step h2 { font: 700 1.1rem/1.25 var(--display); margin: 0 0 4px; text-wrap: balance; }
.step h2 small { font: 400 .8rem var(--body); color: var(--muted); margin-left: .4em; }
.role { font: 600 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 16px 0 6px; }
.step .doc { font-size: .95rem; }
.step .doc h1 { font-size: 1.2rem; } .step .doc h2 { font-size: 1.05rem; } .step .doc h3 { font-size: .98rem; }
details.insert { border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; padding: 8px 12px; margin: 12px 0; }
details.insert summary { font: 600 .88rem var(--body); }
details.insert[open] summary { margin-bottom: 8px; }
details.raw summary { font: 500 .82rem var(--body); color: var(--muted); }
.turn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px 4px; margin: 0 0 18px; }
.turn h2 { font: 700 1rem/1.25 var(--display); margin: 0 0 6px; }
.turn .game { font-size: .88rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 0 0 10px; }
/* the tone lab's balance: next to the player's name, once per improvisation */
.score { font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: .5em; padding: 1px 7px; border-radius: 999px; background: var(--them); color: var(--fg); }
.score.up { background: #d7efe0; color: #1d5c37; } .score.down { background: #f6dada; color: #7c1f1f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .score.up { background: #1d3a29; color: #9fe0b8; } :root:not([data-theme="light"]) .score.down { background: #3e2020; color: #f0a8a8; } }
:root[data-theme="dark"] .score.up { background: #1d3a29; color: #9fe0b8; } :root[data-theme="dark"] .score.down { background: #3e2020; color: #f0a8a8; }
.verdict { text-align: center; font: 600 .9rem var(--body); margin: 18px 0 0; }
.arrow { text-align: center; color: var(--muted); font-size: .85rem; margin: -8px 0 10px; }
summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .b, .note { animation: none; } }
</style>

<header>
  <div class="wrap">
    <h1><span id="pair">Reuben &amp; Brick</span> <small>one chat per writer</small></h1>
    <div class="row" id="runs" role="group" aria-label="Run"></div>
    <div class="row" id="writers" role="group" aria-label="Writer"></div>
    <div class="tabs" role="tablist" aria-label="What to read" id="tabs"></div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const D = __DATA__;
const VIEWS = [["chat", "Chat"], ["turns", "Turn by turn"], ["joke", "The joke"], ["characters", "The characters"], ["reuben", "Reuben"], ["brick", "Brick"], ["ownbrief", "Their brief"], ["how", "How it was made"]];
const viewsFor = w => VIEWS.filter(([v]) => v === "how" || w[v]);
const TAB = { reuben: "the Reuben tab", brick: "the Brick tab", characters: "The characters tab", ownbrief: "the Their brief tab" };
let st = { r: D.runs[0].id, w: D.runs[0].writers[0].id, v: "chat" };
const R = () => D.runs.find(x => x.id === st.r) || D.runs[0];

function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  for (const r of D.runs) for (const w of r.writers) for (const [v] of VIEWS)
    if (h === r.id + "-" + w.id + "-" + v) { st = { r: r.id, w: w.id, v }; return; }
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function words(s) { return (s.trim().match(/\S+/g) || []).length; }

const signed = n => n > 0 ? "+" + n : n < 0 ? "\u2212" + -n : "0";
const WHAT = { 1: "landed", 0: "did nothing", "-1": "backfired" };
function scoreHTML(t, i) {
  const p = t.points[i];
  return `<span class="score ${p > 0 ? "up" : p < 0 ? "down" : ""}">${WHAT[p]} ${signed(p)} \u00b7 balance ${signed(t.balance[i])}</span>`;
}
function verdictHTML(t) {
  const end = t.balance[t.balance.length - 1], date = end > 0;
  const game = (t.game === "DateSecured") === date ? "" : ` The game itself ended ${t.game}.`;
  return `<p class="verdict">Balance at the end: ${signed(end)}. ${date ? "Above 0: a date." : "0 or below: no date."}${game}</p>`;
}
// the chat improvisation by improvisation, with the player's result and balance next to their name each time
function tallyChatHTML(w, run) {
  const t = run.tally, st = { last: null }, out = [];
  w.turns.forEach((x, i) => {
    if (i >= t.points.length) return;
    const items = chatItems(x.lines.join("\n"), run, st, scoreHTML(t, i));
    out.push(...items);
  });
  return `<div class="thread">${out.join("")}</div>` + verdictHTML(t);
}
function chatHTML(text, run) {
  return `<div class="thread">${chatItems(text, run, { last: null }, null).join("")}</div>`;
}
function chatItems(text, run, st, badge) {
  const me = (run && run.player) || D.player, them = (run && run.match) || D.match;
  const re = new RegExp("^\\s*(?:\\*\\*)?(" + me + "|" + them + ")(?:\\*\\*)?\\s*:\\s*(?:\\*\\*)?\\s*(.*)$", "i");
  let out = [], last = st.last;
  for (const raw of text.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) continue;
    const m = line.match(re);
    if (m) {
      const who = m[1].toLowerCase() === me.toLowerCase() ? "me" : "them";
      if (who !== last || (badge && who === "me")) {
        out.push(`<div class="who ${who}">${esc(who === "me" ? me : them)}${badge && who === "me" ? badge : ""}</div>`);
        if (who === "me") badge = null;
      }
      out.push(`<div class="b ${who}">${esc(m[2].replace(/\*\*$/, ""))}</div>`);
      last = who;
    } else if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
      continue;
    } else {
      out.push(`<div class="note">${esc(line.replace(/^#+\s*/, "").replace(/^\*+|\*+$/g, ""))}</div>`);
      last = null;
    }
  }
  if (badge) out.unshift(`<div class="who me">${esc(me)}${badge}</div>`);  // the player sent nothing this time
  st.last = last;
  return out;
}
function docHTML(md) {
  try { return `<div class="doc">${marked.parse(md)}</div>`; }
  catch (e) { return `<pre class="prompt">${esc(md)}</pre>`; }
}

const fmt = n => n.toLocaleString("en-GB");
function segText(seg, w) {
  if (seg.t === "md") return seg.s;
  if (seg.t === "brief") return D.briefs[seg.id];
  if (seg.t === "ownbrief") return w.ownbrief;
  if (seg.t === "chars") return w.characters;
  return w[seg.who];
}
function segHTML(seg, w) {
  if (seg.t === "md") return docHTML(seg.s);
  if (seg.t === "brief") {
    const b = D.briefs[seg.id];
    return `<details class="insert"><summary>${R().template ? "Pinder's premise" : "The brief"} · ${fmt(words(b))} words</summary>${docHTML(b)}</details>`;
  }
  if (seg.t === "ownbrief")
    return `<details class="insert"><summary>Pinder's brief, as ${esc(w.name)} rewrote it in step 1 · ${fmt(words(w.ownbrief))} words</summary>${docHTML(w.ownbrief)}</details>`;
  if (seg.t === "chars")
    return `<details class="insert"><summary>The two characters, ${R().template ? "as " + esc(w.by) + " described them in run 11" : "as " + esc(w.name) + " wrote them in step 2"} · ${fmt(words(w.characters))} words</summary>${docHTML(w.characters)}</details>`;
  const n = D.names[seg.who];
  return `<details class="insert"><summary>${esc(n)}, as ${esc(w.name)} wrote ${D.pron[seg.who]} in step ${seg.who === "reuben" ? 1 : 2} ·${fmt(words(w[seg.who]))} words</summary>${docHTML(w[seg.who])}</details>`;
}
const FIRST_MODEL = "Gemini 4 Argon";
function howHTML(run, w) {
  const from = run.profiles_from ? ` in ${run.profiles_from}` : "";
  const flow = run.template ? `<ol class="flow">
    <li>In ${esc(run.profiles_from)}, ${esc(w.by)} rewrote Pinder's brief in their own words, then wrote both characters and how the two clash or click, in two sessions of their own on ${esc(FIRST_MODEL)}. Only the two character descriptions are used here: their brief and their take on the pair are left out.</li>
    <li>One session with ${esc(run.model)}, played improvisation by improvisation on seed ${esc(String(run.seed))}: a one-line system prompt, then the frozen template filled with Pinder's premise, ${esc(w.by)}'s two descriptions, the three acts, the theme and the method, and the game's account of improvisation 1. The session is resumed for each next improvisation: ${run.nturns} in all. Each account is put together from fixed pieces of text by what the dice did, and opens with the act it is in.</li>
  </ol>` : run.turns ? `<ol class="flow">
    <li>In ${esc(run.profiles_from || "run 11")}, ${esc(w.name)} rewrote Pinder's brief (the short one) in their own words, in a session of its own.</li>
    <li>In ${esc(run.profiles_from || "run 11")}, in a new session, they wrote a short take on both characters and how the two clash or click, from their own brief and the game's notes.</li>
    <li>A new session for the chat, played turn by turn on seed ${esc(String(run.seed))}: the same system prompt, their own brief and that text, then the game's account of turn 1. They answer with what ${esc(run.player || D.names.reuben)} sends and what ${esc(run.match || D.names.brick)} sends back, and the next turn's account comes in the same session: ${run.nturns} turns in all. Each account is put together from fixed pieces of text by what the dice did.</li>
  </ol>` : run.paired ? `<ol class="flow">
    <li>${esc(w.name)} rewrites Pinder's brief (the short one: what Pinder is and what the reader should feel) in their own words: a session of its own.</li>
    <li>A new session: the same system prompt, their own brief from step 1, and the game's notes on both characters. They write a short take on each and how the two clash or click.</li>
    <li>A new session for the chat: the same system prompt, their own brief, and what they wrote in step 2, pasted in as written. Nothing else from those sessions carries over.</li>
  </ol>` : `<ol class="flow">
    <li>${esc(w.name)} writes ${esc(D.names.reuben)}${from}: a session of its own, with the system prompt, then the brief, then the task and the game's fragments for him.</li>
    <li>${esc(w.name)} writes ${esc(D.names.brick)}${from}: another session of its own, the same way, at the same time.</li>
    <li>A new session for the chat: the same system prompt, the brief, and the two profiles from steps 1 and 2, pasted in as written. Nothing else from those sessions carries over.</li>
  </ol>`;
  const titles = { reuben: `Step 1 · ${D.names.reuben}`, brick: `Step 2 · ${D.names.brick}`, ownbrief: "Step 1 · Their brief", characters: "Step 2 · The characters", chat: w.steps.length === 1 ? "The chat" : "Step 3 · The chat" };
  const cards = w.steps.map((s, i) => {
    const raw = "<!-- system prompt -->\n" + s.system + "\n\n<!-- user message -->\n" + s.user.map(x => segText(x, w)).join("");
    const out = s.slug === "chat" && w.turns && run.template ? `${w.turns.length} improvisations in this session; the first is above, and every improvisation's account with what came back is on the Improvisations tab. The chat, ${fmt(words(w.chat))} words, is on the Chat tab` : s.slug === "chat" && w.turns ? `${w.turns.length} turns in this session; the turn 1 message is above, and every turn's message with what came back is on the Turn by turn tab. The chat, ${fmt(words(w.chat))} words, is on the Chat tab` : s.slug === "chat" ? (w.joke ? `The joke, ${fmt(words(w.joke))} words, on The joke tab; then the chat, ${fmt(words(w.chat))} words, on the Chat tab` : `${fmt(words(w.chat))} words, on the Chat tab`) : `${fmt(words(w[s.slug]))} words, on ${TAB[s.slug]}`;
    return `<section class="step"><h2>${esc(titles[s.slug])}<small>session ${i + 1} of ${w.steps.length}${s.slug !== "chat" ? from : ""}${s.slug === "chat" && w.turns ? (run.template ? ", improvisation 1 of " : ", turn 1 of ") + w.turns.length : ""}</small></h2>${s.note ? `<p class="meta">${esc(s.note)}</p>` : ""}
      <div class="role">System prompt</div>${docHTML(s.system)}
      <div class="role">User message</div>${s.user.map(x => segHTML(x, w)).join("")}
      <div class="role">What came back</div><p class="meta">${out}.</p>
      <details class="raw"><summary>The exact text, as sent</summary><pre class="prompt">${esc(raw)}</pre></details>
    </section>`;
  }).join(`<p class="arrow">↓</p>`);
  return `<p class="meta">${esc(run.about)}</p>
    <p class="meta">${run.template ? `The chat is one session with ${esc(run.model)}. Below is what Claude read first; every improvisation that followed is on the Improvisations tab. The premise and the two descriptions are folded where they occur; open them to read them in place.` : `Every session is one call to ${esc(run.model || "the model")}, reasoning ${esc(run.reasoning || "default")}. Below is what ${esc(w.name)} read, in the order they read it. The brief and the pasted profiles are folded where they occur; open them to read them in place.`}</p>
    ${flow}${cards}`;
}

function render() {
  const run = R();
  if (!run.writers.some(x => x.id === st.w)) st.w = run.writers[0].id;
  const w = run.writers.find(x => x.id === st.w);
  if (!viewsFor(w).some(([v]) => v === st.v)) st.v = "chat";
  document.getElementById("runs").innerHTML = D.runs.map(x =>
    `<button class="chip" id="r-${x.id}" aria-pressed="${x.id === run.id}" data-r="${x.id}">${esc(x.label)}</button>`).join("");
  document.getElementById("writers").innerHTML = run.writers.map(x =>
    `<button class="chip" id="w-${x.id}" aria-pressed="${x.id === st.w}" data-w="${x.id}">${esc(x.name)}</button>`).join("");
  document.getElementById("tabs").innerHTML = viewsFor(w).map(([v, label]) => {
    const n = v === "how" ? "" : v === "turns" ? `<span>${w.turns.length}</span>` : `<span>${words(w[v]).toLocaleString()}w</span>`;
    return `<button class="tab" role="tab" id="t-${v}" aria-selected="${v === st.v}" data-v="${v}">${v === "turns" && run.template ? "Improvisations" : label}${n}</button>`;
  }).join("");
  document.getElementById("pair").textContent = run.title || "Reuben & Brick";
  const view = document.getElementById("view");
  if (st.v === "chat") {
    const tallied = run.tally && w.turns;
    const TALLY_NOTE = tallied ? ` Next to ${esc(run.player)}'s name, each improvisation: whether the move landed (+1), did nothing (0) or backfired (\u22121), and the balance, which starts at 0. Where it stands at the end decides the date.` : "";
    const body = tallied ? tallyChatHTML(w, run) : chatHTML(w.chat, run);
    view.innerHTML = run.template ? `<p class="meta">Claude's chat on ${esc(w.by)}'s ${esc(run.pair_text)}, written improvisation by improvisation from Pinder's premise, those two descriptions, and one theme and one method for the whole chat.${TALLY_NOTE}</p>` + body : `<p class="meta">${esc(w.name)}: the chat between their own ${esc(run.pair_text || "Reuben and Brick")}, ${w.characters ? "written from their own brief and what they wrote about the two characters" : "written from the brief and those two profiles"}.${TALLY_NOTE}</p>` + body;
  } else if (st.v === "turns") {
    view.innerHTML = run.template ? `<p class="meta">Each improvisation, the game's account of what happened (in grey) was sent to Claude, in one resumed session; under it is what came back. The account is assembled from fixed pieces of text by the dice; nothing in it is written for this chat.</p>` +
      w.turns.map(x => `<section class="turn"><h2>Improvisation ${x.n}${run.tally && run.tally.points[x.n - 1] !== undefined ? scoreHTML(run.tally, x.n - 1) : ""}</h2><div class="game">${docHTML(x.game)}</div>${chatHTML(x.lines.join("\n"), run)}</section>`).join("") + (run.tally ? verdictHTML(run.tally) : "") : `<p class="meta">Each turn, the game's account of what happened (in grey) was sent to ${esc(w.name)}, in one session; under it is what they wrote back. The account is assembled from fixed pieces of text by the dice; nothing in it is written for this writer.</p>` +
      w.turns.map(x => `<section class="turn"><h2>Turn ${x.n}${run.tally && run.tally.points[x.n - 1] !== undefined ? scoreHTML(run.tally, x.n - 1) : ""}</h2><div class="game">${docHTML(x.game)}</div>${chatHTML(x.lines.join("\n"), run)}</section>`).join("") + (run.tally ? verdictHTML(run.tally) : "");
  } else if (st.v === "joke") {
    view.innerHTML = `<p class="meta">Before writing the chat, ${esc(w.name)} worked it out under its own heading, as the prompt asked (How it was made has the exact wording). The chat's reader never sees this; it is saved apart from the chat, and the chat is scored without it.</p>` + docHTML(w.joke);
  } else if (st.v === "characters") {
    view.innerHTML = run.template ? `<p class="meta">${esc(w.by)}'s descriptions of the two characters from ${esc(run.profiles_from)}, as Claude read them: their take on how the two clash or click is left out.</p>` + docHTML(w.characters) : `<p class="meta">${esc(w.name)}'s take on both characters and how the two clash or click, written in one session from their own brief and the game's notes on both.</p>` + docHTML(w.characters);
  } else if (st.v === "ownbrief") {
    view.innerHTML = `<p class="meta">Pinder's brief, as ${esc(w.name)} rewrote it in their own words from the short brief. It is the brief they read in both later sessions.</p>` + docHTML(w.ownbrief);
  } else if (st.v === "how") {
    view.innerHTML = howHTML(run, w);
  } else {
    view.innerHTML = `<p class="meta">${esc(w.name)}'s ${st.v === "reuben" ? "Reuben" : "Brick"}, written from the brief and the game's fragments for the character.</p>` + docHTML(w[st.v]);
  }
  const h = "#" + run.id + "-" + st.w + "-" + st.v;
  if (location.hash !== h) history.replaceState(null, "", h);
  try { localStorage.setItem("pinder-writers", JSON.stringify(st)); } catch (e) {}
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-w]"), t = e.target.closest("[data-v]"), r = e.target.closest("[data-r]");
  if (r) { st.r = r.dataset.r; render(); window.scrollTo(0, 0); }
  if (c) { st.w = c.dataset.w; render(); window.scrollTo(0, 0); }
  if (t) { st.v = t.dataset.v; render(); window.scrollTo(0, 0); }
});
window.addEventListener("hashchange", () => { fromHash(); render(); });
try { const s = JSON.parse(localStorage.getItem("pinder-writers") || "null"); if (s && D.runs.some(x => x.id === s.r)) st = s; } catch (e) {}
if (location.hash) fromHash();
render();
</script>
