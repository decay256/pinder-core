<meta charset="utf-8">
<title>Writers' Pinder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a sticky picker (writer, then view) over one reading column; chats as a phone thread. */
:root {
  --bg: #f6f5f8; --surface: #ffffff; --line: #e2dfe8; --fg: #1d1a24; --muted: #6b6578;
  --accent: #a3245a; --accent-fg: #ffffff; --them: #ebe8f0; --them-fg: #1d1a24; --note: #8a8396;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131a; --surface: #1e1b25; --line: #322d3c; --fg: #ece9f2; --muted: #a39cb1;
  --accent: #d9518c; --accent-fg: #1a0b12; --them: #2b2734; --them-fg: #ece9f2; --note: #8f889c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15131a; --surface: #1e1b25; --line: #322d3c; --fg: #ece9f2; --muted: #a39cb1;
  --accent: #d9518c; --accent-fg: #1a0b12; --them: #2b2734; --them-fg: #ece9f2; --note: #8f889c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
h1 { font: 700 1.25rem/1.2 var(--display); margin: 0; text-wrap: balance; }
h1 small { font: 400 .8rem var(--body); color: var(--muted); margin-left: .4em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
.row::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 500 .88rem var(--body); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
#runs .chip { border-radius: 6px; font-size: .8rem; padding: 4px 10px; }
#runs .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; border-top: 1px solid var(--line); padding-top: 8px; }
.tab { white-space: nowrap; background: none; border: 0; padding: 2px 0 6px; font: 600 .9rem var(--body); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab span { font: 400 .75rem var(--mono); color: var(--muted); margin-left: 4px; }
main .wrap { padding-block: 20px 64px; }
.meta { color: var(--muted); font-size: .85rem; margin: 0 0 18px; }
/* chat */
.thread { display: flex; flex-direction: column; gap: 3px; }
.who { font: 600 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 2px; }
.who.me { align-self: flex-end; }
.b { max-width: 82%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.b.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.b.them { align-self: flex-start; background: var(--them); color: var(--them-fg); border-bottom-left-radius: 6px; }
.note { align-self: center; text-align: center; color: var(--note); font-size: .82rem; font-style: italic; margin: 10px 8%; white-space: pre-wrap; }
/* profile */
.doc { min-width: 0; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--display); line-height: 1.25; text-wrap: balance; margin: 1.6em 0 .5em; }
.doc h1 { font-size: 1.5rem; } .doc h2 { font-size: 1.2rem; } .doc h3 { font-size: 1.05rem; } .doc h4 { font-size: 1rem; }
.doc > :first-child { margin-top: 0; }
.doc p, .doc li { max-width: 68ch; }
.doc blockquote { margin: 1em 0; padding: 2px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc code { font: .85em var(--mono); background: var(--them); padding: 1px 4px; border-radius: 4px; }
.doc pre { overflow-x: auto; background: var(--them); padding: 12px; border-radius: 8px; }
.doc table { border-collapse: collapse; display: block; overflow-x: auto; }
.doc td, .doc th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
pre.prompt { white-space: pre-wrap; overflow-wrap: anywhere; font: .8rem/1.5 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
details { margin: 0 0 14px; }
/* how it was made: one card per session, in the order the writer read it */
.flow { margin: 0 0 22px; padding-left: 1.2em; }
.flow li { margin: 0 0 4px; max-width: 68ch; }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px 16px 4px; margin: 0 0 18px; }
.step h2 { font: 700 1.1rem/1.25 var(--display); margin: 0 0 4px; text-wrap: balance; }
.step h2 small { font: 400 .8rem var(--body); color: var(--muted); margin-left: .4em; }
.role { font: 600 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 16px 0 6px; }
.step .doc { font-size: .95rem; }
.step .doc h1 { font-size: 1.2rem; } .step .doc h2 { font-size: 1.05rem; } .step .doc h3 { font-size: .98rem; }
details.insert { border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; padding: 8px 12px; margin: 12px 0; }
details.insert summary { font: 600 .88rem var(--body); }
details.insert[open] summary { margin-bottom: 8px; }
details.raw summary { font: 500 .82rem var(--body); color: var(--muted); }
.arrow { text-align: center; color: var(--muted); font-size: .85rem; margin: -8px 0 10px; }
summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .b, .note { animation: none; } }
</style>

<header>
  <div class="wrap">
    <h1>Reuben &amp; Brick <small>one chat per writer</small></h1>
    <div class="row" id="runs" role="group" aria-label="Run"></div>
    <div class="row" id="writers" role="group" aria-label="Writer"></div>
    <div class="tabs" role="tablist" aria-label="What to read" id="tabs"></div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const D = __DATA__;
const VIEWS = [["chat", "Chat"], ["reuben", "Reuben"], ["brick", "Brick"], ["how", "How it was made"]];
let st = { r: D.runs[0].id, w: D.runs[0].writers[0].id, v: "chat" };
const R = () => D.runs.find(x => x.id === st.r) || D.runs[0];

function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  for (const r of D.runs) for (const w of r.writers) for (const [v] of VIEWS)
    if (h === r.id + "-" + w.id + "-" + v) { st = { r: r.id, w: w.id, v }; return; }
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function words(s) { return (s.trim().match(/\S+/g) || []).length; }

function chatHTML(text) {
  const me = D.player, them = D.match;
  const re = new RegExp("^\\s*(?:\\*\\*)?(" + me + "|" + them + ")(?:\\*\\*)?\\s*:\\s*(?:\\*\\*)?\\s*(.*)$");
  let out = [], last = null;
  for (const raw of text.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) continue;
    const m = line.match(re);
    if (m) {
      const who = m[1] === me ? "me" : "them";
      if (who !== last) out.push(`<div class="who ${who}">${esc(m[1])}</div>`);
      out.push(`<div class="b ${who}">${esc(m[2].replace(/\*\*$/, ""))}</div>`);
      last = who;
    } else if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
      continue;
    } else {
      out.push(`<div class="note">${esc(line.replace(/^#+\s*/, "").replace(/^\*+|\*+$/g, ""))}</div>`);
      last = null;
    }
  }
  return `<div class="thread">${out.join("")}</div>`;
}
function docHTML(md) {
  try { return `<div class="doc">${marked.parse(md)}</div>`; }
  catch (e) { return `<pre class="prompt">${esc(md)}</pre>`; }
}

const fmt = n => n.toLocaleString("en-GB");
function segText(seg, w) {
  if (seg.t === "md") return seg.s;
  if (seg.t === "brief") return D.briefs[seg.id];
  return w[seg.who];
}
function segHTML(seg, w) {
  if (seg.t === "md") return docHTML(seg.s);
  if (seg.t === "brief") {
    const b = D.briefs[seg.id];
    return `<details class="insert"><summary>The brief · ${fmt(words(b))} words</summary>${docHTML(b)}</details>`;
  }
  const n = D.names[seg.who];
  return `<details class="insert"><summary>${esc(n)}, as ${esc(w.name)} wrote ${D.pron[seg.who]} in step ${seg.who === "reuben" ? 1 : 2} ·${fmt(words(w[seg.who]))} words</summary>${docHTML(w[seg.who])}</details>`;
}
function howHTML(run, w) {
  const from = run.profiles_from ? ` in ${run.profiles_from}` : "";
  const flow = `<ol class="flow">
    <li>${esc(w.name)} writes ${esc(D.names.reuben)}${from}: a session of its own, with the system prompt, then the brief, then the task and the game's fragments for him.</li>
    <li>${esc(w.name)} writes ${esc(D.names.brick)}${from}: another session of its own, the same way, at the same time.</li>
    <li>A new session for the chat: the same system prompt, the brief, and the two profiles from steps 1 and 2, pasted in as written. Nothing else from those sessions carries over.</li>
  </ol>`;
  const titles = { reuben: `Step 1 · ${D.names.reuben}`, brick: `Step 2 · ${D.names.brick}`, chat: "Step 3 · The chat" };
  const cards = w.steps.map((s, i) => {
    const raw = "<!-- system prompt -->\n" + s.system + "\n\n<!-- user message -->\n" + s.user.map(x => segText(x, w)).join("");
    const out = s.slug === "chat" ? `${fmt(words(w.chat))} words, on the Chat tab` : `${fmt(words(w[s.slug]))} words, on the ${s.slug === "reuben" ? "Reuben" : "Brick"} tab`;
    return `<section class="step"><h2>${esc(titles[s.slug])}<small>session ${i + 1} of 3${s.slug !== "chat" ? from : ""}</small></h2>${s.note ? `<p class="meta">${esc(s.note)}</p>` : ""}
      <div class="role">System prompt</div>${docHTML(s.system)}
      <div class="role">User message</div>${s.user.map(x => segHTML(x, w)).join("")}
      <div class="role">What came back</div><p class="meta">${out}.</p>
      <details class="raw"><summary>The exact text, as sent</summary><pre class="prompt">${esc(raw)}</pre></details>
    </section>`;
  }).join(`<p class="arrow">↓</p>`);
  return `<p class="meta">${esc(run.about)}</p>
    <p class="meta">Every session is one call to ${esc(run.model || "the model")}, reasoning ${esc(run.reasoning || "default")}. Below is what ${esc(w.name)} read, in the order they read it. The brief and the pasted profiles are folded where they occur; open them to read them in place.</p>
    ${flow}${cards}`;
}

function render() {
  const run = R();
  if (!run.writers.some(x => x.id === st.w)) st.w = run.writers[0].id;
  const w = run.writers.find(x => x.id === st.w);
  document.getElementById("runs").innerHTML = D.runs.map(x =>
    `<button class="chip" id="r-${x.id}" aria-pressed="${x.id === run.id}" data-r="${x.id}">${esc(x.label)}</button>`).join("");
  document.getElementById("writers").innerHTML = run.writers.map(x =>
    `<button class="chip" id="w-${x.id}" aria-pressed="${x.id === st.w}" data-w="${x.id}">${esc(x.name)}</button>`).join("");
  document.getElementById("tabs").innerHTML = VIEWS.map(([v, label]) => {
    const n = v === "how" ? "" : `<span>${words(w[v]).toLocaleString()}w</span>`;
    return `<button class="tab" role="tab" id="t-${v}" aria-selected="${v === st.v}" data-v="${v}">${label}${n}</button>`;
  }).join("");
  const view = document.getElementById("view");
  if (st.v === "chat") {
    view.innerHTML = `<p class="meta">${esc(w.name)}: the chat between their own Reuben and Brick, written from the brief and those two profiles.</p>` + chatHTML(w.chat);
  } else if (st.v === "how") {
    view.innerHTML = howHTML(run, w);
  } else {
    view.innerHTML = `<p class="meta">${esc(w.name)}'s ${st.v === "reuben" ? "Reuben" : "Brick"}, written from the brief and the game's fragments for the character.</p>` + docHTML(w[st.v]);
  }
  const h = "#" + run.id + "-" + st.w + "-" + st.v;
  if (location.hash !== h) history.replaceState(null, "", h);
  try { localStorage.setItem("pinder-writers", JSON.stringify(st)); } catch (e) {}
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-w]"), t = e.target.closest("[data-v]"), r = e.target.closest("[data-r]");
  if (r) { st.r = r.dataset.r; render(); window.scrollTo(0, 0); }
  if (c) { st.w = c.dataset.w; render(); window.scrollTo(0, 0); }
  if (t) { st.v = t.dataset.v; render(); window.scrollTo(0, 0); }
});
window.addEventListener("hashchange", () => { fromHash(); render(); });
try { const s = JSON.parse(localStorage.getItem("pinder-writers") || "null"); if (s && D.runs.some(x => x.id === s.r)) st = s; } catch (e) {}
if (location.hash) fromHash();
render();
</script>
